@if (label(); as label) {
  <label [for]="selectId()"
    >{{ label }}
    @if (mandatory()) {
      <span>*</span>
    }
  </label>
}

<select
  class="select"
  [attr.aria-label]="label()"
  [attr.aria-describedby]="describedBy()"
  [id]="selectId()"
  [value]="normalizedValue()"
  [disabled]="disabled()"
  (change)="onChangeSelection($event)"
  (blur)="onBlur()"
>
  @for (option of options(); track $index) {
    <option [value]="normalizeValue(option.value)" [selected]="isSelected(option.value)">{{ option.text }}</option>
  }
</select>

@if (hint()) {
  <small [id]="hintId()">{{ hint() }}</small>
}

@if (showError()) {
  <small class="error" [id]="errorId()">
    @if (hasRequiredError()) {
      {{ ('Validation.Required' | signalTranslate)() }}
    }
    <ng-content select="[errors]"></ng-content>
  </small>
}
