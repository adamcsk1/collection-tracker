@if (label(); as label) {
  <label [for]="selectId()"
    >{{ label }}
    @if (mandatory()) {
      <span>*</span>
    }
  </label>
}

<select
  class="select"
  [id]="selectId()"
  [formControl]="control()"
  [attr.aria-label]="label()"
  [attr.aria-describedby]="describedBy()"
>
  @for (option of options(); track $index) {
    <option [value]="option.value">{{ option.text }}</option>
  }
</select>

@if (hint()) {
  <small [id]="hintId()">{{ hint() }}</small>
}

@if (control().touched || control().dirty) {
  @if (control().errors; as errors) {
    <small class="error" [id]="errorId()">
      @if (!!errors?.['required']) {
        {{ ('Validation.Required' | signalTranslate)() }}
      }
      <ng-content select="[errors]"></ng-content>
    </small>
  }
}
