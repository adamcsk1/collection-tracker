@if (label(); as label) {
  <label [for]="textareaId()">
    {{ label }}
    @if (mandatory()) {
      <span>*</span>
    }
  </label>
}

<textarea
  #textarea
  class="textarea"
  [attr.aria-label]="label()"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-required]="mandatory() ? 'true' : null"
  [attr.aria-invalid]="showError() ? 'true' : null"
  [id]="textareaId()"
  [rows]="rows()"
  [cols]="cols()"
  [attr.placeholder]="placeholder()"
  [value]="value() ?? ''"
  [disabled]="disabled()"
  (input)="onInput($event)"
  (blur)="onBlur()"
></textarea>

@if (hint()) {
  <small [id]="hintId()">{{ hint() }}</small>
}
@if (showError()) {
  <small class="error" [id]="errorId()" role="alert">
    @if (hasRequiredError()) {
      {{ translations.validationRequired() }}
    }
    <ng-content select="[errors]"></ng-content>
  </small>
}
