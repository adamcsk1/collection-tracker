@if (label(); as label) {
  <label [for]="textareaId()"
    >{{ label }}
    @if (mandatory()) {
      <span>*</span>
    }
  </label>
}

<textarea
  #textarea
  class="textarea"
  [attr.aria-label]="label()"
  [attr.aria-describedby]="describedBy()"
  [id]="textareaId()"
  [rows]="rows()"
  [cols]="cols()"
  [value]="value()"
  [disabled]="isDisabled()"
  (input)="onInput($event)"
  (blur)="onBlur()"
></textarea>

@if (hint()) {
  <small [id]="hintId()">{{ hint() }}</small>
}

@if (control(); as control) {
  @if (control.touched || control.dirty) {
    @if (control.errors; as errors) {
      <small class="error" [id]="errorId()">
        @if (!!errors?.['required']) {
          {{ ('Validation.Required' | signalTranslate)() }}
        }
        <ng-content select="[errors]"></ng-content>
      </small>
    }
  }
}
