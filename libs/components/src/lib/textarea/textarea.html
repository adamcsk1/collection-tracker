@if (label(); as label) {
  <label [for]="textareaId()">
    @if (labelIcon(); as labelIcon) {
      <i class="material-icons" role="img" [attr.aria-label]="labelIconHint()" [title]="labelIconHint()">
        {{ labelIcon }}
      </i>
    }
    {{ label }}
    @if (mandatory()) {
      <span>*</span>
    }
  </label>
}

<textarea
  #textarea
  class="textarea"
  [attr.aria-label]="label()"
  [attr.aria-describedby]="describedBy()"
  [id]="textareaId()"
  [rows]="rows()"
  [cols]="cols()"
  [value]="value() ?? ''"
  [disabled]="disabled()"
  (input)="onInput($event)"
  (blur)="onBlur()"
></textarea>

@if (hint()) {
  <small [id]="hintId()">{{ hint() }}</small>
}

@if (showError()) {
  <small class="error" [id]="errorId()">
    @if (hasRequiredError()) {
      {{ ('Validation.Required' | signalTranslate)() }}
    }
    <ng-content select="[errors]"></ng-content>
  </small>
}
