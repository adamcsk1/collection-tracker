<a
  class="link-button"
  [href]="href()"
  [attr.data-test-id]="dataTestId() || null"
  [attr.target]="external() ? '_blank' : null"
  [attr.rel]="external() ? 'noopener noreferrer' : null"
>
  <i class="material-icons" aria-hidden="true">{{ icon() }}</i>
  <span>{{ label() }}</span>
  @if (external()) {
    <span class="visually-hidden"> ({{ translations.opensInNewTab() }})</span>
    <i class="material-icons link-button-external" aria-hidden="true">open_in_new</i>
  }
</a>
