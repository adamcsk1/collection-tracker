<div class="dialog-frame">
  <div class="dialog-header">
    <div>
      <ng-content select="[dialog-shell-top-content]" />
    </div>
    <button class="button-icon material-icons" [title]="('Close' | signalTranslate)()" (click)="onClose()">
      close
    </button>
  </div>
  <ng-content select="[dialog-shell-content]" />
  <div class="dialog-footer">
    <ng-content select="[dialog-shell-bottom-content]" />
  </div>
</div>
