<button
  type="button"
  class="dialog-overlay"
  tabindex="-1"
  animate.enter="animation-fade-in"
  animate.leave="animation-fade-out"
  [attr.aria-label]="translations.close()"
  (click)="onClose()"
></button>
<div
  #dialogRoot
  class="dialog-frame"
  role="dialog"
  aria-modal="true"
  tabindex="-1"
  animate.enter="animation-slide-in-left"
  animate.leave="animation-slide-out-left"
  (keydown.escape)="onClose()"
>
  <div class="dialog-header">
    <div>
      <ng-content select="[dialog-shell-top-content]" />
    </div>
    <div class="dialog-header-actions">
      @if (hasMenuContent()) {
        <button
          type="button"
          data-test-id="dialog-actions-menu-button"
          class="button-icon material-icons"
          [attr.aria-controls]="actionsMenuId"
          [attr.aria-expanded]="menuOpen()"
          [attr.aria-label]="translations.moreActions()"
          [title]="translations.moreActions()"
          (click)="onToggleMenu()"
        >
          more_vert
        </button>
      } @else {
        <button
          type="button"
          data-test-id="dialog-close-button"
          class="button-icon material-icons"
          [attr.aria-label]="translations.close()"
          [title]="translations.close()"
          (click)="onClose()"
        >
          close
        </button>
      }
      <div
        [id]="actionsMenuId"
        data-test-id="dialog-actions-menu"
        class="dialog-actions-menu"
        [class.dialog-actions-menu-open]="menuOpen()"
        [attr.hidden]="hasMenuContent() && menuOpen() ? null : ''"
      >
        <div #menuContent class="dialog-actions-menu-content">
          <ng-content select="[dialog-shell-menu-content]" />
        </div>
        <button type="button" data-test-id="dialog-actions-close-button" class="button-borderless" (click)="onClose()">
          <i class="material-icons" aria-hidden="true">close</i>
          {{ translations.close() }}
        </button>
      </div>
    </div>
  </div>
  <div class="dialog-body">
    <ng-content select="[dialog-shell-content]" />
  </div>
  <div class="dialog-footer">
    <ng-content select="[dialog-shell-bottom-content]" />
  </div>
</div>
