@if (showBlockerLoading()) {
  <div class="blocker-loading" role="alert" aria-live="assertive" animate.leave="animation-fade-out">
    <div>
      <img [src]="'icons/' + themeLogo()" [alt]="('Title' | signalTranslate)()" />
      <h1>{{ ('Title' | signalTranslate)() }}</h1>
    </div>
    <div class="loading">
      {{ message() ? message() : ('Message.Loading' | signalTranslate)() }}
      <span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
  </div>
}
