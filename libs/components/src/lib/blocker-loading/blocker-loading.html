@if (showBlockerLoading()) {
  <div class="blocker-loading" role="alert" aria-live="assertive" animate.leave="animation-fade-out">
    <div>
      <img
        [src]="'icons/' + themeLogo()"
        width="100"
        height="100"
        fetchpriority="high"
        decoding="sync"
        [alt]="translations.title()"
      />
      <h1 class="app-title-style">{{ translations.title() }}</h1>
    </div>
    <div class="loading">
      {{ message() ? message() : translations.messageLoading() }}
      <span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
  </div>
}
