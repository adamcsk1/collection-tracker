<div
  class="tabs-list"
  role="tablist"
  aria-orientation="horizontal"
  [attr.aria-label]="ariaLabel()"
  [attr.data-test-id]="idPrefix() + '-tabs'"
>
  @for (option of options(); track option.value; let index = $index) {
    <button
      #tabButton
      type="button"
      role="tab"
      [id]="tabId(index)"
      [attr.data-test-id]="option.dataTestId"
      [attr.aria-selected]="isSelected(index)"
      [attr.aria-controls]="panelId(index)"
      [attr.tabindex]="isSelected(index) ? 0 : -1"
      [disabled]="option.disabled"
      (click)="onSelect(index)"
      (keydown)="onKeydown($event, index)"
    >
      {{ option.label }}
    </button>
  }
</div>
<div
  role="tabpanel"
  tabindex="0"
  [id]="panelId(0)"
  [attr.data-test-id]="panelTestId(0)"
  [attr.aria-labelledby]="tabId(0)"
  [hidden]="!isSelected(0)"
>
  <ng-content select="[tabs-first-content]" />
</div>
<div
  role="tabpanel"
  tabindex="0"
  [id]="panelId(1)"
  [attr.data-test-id]="panelTestId(1)"
  [attr.aria-labelledby]="tabId(1)"
  [hidden]="!isSelected(1)"
>
  <ng-content select="[tabs-second-content]" />
</div>
