@if (label(); as label) {
  <label [for]="inputId()">
    {{ label }}
    @if (mandatory()) {
      <span>*</span>
    }
  </label>
}
<div class="input">
  @if (suggestions().length) {
    <div
      class="input-suggestions-pane"
      [class.input-suggestions-pane-small]="showReset()"
      [class.input-suggestions-pane-above]="showSuggestionsAbove()"
    >
      <button
        class="input-suggestions-close button-icon material-icons"
        [attr.aria-label]="translations.closeSuggestions()"
        [title]="translations.closeSuggestions()"
        (click)="onCloseSuggestion()"
      >
        close
      </button>
      <ul
        class="input-suggestions"
        role="listbox"
        id="autocomplete-suggestions-list"
        [attr.aria-label]="translations.suggestions()"
      >
        @for (suggestion of suggestions(); track $index) {
          <li>
            <button
              type="button"
              role="option"
              class="button-custom"
              [class.input-suggestion-selected]="$index === selectedSuggestion()"
              [attr.id]="'autocomplete-suggestion-' + $index"
              [attr.aria-selected]="$index === selectedSuggestion()"
              [attr.aria-label]="suggestion"
              (click)="onAcceptSuggestion($index)"
            >
              {{ formatSuggestionText(suggestion) }}
            </button>
          </li>
        }
      </ul>
    </div>
  }

  <div
    class="input-box"
    [class.input-box-with-pane]="suggestions().length"
    [class.input-box-with-pane-above]="suggestions().length && showSuggestionsAbove()"
    [class.input-box-focused]="focused()"
  >
    <input
      #inputElement
      [id]="inputId()"
      type="text"
      role="combobox"
      aria-autocomplete="list"
      aria-haspopup="listbox"
      aria-multiline="false"
      [attr.aria-expanded]="suggestions().length > 0"
      [attr.aria-controls]="suggestions().length ? 'autocomplete-suggestions-list' : null"
      [attr.aria-activedescendant]="
        suggestions().length && selectedSuggestion() !== -1 ? 'autocomplete-suggestion-' + selectedSuggestion() : null
      "
      [attr.aria-label]="placeholder()"
      [attr.aria-describedby]="describedBy()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [value]="value() ?? ''"
      (keypress)="onKeypress($event)"
      (keydown)="onKeydown($event)"
      (keyup)="onKeyup($event)"
      (blur)="onBlur()"
      (focus)="onFocus()"
    />
  </div>

  @if (showReset() && hasValue() && !disabled()) {
    <button
      class="button-icon material-icons"
      [attr.aria-label]="translations.resetInput()"
      [title]="translations.resetInput()"
      (click)="onReset()"
    >
      backspace
    </button>
  }
</div>
<div class="input-messages">
  @if (hint()) {
    <small [id]="hintId()">{{ hint() }}</small>
  }
  @if (showError()) {
    <small class="error" [id]="errorId()">
      @if (hasRequiredError()) {
        {{ translations.validationRequired() }}
      }
      <ng-content select="[errors]"></ng-content>
    </small>
  }
</div>
