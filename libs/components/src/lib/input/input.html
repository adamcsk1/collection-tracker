@if (label(); as label) {
  <label [for]="inputId()"
    >{{ label }}
    @if (mandatory()) {
      <span>*</span>
    }
  </label>
}
<div class="container" [class.has-icon]="icon()">
  <i class="material-icons">{{ icon() }}</i>
  <input
    [type]="type()"
    class="input"
    [id]="inputId()"
    [formControl]="control()"
    [placeholder]="placeholder()"
    [attr.aria-label]="label() || placeholder()"
    [attr.aria-describedby]="describedBy()"
  />
  @if (showReset()) {
    <button
      class="button-icon material-icons"
      (click)="onReset()"
      [title]="('ResetInput' | signalTranslate)()"
      [attr.aria-label]="('ResetInput' | signalTranslate)()"
      [disabled]="!hasValue()"
    >
      close
    </button>
  }
</div>

@if (hint()) {
  <small [id]="hintId()">{{ hint() }}</small>
}

@if (control().touched || control().dirty) {
  @if (control().errors; as errors) {
    <small class="error" [id]="errorId()">
      @if (!!errors?.['required']) {
        {{ ('Validation.Required' | signalTranslate)() }}
      }
      <ng-content select="[errors]"></ng-content>
    </small>
  }
}
