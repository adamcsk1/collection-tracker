@if (label(); as label) {
  <label [for]="inputId()">
    {{ label }}
    @if (mandatory()) {
      <span>*</span>
    }
  </label>
}
<div class="container" [class.has-icon]="icon()">
  <i class="material-icons" aria-hidden="true">{{ icon() }}</i>
  <input
    class="input"
    [attr.aria-label]="label() || placeholder()"
    [attr.aria-describedby]="describedBy()"
    [type]="type()"
    [id]="inputId()"
    [value]="value() ?? ''"
    [attr.min]="min() ?? null"
    [attr.max]="max() ?? null"
    [attr.step]="step() ?? null"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
  @if (showReset() && hasValue() && !disabled()) {
    <button
      class="button-icon material-icons"
      [attr.data-test-id]="resetButtonDataTestId() ?? null"
      [attr.aria-label]="translations.resetInput()"
      [title]="translations.resetInput()"
      (click)="onReset()"
    >
      backspace
    </button>
  }
</div>

@if (hint()) {
  <small [id]="hintId()">{{ hint() }}</small>
}
@if (showError()) {
  <small class="error" [id]="errorId()">
    @if (hasRequiredError()) {
      {{ translations.validationRequired() }}
    }
    <ng-content select="[errors]"></ng-content>
  </small>
}
