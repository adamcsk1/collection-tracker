  /collection-items/statistics:
    get:
      operationId: getStatistics
      summary: Get collection statistics
      description: >-
        Returns statistics for the authenticated viewer's default readable library scope, folding readable books-list
        books into library movies and series. Omit `type` for an all-media summary, or provide `movie`, `series`, or
        `book` for that media scope. Tracking statuses use the current viewer's tracking items matched by canonical or
        exact external identity. Media-type chart counts are available only in all-media scope; status chart counts are
        available only in a specific media scope.
      tags: [Collection]
