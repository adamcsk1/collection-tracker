        data:
          $ref: '#/components/schemas/GenreSuggestionsResponse'
    CollectionItemExistsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CollectionItemExistsResponse'
    RandomImagesEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RandomImagesResponse'
    CollectionStatisticsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CollectionStatisticsResponse'
    CountEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MarkAllCompletedResponse'
    MarkAllSeriesCompletedEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MarkAllSeriesCompletedResponse'
    RefreshImagesEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RefreshImagesResponse'
    RefreshExternalRatingsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RefreshExternalRatingsResponse'
    TrackingSeasonsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TrackingSeasonsResponse'
    TrackingCompletedEpisodesEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TrackingCompletedEpisodesResponse'
    ExternalMetadataItemEnvelope:
      type: object
