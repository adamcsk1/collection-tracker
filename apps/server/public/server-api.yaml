openapi: 3.1.0
info:
  title: Collection Tracker API
  version: 1.0.0
  description: REST API for the Collection Tracker server.

servers:
  - url: '{scheme}://{host}/api/v1'
    description: API base path
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:4200
        description: Host and port of the server.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: CT.Token
      description: Signed HTTP-only access-token cookie set by POST /sign-in. Valid for 15 minutes. Automatically refreshed via POST /session/refresh when expired.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtained via POST /user/access-token for header-based clients.

  schemas:
    HealthResponse:
      type: object
      required: [status, memory, cpu, disk, load, frontend]
      properties:
        status:
          type: string
          enum: [ok, warn, error]
        memory:
          type: object
          required: [usedPercent]
          properties:
            usedPercent:
              type: number
        cpu:
          type: object
          required: [usagePercent]
          properties:
            usagePercent:
              type: number
        disk:
          oneOf:
            - type: object
              required: [usedPercent]
              properties:
                usedPercent:
                  type: number
            - type: 'null'
        load:
          type: object
          required: [avg1m, avg5m, avg15m]
          properties:
            avg1m:
              type: number
            avg5m:
              type: number
            avg15m:
              type: number
        frontend:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [up, down]

    SignUpRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string

    SignUpResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Long-lived user token for this account.

    SignInRequest:
      type: object
      required: [username, token]
      properties:
        username:
          type: string
        token:
          type: string

    ChangeTokenResponse:
      type: object
      required: [newToken]
      properties:
        newToken:
          type: string

    AccessToken:
      type: object
      required: [tokenHash, createdAt, userAgent, expiresAt]
      properties:
        tokenHash:
          type: string
        createdAt:
          type: string
          format: date-time
        userAgent:
          type: string
        expiresAt:
          type: ['string', 'null']
          format: date-time
          description: Null for tokens created via POST /user/access-token (intended for header-based usage).

    RefreshToken:
      type: object
      required: [tokenHash, createdAt, userAgent, expiresAt]
      properties:
        tokenHash:
          type: string
        createdAt:
          type: string
          format: date-time
        userAgent:
          type: string
        expiresAt:
          type: ['string', 'null']
          format: date-time

    AccessTokensResponse:
      type: array
      items:
        $ref: '#/components/schemas/AccessToken'

    CreateAccessTokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string

    UserSettingsResponse:
      type: object
      properties:
        fetchBatchSize:
          type: integer
        theme:
          type: string
          enum: [system, dark, light]
        animatedBackground:
          type: boolean
        language:
          type: string
          enum: [en]
        claudeAiAvailable:
          type: boolean
          description: Set by the server based on whether CLAUDE_API_KEY is configured. Always present in the response.

    UserSettingsRequest:
      type: object
      properties:
        fetchBatchSize:
          type: integer
        theme:
          type: string
          enum: [system, dark, light]
        animatedBackground:
          type: boolean
        language:
          type: string
          enum: [en]
        fromLogin:
          type: boolean
          description: When true, language and theme are only initialized if the user has not already stored those settings.

    CollectionItem:
      type: object
      required: [image, title, titleLower, genre, IMDbId, tags, year, rate, hash, actors, plot]
      properties:
        image:
          type: string
        title:
          type: string
        titleLower:
          type: string
          description: Lowercase cached title for faster searching.
        genre:
          type: array
          items:
            type: string
        IMDbId:
          type: string
        tags:
          type: array
          items:
            type: string
        year:
          type: ['number', 'null']
        rate:
          type: string
        hash:
          type: string
          description: SHA-512 hash of the structured item content.
        actors:
          type: string
        plot:
          type: string

    CollectionItemChange:
      type: object
      required: [image, title, genre, IMDbId, tags, year, rate, actors, plot]
      properties:
        image:
          type: string
        title:
          type: string
        genre:
          type: array
          items:
            type: string
        IMDbId:
          type: string
        tags:
          type: array
          items:
            type: string
        year:
          type: ['number', 'null']
        rate:
          type: string
        actors:
          type: string
        plot:
          type: string

    CollectionItemsResponse:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionItem'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    CollectionMatchedItemsRequest:
      type: object
      required: [imdbIds]
      properties:
        imdbIds:
          type: array
          items:
            type: string
        offset:
          type: integer
          default: 0
        limit:
          type: integer
          default: 50
        filters:
          type: object
          properties:
            search:
              type: string
            tags:
              type: array
              items:
                type: string
            genres:
              type: array
              items:
                type: string
            tagMode:
              type: string
              enum: [any, all]
            type:
              type: string
              enum: [movie, series]
            watched:
              type: boolean

    CollectionItemSuggestionsResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            type: object
            required: [label, value, kind]
            properties:
              label:
                type: string
              value:
                type: string
              kind:
                type: string
                enum: [title, tag, genre, actor, imdbId]

    TagSuggestionsResponse:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            type: string

    GenreSuggestionsResponse:
      type: object
      required: [genres]
      properties:
        genres:
          type: array
          items:
            type: string

    CollectionItemExistsResponse:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean

    RandomImagesResponse:
      type: object
      required: [images]
      properties:
        images:
          type: array
          items:
            type: string

    CollectionStatisticsResponse:
      type: object
      required: [totalItems, movieCount, seriesCount, watchedCount, unwatchedCount, tagCounts, genreCounts]
      properties:
        totalItems:
          type: integer
        movieCount:
          type: integer
        seriesCount:
          type: integer
        watchedCount:
          type: integer
        unwatchedCount:
          type: integer
        tagCounts:
          type: array
          items:
            type: object
            required: [tag, count]
            properties:
              tag:
                type: string
              count:
                type: integer
        genreCounts:
          type: array
          items:
            type: object
            required: [genre, count]
            properties:
              genre:
                type: string
              count:
                type: integer

    CreateRequest:
      $ref: '#/components/schemas/CollectionItemChange'

    CreateResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: '#/components/schemas/CollectionItem'

    ChangeRequest:
      allOf:
        - $ref: '#/components/schemas/CollectionItemChange'
        - type: object
          required: [hash]
          properties:
            hash:
              type: string
              description: Current SHA-512 hash of the item. Must match the stored hash.

    ChangeResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: '#/components/schemas/CollectionItem'

    MarkAllWatchedResponse:
      type: object
      required: [changedCount]
      properties:
        changedCount:
          type: integer

    MarkAllUnwatchedResponse:
      type: object
      required: [changedCount]
      properties:
        changedCount:
          type: integer

    RefreshImagesResponse:
      type: object
      required: [count, checked, fixed, errors]
      properties:
        count:
          type: integer
          description: Total number of collection items processed.
        checked:
          type: integer
          description: Number of images checked.
        fixed:
          type: integer
          description: Number of images updated from OMDb.
        errors:
          type: integer
          description: Number of images that could not be fixed.

    OMDbItem:
      type: object
      required: [imdbID, imdbRating, Plot, Poster, Type, Title, Year, Director, Genre, Actors]
      properties:
        imdbID:
          type: string
        imdbRating:
          type: string
        Plot:
          type: string
        Poster:
          type: string
        Type:
          type: string
        Title:
          type: string
        Year:
          type: string
        Director:
          type: string
        Genre:
          type: string
        Actors:
          type: string

    OMDbSearchResponse:
      type: object
      required: [Search]
      properties:
        Search:
          type: array
          items:
            $ref: '#/components/schemas/OMDbItem'

    ClaudeQueryRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          description: Natural-language question about the caller's collection.
          examples:
            - Which are sci-fi movies?

    ClaudeQueryResponse:
      type: object
      required: [matchedIds]
      properties:
        matchedIds:
          type: array
          items:
            type: string
          description: IMDb IDs matched by Claude from the caller's collection.
          examples:
            - - tt0133093

    TagConfig:
      type: object
      required: [tag, color, useForImageBorder, useForTextColor, useForImageBadge, weight]
      properties:
        tag:
          type: string
          examples:
            - '#example'
        color:
          type: ['string', 'null']
          examples:
            - '#112233'
        useForImageBorder:
          type: boolean
        useForTextColor:
          type: boolean
        useForImageBadge:
          type: boolean
        weight:
          type: integer

    TagConfigsResponse:
      type: array
      items:
        $ref: '#/components/schemas/TagConfig'

security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: Public
    description: Endpoints that do not require authentication.
  - name: Session
    description: Access token and session management.
  - name: User
    description: User account and settings.
  - name: Collection
    description: CRUD operations for structured collection items.
  - name: OMDb Proxy
    description: Proxy endpoints for the OMDb API. Require `OMDB_API_KEY` on the server.
  - name: Image Proxy
    description: Cached proxy endpoint for external collection item images.
  - name: Claude Proxy
    description: Proxy endpoint for the Claude AI API. Requires `CLAUDE_API_KEY` on the server.
  - name: Tag
    description: Tag colour configuration.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Server health check
      security: []
      tags: [Public]
      responses:
        '200':
          description: Health status of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /sign-up:
    post:
      operationId: signUp
      summary: Create a new account
      security: []
      tags: [Public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '200':
          description: Account created. Returns the long-lived user token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
        '400':
          description: Missing or invalid username.
        '403':
          description: Registration is disabled or the configured user limit has been reached.
        '409':
          description: A user with this username already exists.

  /sign-in:
    post:
      operationId: signIn
      summary: Sign in and obtain an access token
      security: []
      tags: [Public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Authenticated. Sets signed HTTP-only `CT.Token` (15 minutes) and `CT.RefreshToken` (7 days) cookies.
          headers:
            Set-Cookie:
              schema:
                type: string
              examples:
                access:
                  value: CT.Token=<jwt>; HttpOnly; Secure; SameSite=Strict; Max-Age=900
                refresh:
                  value: CT.RefreshToken=<jwt>; HttpOnly; Secure; SameSite=Strict; Max-Age=604800
        '400':
          description: Missing or invalid username or token.
        '401':
          description: User token is invalid.
        '404':
          description: User not found.

  /logout:
    delete:
      operationId: logout
      summary: Revoke the current access token and clear both auth cookies
      tags: [Session]
      responses:
        '204':
          description: Logged out successfully. Both CT.Token and CT.RefreshToken cookies are cleared.

  /user/change-token:
    put:
      operationId: changeUserToken
      summary: Rotate the long-lived user token
      description: Rotates the user's long-lived token and replaces both the active access and refresh token sets.
      tags: [Session]
      responses:
        '200':
          description: Token rotated. Returns the new long-lived token. Both CT.Token and CT.RefreshToken cookies are updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeTokenResponse'

  /user/access-token:
    post:
      operationId: createAccessToken
      summary: Create an additional access token for header-based clients
      description: Created tokens are stored with `expiresAt` set to null.
      tags: [Session]
      responses:
        '200':
          description: New access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccessTokenResponse'

  /user/access-tokens:
    get:
      operationId: listAccessTokens
      summary: List all stored access tokens
      description: Returns token hashes, creation dates, user agents, and expiresAt values.
      tags: [Session]
      responses:
        '200':
          description: Array of stored access token metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokensResponse'

  /user/access-token/{tokenHash}:
    delete:
      operationId: deleteAccessToken
      summary: Delete one access token by hash
      tags: [Session]
      parameters:
        - name: tokenHash
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Token deleted.

  /session/refresh:
    post:
      operationId: refreshAccessToken
      summary: Refresh the access token using the refresh token
      description: Validates the CT.RefreshToken cookie (or Authorization header) and issues a new CT.Token access-token cookie.
      tags: [Session]
      responses:
        '204':
          description: Access token refreshed. New CT.Token cookie is set.
        '401':
          description: No refresh token provided.
        '403':
          description: Refresh token is invalid, expired, or not recognized.

  /user:
    delete:
      operationId: deleteUser
      summary: Delete the current user account
      description: Deletes the user, all stored collection items, and related configuration.
      tags: [User]
      responses:
        '204':
          description: User deleted.

  /user/settings:
    get:
      operationId: getUserSettings
      summary: Get user settings
      description: 'Always includes `claudeAiAvailable` indicating whether `CLAUDE_API_KEY` is configured on the server. Returns `{ claudeAiAvailable: false }` when no settings have been stored yet.'
      tags: [User]
      responses:
        '200':
          description: Current user settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsResponse'
    post:
      operationId: updateUserSettings
      summary: Update user settings
      description: Accepts any subset of `fetchBatchSize`, `theme`, `animatedBackground`, `language`, and `fromLogin`. Returns the merged settings object.
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsRequest'
      responses:
        '200':
          description: Merged settings after update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsResponse'

  /items:
    get:
      operationId: searchItems
      summary: Search collection items
      description: Returns a server-filtered and paginated collection result. System tag filters use `type` and `watched`; custom tags use `tags`.
      tags: [Collection]
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: search
          in: query
          schema:
            type: string
        - name: tags
          in: query
          description: Comma-separated custom tags.
          schema:
            type: string
        - name: genres
          in: query
          description: Comma-separated genres.
          schema:
            type: string
        - name: tagMode
          in: query
          schema:
            type: string
            enum: [any, all]
            default: any
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, series]
        - name: watched
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Filtered collection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemsResponse'

  /items/matched:
    post:
      operationId: getMatchedItems
      summary: Get collection items from matched IMDb IDs
      description: Returns paginated items from an IMDb ID set, preserving the request order by default for AI search results.
      tags: [Collection]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionMatchedItemsRequest'
      responses:
        '200':
          description: Filtered matched collection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemsResponse'
        '400':
          description: Invalid IMDb ID list.

  /items/search-suggestions:
    get:
      operationId: getItemSearchSuggestions
      summary: Get item search suggestions
      tags: [Collection]
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Search suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemSuggestionsResponse'

  /items/exists:
    get:
      operationId: itemExists
      summary: Check whether an IMDb ID already exists
      tags: [Collection]
      parameters:
        - name: imdbId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Existing item status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemExistsResponse'
        '400':
          description: Missing IMDb ID.

  /items/random:
    get:
      operationId: getRandomItem
      summary: Get a random collection item
      description: Returns one random item from the user's collection.
      tags: [Collection]
      responses:
        '200':
          description: Random collection item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItem'
        '404':
          description: Collection is empty.

  /items/random-images:
    get:
      operationId: getRandomImages
      summary: Get random collection image URLs
      description: Returns a list of random image URLs from the user's collection.
      tags: [Collection]
      parameters:
        - name: count
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Random image URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RandomImagesResponse'

  /items/mark-all-watched:
    post:
      operationId: markAllAsWatched
      summary: Mark all collection items as watched
      description: Adds the #watched tag to every item in the user's collection that does not already have it.
      tags: [Collection]
      responses:
        '200':
          description: Number of items that were updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllWatchedResponse'

  /items/mark-all-unwatched:
    post:
      operationId: markAllAsUnwatched
      summary: Mark all collection items as unwatched
      description: Removes the #watched tag from every item in the user's collection that has it.
      tags: [Collection]
      responses:
        '200':
          description: Number of items that were updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllUnwatchedResponse'

  /items/refresh-images:
    post:
      operationId: refreshImages
      summary: Refresh collection item images
      description: Checks every collection item image through the image proxy, caches available images, and fetches updated poster URLs from OMDb for broken images.
      tags: [Collection]
      responses:
        '200':
          description: Summary of the refresh operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshImagesResponse'

  /tags/suggestions:
    get:
      operationId: getTagSuggestions
      summary: Get custom tag suggestions
      description: Internal and virtual tags are excluded unless `includeInternal=true` is provided.
      tags: [Collection]
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: includeInternal
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Tag suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagSuggestionsResponse'

  /genres/suggestions:
    get:
      operationId: getGenreSuggestions
      summary: Get genre suggestions
      tags: [Collection]
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Genre suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreSuggestionsResponse'

  /statistics:
    get:
      operationId: getStatistics
      summary: Get collection statistics
      tags: [Collection]
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: tags
          in: query
          schema:
            type: string
        - name: genres
          in: query
          schema:
            type: string
        - name: tagMode
          in: query
          schema:
            type: string
            enum: [any, all]
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, series]
        - name: watched
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Collection statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionStatisticsResponse'

  /create:
    post:
      operationId: createItem
      summary: Create a collection item
      description: Creates a structured collection item. `IMDbId` must be unique for the authenticated user.
      tags: [Collection]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        '200':
          description: Item created. Returns the stored collection item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
        '400':
          description: Request body is missing required item fields or contains invalid values.
        '409':
          description: An item with this IMDb ID already exists.

  /change/{imdbId}:
    put:
      operationId: changeItem
      summary: Update a collection item
      tags: [Collection]
      parameters:
        - name: imdbId
          in: path
          required: true
          description: IMDb ID of the item to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
      responses:
        '200':
          description: Item updated. Returns the stored collection item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeResponse'
        '400':
          description: Request body is missing required item fields or contains invalid values.
        '404':
          description: Item not found.
        '409':
          description: Hash mismatch — the stored content has changed.

  /delete/{imdbId}:
    delete:
      operationId: deleteItem
      summary: Delete a collection item
      tags: [Collection]
      parameters:
        - name: imdbId
          in: path
          required: true
          description: IMDb ID of the item to delete.
          schema:
            type: string
        - name: hash
          in: query
          required: true
          description: Current SHA-512 hash of the item. Must match the stored hash.
          schema:
            type: string
      responses:
        '204':
          description: Item deleted.
        '400':
          description: Missing or invalid hash query parameter.
        '404':
          description: Item not found.
        '409':
          description: Hash mismatch — the stored content has changed.

  /proxy/omdb/search:
    get:
      operationId: proxyOmdbSearch
      summary: Search OMDb by title
      description: Proxies to the OMDb API using the server's `OMDB_API_KEY`. The key is never exposed to the client.
      tags: [OMDb Proxy]
      parameters:
        - name: s
          in: query
          required: true
          description: Title search string.
          schema:
            type: string
      responses:
        '200':
          description: OMDb search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OMDbSearchResponse'
        '503':
          description: OMDB_API_KEY not configured on the server.

  /proxy/omdb/item:
    get:
      operationId: proxyOmdbItem
      summary: Get an OMDb item by IMDb ID
      description: Proxies to the OMDb API using the server's `OMDB_API_KEY`. The key is never exposed to the client.
      tags: [OMDb Proxy]
      parameters:
        - name: i
          in: query
          required: true
          description: IMDb ID.
          schema:
            type: string
      responses:
        '200':
          description: OMDb item detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OMDbItem'
        '503':
          description: OMDB_API_KEY not configured on the server.

  /proxy/image:
    get:
      operationId: proxyImage
      summary: Proxy and cache an external image
      description: Fetches a public HTTP or HTTPS image URL, caches the bytes on the server, and returns the image with long-lived cache headers. Localhost, private-network targets, redirects, and oversized responses are rejected.
      tags: [Image Proxy]
      parameters:
        - name: url
          in: query
          required: true
          description: Source image URL to proxy. Must use the http or https protocol.
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: Proxied image bytes.
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=31536000, immutable
          content:
            image/avif:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          description: URL is missing, invalid, uses an unsupported protocol, points at a private/local target, or redirects.
        '413':
          description: The upstream image is too large to proxy.
        '415':
          description: The upstream response is not an image content type.

  /proxy/claude/query:
    post:
      operationId: proxyClaudeQuery
      summary: Natural-language collection search via Claude
      description: |
        Proxies a prompt to the Claude API using the server's `CLAUDE_API_KEY`. The key is never exposed to the client.
        The server reads the caller's collection metadata from the database and builds the prompt internally.
        Only the natural-language question is supplied by the client.
        The model is controlled by the optional `CLAUDE_MODEL` env variable; defaults to `claude-haiku-4-5-20251001`.
      tags: [Claude Proxy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaudeQueryRequest'
      responses:
        '200':
          description: IMDb IDs matched by Claude from the caller's collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeQueryResponse'
        '400':
          description: Missing or empty `prompt`.
        '502':
          description: Claude returned an unparseable or truncated response.
        '503':
          description: CLAUDE_API_KEY not configured on the server.

  /tag/config:
    get:
      operationId: getTagConfig
      summary: Get tag configuration
      tags: [Tag]
      responses:
        '200':
          description: Current tag configuration array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagConfigsResponse'

  /tag/change-config:
    post:
      operationId: changeTagConfig
      summary: Replace tag configuration
      description: Replaces the full tag configuration array and returns the stored result.
      tags: [Tag]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagConfigsResponse'
      responses:
        '200':
          description: Stored tag configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagConfigsResponse'
