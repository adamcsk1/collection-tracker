        data:
          $ref: '#/components/schemas/CollectionItemSuggestionsResponse'
    TagSuggestionsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TagSuggestionsResponse'
    GenreSuggestionsEnvelope:
      type: object
      required: [data]
