        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /collection-items/actions/refresh-external-ratings:
    post:
      operationId: refreshExternalRatings
      summary: Refresh collection item external ratings
      description: Fetches collection items from the configured external metadata provider and refreshes IMDb, Rotten Tomatoes, and Metacritic ratings. Book items are excluded because book metadata providers do not supply those ratings. For the authenticated user's own data this covers all non-book list types. When `ownerShareCode` identifies another owner, the refresh targets that owner's `library` list and processes only movie and series content scopes for which the caller has update permission. The request succeeds when at least one target content scope is writable.
