openapi: 3.1.0
info:
  title: Collection Tracker API
  version: 1.0.0
  description: REST API for the Collection Tracker server.

servers:
  - url: '{scheme}://{host}{basePath}/api/v1'
    description: API base path. When the app is deployed under a subpath (BASE_PATH env var), prepend that path before /api/v1.
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:4200
        description: Host and port of the server.
      basePath:
        default: ''
        description: Optional deployment subpath, such as /collection-tracker.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: CT.Token
      description: Signed HTTP-only access-token cookie set by POST /sign-in. Valid for 15 minutes. Automatically refreshed via POST /session/refresh when expired.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtained via POST /user/access-token for header-based clients.

  schemas:
    HealthResponse:
      type: object
      required: [status, memory, cpu, disk, load, frontend, ai]
      properties:
        status:
          type: string
          enum: [ok, warn, error]
        memory:
          type: object
          required: [usedPercent]
          properties:
            usedPercent:
              type: number
        cpu:
          type: object
          required: [usagePercent]
          properties:
            usagePercent:
              type: number
        disk:
          oneOf:
            - type: object
              required: [usedPercent]
              properties:
                usedPercent:
                  type: number
            - type: 'null'
        load:
          type: object
          required: [avg1m, avg5m, avg15m]
          properties:
            avg1m:
              type: number
            avg5m:
              type: number
            avg15m:
              type: number
        frontend:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [up, down]
        ai:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [up, down]

    SignUpRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string

    SignUpResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Long-lived user token for this account.

    SignInRequest:
      type: object
      required: [username, token]
      properties:
        username:
          type: string
        token:
          type: string

    ChangeTokenResponse:
      type: object
      required: [newToken]
      properties:
        newToken:
          type: string

    AccessToken:
      type: object
      required: [tokenHash, createdAt, userAgent, expiresAt]
      properties:
        tokenHash:
          type: string
        createdAt:
          type: string
          format: date-time
        userAgent:
          type: string
        expiresAt:
          type: ['string', 'null']
          format: date-time
          description: Null for tokens created via POST /user/access-token (intended for header-based usage).

    RefreshToken:
      type: object
      required: [tokenHash, createdAt, userAgent, expiresAt]
      properties:
        tokenHash:
          type: string
        createdAt:
          type: string
          format: date-time
        userAgent:
          type: string
        expiresAt:
          type: ['string', 'null']
          format: date-time

    AccessTokensResponse:
      type: array
      items:
        $ref: '#/components/schemas/AccessToken'

    CreateAccessTokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string

    UserSettingsResponse:
      type: object
      properties:
        fetchBatchSize:
          type: integer
        theme:
          type: string
          enum: [system, dark, light]
        animatedBackground:
          type: boolean
        language:
          type: string
          enum: [en]
        defaultLibraryOwnerShareCode:
          type: ['string', 'null']
          description: Share code of the incoming library selected by default when creating collection items. Null selects the caller's own library.
        collectionListDisplayPreferences:
          $ref: '#/components/schemas/CollectionListDisplayPreferences'

    CollectionListDisplayPreferences:
      type: object
      required: [showYear, showSharedIcon, preferredRating, imdbRatingFallback]
      properties:
        showYear:
          type: boolean
        showSharedIcon:
          type: boolean
        preferredRating:
          type: string
          enum: [imdb, rottenTomatoes, metacritic, user]
        imdbRatingFallback:
          type: boolean

    AiAvailableResponse:
      type: object
      required: [aiAvailable]
      properties:
        aiAvailable:
          type: boolean
          description: Indicates whether the configured Ollama host is reachable and the configured language and embedding models are available.

    UserSettingsRequest:
      type: object
      properties:
        fetchBatchSize:
          type: integer
        theme:
          type: string
          enum: [system, dark, light]
        animatedBackground:
          type: boolean
        language:
          type: string
          enum: [en]
        defaultLibraryOwnerShareCode:
          type: ['string', 'null']
          description: Share code of the incoming library selected by default when creating collection items. Null selects the caller's own library.
        collectionListDisplayPreferences:
          $ref: '#/components/schemas/CollectionListDisplayPreferences'
        fromLogin:
          type: boolean
          description: When true, language and theme are only initialized if the user has not already stored those settings.

    UserShare:
      type: object
      required: [canRead, canCreate, canUpdate, canDelete]
      properties:
        sharedWithUserShareCode:
          type: string
        sharedWithUsername:
          type: ['string', 'null']
        ownerUserShareCode:
          type: string
        ownerUsername:
          type: ['string', 'null']
        canRead:
          type: boolean
        canCreate:
          type: boolean
        canUpdate:
          type: boolean
        canDelete:
          type: boolean

    UserSharesResponse:
      type: object
      required: [userShareCode, outgoing, incoming]
      properties:
        userShareCode:
          type: string
        outgoing:
          type: array
          items:
            $ref: '#/components/schemas/UserShare'
        incoming:
          type: array
          items:
            $ref: '#/components/schemas/UserShare'

    CollectionItem:
      type: object
      required:
        [
          image,
          title,
          titleLower,
          genre,
          externalProvider,
          externalItemId,
          tags,
          year,
          rate,
          rottenTomatoesRate,
          metacriticRate,
          userRate,
          hash,
          actors,
          plot,
          listType,
          contentType,
          favorite,
          watched,
          watchedAt,
        ]
      properties:
        image:
          type: string
        title:
          type: string
        titleLower:
          type: string
          description: Lowercase cached title for faster searching.
        genre:
          type: array
          items:
            type: string
        IMDbId:
          type: string
          description: Legacy IMDb-compatible identifier.
        externalProvider:
          type: string
          enum: [omdb]
          description: External metadata provider that owns `externalItemId`, such as `omdb`.
        externalItemId:
          type: string
          description: Provider-native item identifier used for metadata refreshes and duplicate checks.
        externalIds:
          type: array
          description: Optional cross-provider identifiers known for this item. Used as duplicate-check evidence.
          items:
            $ref: '#/components/schemas/ExternalItemIdentity'
        canonicalItemId:
          type: string
          description: Local canonical identity used for cross-provider duplicate checks when known.
        tags:
          type: array
          items:
            type: string
        year:
          type: ['string', 'null']
          description: Release year or year interval such as `2026-2028` or `2027-`.
        rate:
          type: string
        rottenTomatoesRate:
          type: string
        metacriticRate:
          type: string
        userRate:
          type: ['number', 'null']
          minimum: 0
          maximum: 10
          multipleOf: 0.1
        hash:
          type: string
          description: SHA-512 hash of the structured item content.
        actors:
          type: string
        plot:
          type: string
        listType:
          type: string
          enum: [library, watch-later, wishlist, series-tracker, movie-tracker]
          description: Logical list containing the item. `library` is the main collection.
        contentType:
          type: string
          enum: [movie, series]
          description: Item media type. This replaces the legacy `#movie` and `#series` system tags.
        favorite:
          type: boolean
          description: Whether the item is marked as a favorite. This replaces the legacy `#favorite` system tag.
        watched:
          type: boolean
          description: Whether the authenticated viewer has this movie in their movie tracker.
        watchedAt:
          type: ['string', 'null']
          description: Timestamp when a tracker item was watched. For series this is set only while completed.
        ownerShareCode:
          type: string
          description: Share code of the item owner. Present when the item belongs to a shared library.

    CollectionItemChange:
      type: object
      required:
        [
          image,
          title,
          genre,
          externalProvider,
          externalItemId,
          tags,
          year,
          rate,
          rottenTomatoesRate,
          metacriticRate,
          userRate,
          actors,
          plot,
          contentType,
          favorite,
        ]
      properties:
        image:
          type: string
        title:
          type: string
        genre:
          type: array
          items:
            type: string
        IMDbId:
          type: string
          description: Legacy IMDb-compatible identifier. For OMDb-backed items this matches `externalItemId`.
        externalProvider:
          type: string
          enum: [omdb]
        externalItemId:
          type: string
        externalIds:
          type: array
          description: Optional cross-provider identifiers known for this item. Used as duplicate-check evidence.
          items:
            $ref: '#/components/schemas/ExternalItemIdentity'
        tags:
          type: array
          items:
            type: string
        year:
          type: ['string', 'null']
          description: Release year or year interval such as `2026-2028` or `2027-`.
        rate:
          type: string
        rottenTomatoesRate:
          type: string
        metacriticRate:
          type: string
        userRate:
          type: ['number', 'null']
          minimum: 0
          maximum: 10
          multipleOf: 0.1
        actors:
          type: string
        plot:
          type: string
        contentType:
          type: string
          enum: [movie, series]
        favorite:
          type: boolean

    CollectionItemsResponse:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionItem'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    CollectionMatchedItemsRequest:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          description: External identities to match, in result ranking order.
          items:
            $ref: '#/components/schemas/ExternalItemIdentity'
        offset:
          type: integer
          default: 0
        limit:
          type: integer
          default: 50
        filters:
          type: object
          properties:
            search:
              type: string
            tags:
              type: array
              items:
                type: string
            genres:
              type: array
              items:
                type: string
            tagMode:
              type: string
              enum: [any, all]
            type:
              type: string
              enum: [movie, series]
            watched:
              type: boolean
            completed:
              type: boolean
            favorite:
              type: boolean
            listType:
              type: string
              enum: [library, watch-later, wishlist, series-tracker, movie-tracker]
            orderBy:
              type: string
              enum: [createdAt, alphabet]
              default: createdAt
            orderDirection:
              type: string
              enum: [asc, desc]
              default: desc

    CollectionItemSuggestionsResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            type: object
            required: [label, value, kind]
            properties:
              label:
                type: string
              value:
                type: string
              kind:
                type: string
                enum: [title, tag, genre, actor, imdbId]

    TagSuggestionsResponse:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            type: string

    GenreSuggestionsResponse:
      type: object
      required: [genres]
      properties:
        genres:
          type: array
          items:
            type: string

    CollectionItemExistsResponse:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
        hash:
          type: string
          description: Content hash of the existing item, when it exists.

    RandomImagesResponse:
      type: object
      required: [images]
      properties:
        images:
          type: array
          items:
            type: string

    CollectionStatisticsResponse:
      type: object
      required:
        [
          totalItems,
          movieCount,
          seriesCount,
          favoriteCount,
          watchLaterCount,
          wishlistCount,
          watchedMovieCount,
          watchedSeriesCount,
          unwatchedMovieCount,
          unwatchedLibrarySeriesCount,
          unwatchedTrackerSeriesCount,
          completedTrackerSeriesCount,
          watchedYearCounts,
          tagCounts,
          genreCounts,
        ]
      properties:
        totalItems:
          type: integer
        movieCount:
          type: integer
        seriesCount:
          type: integer
        favoriteCount:
          type: integer
        watchLaterCount:
          type: integer
        wishlistCount:
          type: integer
        watchedMovieCount:
          type: integer
        watchedSeriesCount:
          type: integer
        unwatchedMovieCount:
          type: integer
        unwatchedLibrarySeriesCount:
          type: integer
        unwatchedTrackerSeriesCount:
          type: integer
        completedTrackerSeriesCount:
          type: integer
        watchedYearCounts:
          type: array
          items:
            type: object
            required: [year, movieCount, seriesCount, count]
            properties:
              year:
                type: string
              movieCount:
                type: integer
              seriesCount:
                type: integer
              count:
                type: integer
        tagCounts:
          type: array
          items:
            type: object
            required: [tag, count]
            properties:
              tag:
                type: string
              count:
                type: integer
        genreCounts:
          type: array
          items:
            type: object
            required: [genre, count]
            properties:
              genre:
                type: string
              count:
                type: integer

    CreateRequest:
      allOf:
        - $ref: '#/components/schemas/CollectionItemChange'
        - type: object
          properties:
            targetOwnerShareCode:
              type: string
              description: Optional owner share code to create the item in a shared library. Defaults to the authenticated user.
            listType:
              type: string
              enum: [library, watch-later, wishlist, series-tracker, movie-tracker]
              default: library
              description: Target list. Defaults to `library`.

    CreateResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: '#/components/schemas/CollectionItem'

    ChangeRequest:
      allOf:
        - $ref: '#/components/schemas/CollectionItemChange'
        - type: object
          required: [hash]
          properties:
            hash:
              type: string
              description: Current SHA-512 hash of the item. Must match the stored hash.

    ChangeResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: '#/components/schemas/CollectionItem'

    MarkAllWatchedResponse:
      type: object
      required: [changedCount]
      properties:
        changedCount:
          type: integer

    MarkAllSeriesWatchedResponse:
      type: object
      required: [trackedCount, progressChangedCount]
      properties:
        trackedCount:
          type: integer
          description: Number of library series newly copied into the authenticated user's series tracker.
        progressChangedCount:
          type: integer
          description: Number of series tracker items whose watched episode progress or completed status changed.

    MarkAllUnwatchedResponse:
      type: object
      required: [changedCount]
      properties:
        changedCount:
          type: integer

    RefreshImagesResponse:
      type: object
      required: [count, checked, fixed, errors]
      properties:
        count:
          type: integer
          description: Total number of collection items processed.
        checked:
          type: integer
          description: Number of images checked.
        fixed:
          type: integer
          description: Number of images updated from external metadata.
        errors:
          type: integer
          description: Number of images that could not be fixed.

    RefreshExternalRatingsResponse:
      type: object
      required: [count, checked, fixed, errors]
      properties:
        count:
          type: integer
          description: Total number of collection items processed.
        checked:
          type: integer
          description: Number of items checked.
        fixed:
          type: integer
          description: Number of items with updated IMDb, Rotten Tomatoes, or Metacritic ratings.
        errors:
          type: integer
          description: Number of items whose external ratings could not be refreshed.

    SeriesTrackerSeason:
      type: object
      required: [season, episodes]
      properties:
        season:
          type: integer
          minimum: 1
          maximum: 50
        episodes:
          type: integer
          minimum: 1
          maximum: 100
        titles:
          type: array
          items:
            type: string
          description: Optional per-episode titles.

    SeriesTrackerSeasonsRequest:
      type: object
      required: [seasons]
      properties:
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/SeriesTrackerSeason'

    SeriesTrackerSeasonsResponse:
      type: object
      required: [seasons]
      properties:
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/SeriesTrackerSeason'
        item:
          $ref: '#/components/schemas/CollectionItem'
          description: Updated collection item when this response is returned from a mutating endpoint.

    SeriesTrackerWatchedEpisode:
      type: object
      required: [season, episode]
      properties:
        season:
          type: integer
          minimum: 1
          maximum: 50
        episode:
          type: integer
          minimum: 1
          maximum: 100

    SeriesTrackerWatchedEpisodesRequest:
      type: object
      required: [watchedEpisodes]
      properties:
        watchedEpisodes:
          type: array
          items:
            $ref: '#/components/schemas/SeriesTrackerWatchedEpisode'

    SeriesTrackerWatchedEpisodesResponse:
      type: object
      required: [watchedEpisodes, lastWatchedEpisode]
      properties:
        watchedEpisodes:
          type: array
          items:
            $ref: '#/components/schemas/SeriesTrackerWatchedEpisode'
        lastWatchedEpisode:
          type: object
          nullable: true
          required: [season, episode]
          properties:
            season:
              type: integer
            episode:
              type: integer
        item:
          $ref: '#/components/schemas/CollectionItem'
          description: Updated collection item when this response is returned from a mutating endpoint.

    ExternalMetadataItem:
      type: object
      required: [provider, providerItemId, title, year, contentType, poster, plot, actors, genres, ratings]
      properties:
        provider:
          type: string
          enum: [omdb]
        providerItemId:
          type: string
        externalIds:
          type: array
          description: Cross-provider identifiers known for this metadata item.
          items:
            $ref: '#/components/schemas/ExternalItemIdentity'
        title:
          type: string
        year:
          type: string
        contentType:
          type: string
          enum: [movie, series]
        poster:
          type: string
        plot:
          type: string
        actors:
          type: string
        genres:
          type: array
          items:
            type: string
        ratings:
          type: array
          items:
            type: object
            required: [source, value]
            properties:
              source:
                type: string
              value:
                type: string

    ExternalItemIdentity:
      type: object
      required: [source, id]
      properties:
        source:
          type: string
          enum: [omdb, imdb]
        id:
          type: string

    ExternalMetadataSearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExternalMetadataItem'

    ExternalMetadataProvider:
      type: object
      required: [name, supportsSeasonMetadata, supportsDirectImdbId]
      properties:
        name:
          type: string
          enum: [omdb]
          description: Configured external metadata provider identifier.
        supportsSeasonMetadata:
          type: boolean
          description: Whether the provider can fetch series season metadata.
        supportsDirectImdbId:
          type: boolean
          description: Whether the provider can resolve a pasted IMDb ID directly.

    ExternalMetadataProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ExternalMetadataProvider'

    AiQueryRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          description: Natural-language question about the caller's collection.
          examples:
            - Which are sci-fi movies?

    AiQueryResponse:
      type: object
      required: [matchedIds]
      properties:
        matchedIds:
          type: array
          items:
            type: string
          description: IMDb IDs matched by AI search from the caller's collection.
          examples:
            - - tt0133093

    TagManagement:
      type: object
      required: [tag, color, useForImageBorder, useForTextColor, useForImageBadge, weight]
      properties:
        tag:
          type: string
          examples:
            - '#example'
        color:
          type: ['string', 'null']
          examples:
            - '#112233'
        useForImageBorder:
          type: boolean
        useForTextColor:
          type: boolean
        useForImageBadge:
          type: boolean
        weight:
          type: integer

    TagManagementResponse:
      type: array
      items:
        $ref: '#/components/schemas/TagManagement'

    RenameTagRequest:
      type: object
      required: [oldTag, newTag]
      properties:
        oldTag:
          type: string
          examples:
            - '#old'
        newTag:
          type: string
          examples:
            - '#new'

    RenameTagResponse:
      type: object
      required: [renamedItemCount, tagManagement]
      properties:
        renamedItemCount:
          type: integer
          description: Number of the caller's own collection items that had the old tag.
        tagManagement:
          $ref: '#/components/schemas/TagManagementResponse'

    ExportResponse:
      type: object
      required: [userSettings, collectionItems, tagManagement, seriesTrackerData]
      properties:
        userSettings:
          $ref: '#/components/schemas/UserSettingsResponse'
        collectionItems:
          type: array
          items:
            $ref: '#/components/schemas/CollectionItem'
        tagManagement:
          $ref: '#/components/schemas/TagManagementResponse'
        seriesTrackerData:
          type: object
          additionalProperties:
            type: object
            required: [seasons, watchedEpisodes]
            properties:
              seasons:
                type: array
                items:
                  $ref: '#/components/schemas/SeriesTrackerSeason'
              watchedEpisodes:
                type: array
                items:
                  $ref: '#/components/schemas/SeriesTrackerWatchedEpisode'

    ImportCollectionItemBase:
      type: object
      required:
        [
          image,
          title,
          genre,
          tags,
          year,
          rate,
          rottenTomatoesRate,
          metacriticRate,
          userRate,
          actors,
          plot,
          externalProvider,
          externalItemId,
          listType,
          watchedAt,
        ]
      properties:
        image:
          type: string
        title:
          type: string
        genre:
          type: array
          items:
            type: string
        IMDbId:
          type: string
        tags:
          type: array
          items:
            type: string
        year:
          type: ['string', 'null']
        rate:
          type: string
        rottenTomatoesRate:
          type: string
        metacriticRate:
          type: string
        userRate:
          type: ['number', 'null']
          minimum: 0
          maximum: 10
          multipleOf: 0.1
        actors:
          type: string
        plot:
          type: string
        externalProvider:
          type: string
          enum: [omdb]
          description: External metadata provider that owns the canonical item identity.
        externalItemId:
          type: string
          description: Provider-specific canonical item ID.
        externalIds:
          type: array
          description: Optional cross-provider identifiers known for this item.
          items:
            $ref: '#/components/schemas/ExternalItemIdentity'
        canonicalItemId:
          type: string
          description: Optional local canonical identity preserved from exports.
        listType:
          type: string
          enum: [library, watch-later, wishlist, series-tracker, movie-tracker]
        watchedAt:
          type: ['string', 'null']

    ImportCollectionItemV5:
      allOf:
        - $ref: '#/components/schemas/ImportCollectionItemBase'
        - type: object
          required: [contentType, favorite]
          properties:
            contentType:
              type: string
              enum: [movie, series]
            favorite:
              type: boolean

    ImportDataV5:
      type: object
      required: [userSettings, collectionItems, tagManagement, seriesTrackerData]
      properties:
        userSettings:
          $ref: '#/components/schemas/UserSettingsResponse'
        collectionItems:
          type: array
          items:
            $ref: '#/components/schemas/ImportCollectionItemV5'
        tagManagement:
          $ref: '#/components/schemas/TagManagementResponse'
        seriesTrackerData:
          type: object
          description: Series tracker data keyed by encoded provider identity, formatted as provider/externalItemId.
          additionalProperties:
            type: object
            required: [seasons, watchedEpisodes]
            properties:
              seasons:
                type: array
                items:
                  $ref: '#/components/schemas/SeriesTrackerSeason'
              watchedEpisodes:
                type: array
                items:
                  $ref: '#/components/schemas/SeriesTrackerWatchedEpisode'

    ImportRequest:
      allOf:
        - type: object
          required: [type, version]
          properties:
            type:
              type: string
              const: collection-tracker-export
            version:
              type: integer
              const: 5
              description: Version 5 is exported by current clients and requires provider identity on every item.
        - $ref: '#/components/schemas/ImportDataV5'

    ImportResponse:
      type: object
      required:
        [
          importedCollectionItems,
          importedTagManagement,
          importedSeriesTrackerSeasons,
          importedSeriesTrackerWatchedEpisodes,
        ]
      properties:
        importedCollectionItems:
          type: integer
        importedTagManagement:
          type: integer
        importedSeriesTrackerSeasons:
          type: integer
        importedSeriesTrackerWatchedEpisodes:
          type: integer

    CollectionItemsImportRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
          maxLength: 1000000
          description: JSON, Markdown, or plain text content containing up to 100 unique IMDb IDs.

    CollectionItemsImportResponse:
      type: object
      required: [totalCount, importedCount, skippedCount, errorCount]
      properties:
        totalCount:
          type: integer
          description: Number of unique IMDb IDs extracted from the source.
        importedCount:
          type: integer
          description: Number of new collection library items imported.
        skippedCount:
          type: integer
          description: Number of IMDb IDs skipped because they already exist in one of the caller's lists.
        errorCount:
          type: integer
          description: Number of IMDb IDs that could not be imported from external metadata.

security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: Public
    description: Endpoints that do not require authentication.
  - name: Session
    description: Access token and session management.
  - name: User
    description: User account and settings.
  - name: Collection
    description: CRUD operations for structured collection items.
  - name: External Metadata Proxy
    description: Proxy endpoints for the configured external metadata provider. OMDb is used when `OMDB_API_KEY` is configured.
  - name: Image Proxy
    description: Cached proxy endpoint for external collection item images.
  - name: AI Proxy
    description: Proxy endpoint for local Ollama AI search.
  - name: Tag
    description: Tag management.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Server health check
      security: []
      tags: [Public]
      responses:
        '200':
          description: Health status of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /sign-up:
    post:
      operationId: signUp
      summary: Create a new account
      security: []
      tags: [Public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '200':
          description: Account created. Returns the long-lived user token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
        '400':
          description: Missing or invalid username.
        '403':
          description: Registration is disabled or the configured user limit has been reached.
        '409':
          description: A user with this username already exists.
        '429':
          description: Authentication rate limit exceeded.

  /sign-in:
    post:
      operationId: signIn
      summary: Sign in and obtain an access token
      security: []
      tags: [Public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Authenticated. Sets signed HTTP-only `CT.Token` (15 minutes) and `CT.RefreshToken` (7 days) cookies.
          headers:
            Set-Cookie:
              schema:
                type: string
              examples:
                access:
                  value: CT.Token=<jwt>; HttpOnly; Secure; SameSite=Strict; Max-Age=900
                refresh:
                  value: CT.RefreshToken=<jwt>; HttpOnly; Secure; SameSite=Strict; Max-Age=604800
        '400':
          description: Missing or invalid username or token.
        '401':
          description: User token is invalid.
        '404':
          description: User not found.
        '429':
          description: Authentication rate limit exceeded.

  /logout:
    delete:
      operationId: logout
      summary: Revoke the current access token and clear both auth cookies
      tags: [Session]
      responses:
        '204':
          description: Logged out successfully. Both CT.Token and CT.RefreshToken cookies are cleared.

  /user/change-token:
    put:
      operationId: changeUserToken
      summary: Rotate the long-lived user token
      description: Rotates the user's long-lived token and replaces both the active access and refresh token sets.
      tags: [Session]
      responses:
        '200':
          description: Token rotated. Returns the new long-lived token. Both CT.Token and CT.RefreshToken cookies are updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeTokenResponse'

  /user/access-token:
    post:
      operationId: createAccessToken
      summary: Create an additional access token for header-based clients
      description: Created tokens are stored with `expiresAt` set to null.
      tags: [Session]
      responses:
        '200':
          description: New access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccessTokenResponse'

  /user/access-tokens:
    get:
      operationId: listAccessTokens
      summary: List all stored access tokens
      description: Returns token hashes, creation dates, user agents, and expiresAt values.
      tags: [Session]
      responses:
        '200':
          description: Array of stored access token metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokensResponse'

  /user/access-token/{tokenHash}:
    delete:
      operationId: deleteAccessToken
      summary: Delete one access token by hash
      tags: [Session]
      parameters:
        - name: tokenHash
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Token deleted.

  /session/refresh:
    post:
      operationId: refreshAccessToken
      summary: Refresh the access token using the refresh token
      description: Validates the CT.RefreshToken cookie (or Authorization header) and issues a new CT.Token access-token cookie.
      tags: [Session]
      responses:
        '204':
          description: Access token refreshed. New CT.Token cookie is set.
        '401':
          description: No refresh token provided.
        '403':
          description: Refresh token is invalid, expired, or not recognized.
        '429':
          description: Authentication rate limit exceeded.

  /user:
    delete:
      operationId: deleteUser
      summary: Delete the current user account
      description: Deletes the user, all stored collection items, and related configuration.
      tags: [User]
      responses:
        '204':
          description: User deleted.

  /user/settings:
    get:
      operationId: getUserSettings
      summary: Get user settings
      tags: [User]
      responses:
        '200':
          description: Current user settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsResponse'
    post:
      operationId: updateUserSettings
      summary: Update user settings
      description: Accepts any subset of user settings and returns the merged settings object.
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsRequest'
      responses:
        '200':
          description: Merged settings after update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsResponse'

  /user/shares:
    get:
      operationId: getUserShares
      summary: Get user shares
      tags: [User]
      responses:
        '200':
          description: Current user hash and share lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSharesResponse'
    post:
      operationId: saveUserShare
      summary: Create or update a share
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sharedWithUserShareCode]
              properties:
                sharedWithUserShareCode:
                  type: string
                  description: Short share code shown by the invited user.
                canRead:
                  type: boolean
                canCreate:
                  type: boolean
                canUpdate:
                  type: boolean
                canDelete:
                  type: boolean
      responses:
        '204':
          description: Share saved.

  /user/shares/incoming/{ownerUserShareCode}:
    delete:
      operationId: revokeIncomingUserShare
      summary: Revoke an incoming share as the invited user
      tags: [User]
      parameters:
        - name: ownerUserShareCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Incoming share revoked.

  /user/shares/{sharedWithUserShareCode}:
    delete:
      operationId: deleteUserShare
      summary: Remove a share
      tags: [User]
      parameters:
        - name: sharedWithUserShareCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Share removed.

  /items:
    get:
      operationId: searchItems
      summary: Search collection items
      description: Returns a server-filtered and paginated collection result. Structured filters use `type`, `favorite`, `watched`, and `completed`; custom tags use `tags`. `listType` defaults to `library`.
      tags: [Collection]
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: search
          in: query
          schema:
            type: string
        - name: tags
          in: query
          description: Comma-separated custom tags.
          schema:
            type: string
        - name: genres
          in: query
          description: Comma-separated genres.
          schema:
            type: string
        - name: tagMode
          in: query
          schema:
            type: string
            enum: [any, all]
            default: any
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, series]
        - name: favorite
          in: query
          schema:
            type: boolean
        - name: watched
          in: query
          schema:
            type: boolean
        - name: completed
          in: query
          schema:
            type: boolean
        - name: listType
          in: query
          schema:
            type: string
            enum: [library, watch-later, wishlist, series-tracker, movie-tracker]
            default: library
        - name: orderBy
          in: query
          schema:
            type: string
            enum: [createdAt, alphabet]
            default: createdAt
        - name: orderDirection
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Filtered collection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemsResponse'

  /items/matched:
    post:
      operationId: getMatchedItems
      summary: Get collection items from matched external identities
      description: Returns paginated items from an external identity set, preserving the request order by default for AI search results.
      tags: [Collection]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionMatchedItemsRequest'
      responses:
        '200':
          description: Filtered matched collection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemsResponse'
        '400':
          description: Invalid IMDb ID list.

  /items/search-suggestions:
    get:
      operationId: getItemSearchSuggestions
      summary: Get item search suggestions
      tags: [Collection]
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: listType
          in: query
          required: false
          description: List to search suggestions within. Defaults to `library`.
          schema:
            $ref: '#/components/schemas/CollectionListType'
      responses:
        '200':
          description: Search suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemSuggestionsResponse'

  /items/exists:
    get:
      operationId: itemExists
      summary: Check whether an external metadata item already exists
      tags: [Collection]
      parameters:
        - name: imdbId
          in: query
          required: false
          deprecated: true
          description: Legacy IMDb ID fallback. Prefer `externalIdentitySource` plus `externalIdentityId`.
          schema:
            type: string
        - name: externalIdentitySource
          in: query
          required: false
          description: External identity source name. Required with `externalIdentityId` unless `imdbId` is used.
          schema:
            type: string
            enum: [omdb, imdb]
        - name: externalIdentityId
          in: query
          required: false
          description: External identity ID. Required with `externalIdentitySource` unless `imdbId` is used.
          schema:
            type: string
        - name: externalIds
          in: query
          required: false
          description: 'JSON array of `{ "source": string, "id": string }` identities used to resolve cross-provider duplicates locally.'
          schema:
            type: string
        - name: ownerShareCode
          in: query
          required: false
          description: Owner share code of the library to check. Defaults to the authenticated user.
          schema:
            type: string
        - name: listType
          in: query
          required: false
          description: List to check. Defaults to `library`.
          schema:
            type: string
            enum: [library, watch-later, wishlist, series-tracker, movie-tracker]
            default: library
      responses:
        '200':
          description: Existing item status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemExistsResponse'
        '400':
          description: Missing external identity.
        '403':
          description: Not allowed to read the target library.

  /items/random:
    get:
      operationId: getRandomItem
      summary: Get a random collection item
      description: Returns one random item from the user's collection.
      tags: [Collection]
      responses:
        '200':
          description: Random collection item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItem'
        '404':
          description: Collection is empty.

  /items/random-images:
    get:
      operationId: getRandomImages
      summary: Get random collection image URLs
      description: Returns a list of random image URLs from the user's collection.
      tags: [Collection]
      parameters:
        - name: count
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Random image URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RandomImagesResponse'

  /items/mark-all-watched:
    post:
      operationId: markAllAsWatched
      summary: Mark all movies as watched
      description: Copies every unwatched movie in the selected library into the authenticated user's movie tracker. When `ownerShareCode` is provided, the selected shared library requires read permission and the shared owner's items are not modified.
      tags: [Collection]
      parameters:
        - name: ownerShareCode
          in: query
          schema:
            type: string
          description: Optional owner share code for using an incoming shared library as the source.
      responses:
        '200':
          description: Number of items that were updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllWatchedResponse'
        '403':
          description: The authenticated user cannot read the requested library.
        '404':
          description: The requested shared library owner was not found.

  /items/mark-all-unwatched:
    post:
      operationId: markAllAsUnwatched
      summary: Mark all movies as unwatched
      description: Removes authenticated-user movie tracker copies that correspond to movies in the selected library. When `ownerShareCode` is provided, the selected shared library requires read permission and the shared owner's items are not modified.
      tags: [Collection]
      parameters:
        - name: ownerShareCode
          in: query
          schema:
            type: string
          description: Optional owner share code for using an incoming shared library as the source.
      responses:
        '200':
          description: Number of items that were updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllUnwatchedResponse'
        '403':
          description: The authenticated user cannot read the requested library.
        '404':
          description: The requested shared library owner was not found.

  /items/mark-all-series-watched:
    post:
      operationId: markAllSeriesAsWatched
      summary: Mark all series as watched
      description: Copies every untracked series in the selected library into the authenticated user's series tracker, fetches season metadata from the configured external metadata provider only for newly added series, and marks all available episodes watched for matching tracker items. When `ownerShareCode` is provided, the selected shared library requires read permission and the shared owner's items are not modified.
      tags: [Collection]
      parameters:
        - name: ownerShareCode
          in: query
          schema:
            type: string
          description: Optional owner share code for using an incoming shared library as the source.
      responses:
        '200':
          description: Number of series tracker items newly tracked and number with changed progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllSeriesWatchedResponse'
        '403':
          description: The authenticated user cannot read the requested library.
        '404':
          description: The requested shared library owner was not found.

  /items/mark-all-series-unwatched:
    post:
      operationId: markAllSeriesAsUnwatched
      summary: Mark all series as unwatched
      description: Clears watched episode progress for authenticated-user series tracker items that correspond to series in the selected library. Series tracker items and season metadata are kept. When `ownerShareCode` is provided, the selected shared library requires read permission and the shared owner's items are not modified.
      tags: [Collection]
      parameters:
        - name: ownerShareCode
          in: query
          schema:
            type: string
          description: Optional owner share code for using an incoming shared library as the source.
      responses:
        '200':
          description: Number of items that were updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllUnwatchedResponse'
        '403':
          description: The authenticated user cannot read the requested library.
        '404':
          description: The requested shared library owner was not found.

  /items/refresh-images:
    post:
      operationId: refreshImages
      summary: Refresh collection item images
      description: Checks every collection item image through the image proxy, caches available images, and fetches updated poster URLs from the configured external metadata provider for broken images. When `ownerShareCode` is provided, the refresh targets that shared library and requires update permission.
      tags: [Collection]
      parameters:
        - name: ownerShareCode
          in: query
          schema:
            type: string
          description: Optional owner share code for refreshing an incoming shared library.
      responses:
        '200':
          description: Summary of the refresh operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshImagesResponse'
        '403':
          description: The authenticated user cannot update the requested library.
        '404':
          description: The requested shared library owner was not found.

  /items/refresh-external-ratings:
    post:
      operationId: refreshExternalRatings
      summary: Refresh collection item external ratings
      description: Fetches every collection item from the configured external metadata provider and refreshes IMDb, Rotten Tomatoes, and Metacritic ratings. When `ownerShareCode` is provided, the refresh targets that shared library and requires update permission.
      tags: [Collection]
      parameters:
        - name: ownerShareCode
          in: query
          schema:
            type: string
          description: Optional owner share code for refreshing an incoming shared library.
      responses:
        '200':
          description: Summary of the refresh operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshExternalRatingsResponse'
        '403':
          description: The authenticated user cannot update the requested library.
        '404':
          description: The requested shared library owner was not found.

  /tags/suggestions:
    get:
      operationId: getTagSuggestions
      summary: Get custom tag suggestions
      description: Returns matching stored custom tags.
      tags: [Collection]
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Tag suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagSuggestionsResponse'

  /genres/suggestions:
    get:
      operationId: getGenreSuggestions
      summary: Get genre suggestions
      tags: [Collection]
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Genre suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreSuggestionsResponse'

  /statistics:
    get:
      operationId: getStatistics
      summary: Get collection statistics
      tags: [Collection]
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: tags
          in: query
          schema:
            type: string
        - name: genres
          in: query
          schema:
            type: string
        - name: tagMode
          in: query
          schema:
            type: string
            enum: [any, all]
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, series]
        - name: listType
          in: query
          schema:
            type: string
            enum: [library, watch-later, wishlist, series-tracker, movie-tracker]
            default: library
        - name: watched
          in: query
          schema:
            type: boolean
        - name: favorite
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Collection statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionStatisticsResponse'

  /create:
    post:
      operationId: createItem
      summary: Create a collection item
      description: >-
        Creates a structured item in the requested `listType`. External provider identity and locally resolved
        canonical identity must be unique within the target list.
        Custom tags must not use reserved system or virtual tags. Optionally pass `targetOwnerShareCode` to create
        in a shared library where you have create permission. Watch-later, wishlist, series-tracker, and
        movie-tracker items cannot be created in shared libraries and cannot be favorites. Series-tracker items must
        use `contentType: series`; movie-tracker items must use `contentType: movie`.
      tags: [Collection]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        '200':
          description: Item created. Returns the stored collection item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
        '400':
          description: Request body is missing required item fields, contains invalid values, or uses an invalid tag/list combination.
        '403':
          description: Not allowed to create in the target library.
        '409':
          description: An item with this external or canonical identity already exists in the target list.

  /movie-tracker:
    delete:
      operationId: deleteAllMovieTrackerItems
      summary: Remove all movie tracker data
      description: Deletes every movie tracker item owned by the authenticated user. This affects only the user's own tracker data and cannot remove or change shared library owner items.
      tags: [Collection]
      responses:
        '200':
          description: Number of movie tracker items deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllUnwatchedResponse'

  /series-tracker:
    delete:
      operationId: deleteAllSeriesTrackerItems
      summary: Remove all series tracker data
      description: Deletes every series tracker item owned by the authenticated user. Related season metadata and watched episode progress are removed with the tracker items. This affects only the user's own tracker data and cannot remove or change shared library owner items.
      tags: [Collection]
      responses:
        '200':
          description: Number of series tracker items deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllUnwatchedResponse'

  /items/{externalIdentitySource}/{externalIdentityId}/change:
    put:
      operationId: changeItemByExternalId
      summary: Update a collection item by external identity
      description: Updates an item using an external identity source and ID instead of legacy IMDb-only identity.
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          description: External identity source identifier.
          schema:
            type: string
            enum: [omdb, imdb]
        - name: externalIdentityId
          in: path
          required: true
          description: External identity ID.
          schema:
            type: string
        - name: ownerShareCode
          in: query
          required: false
          description: Owner share code of the library containing the item. Defaults to the authenticated user.
          schema:
            type: string
        - name: listType
          in: query
          required: false
          description: List containing the item. Defaults to `library`.
          schema:
            type: string
            enum: [library, watch-later, wishlist, series-tracker, movie-tracker]
            default: library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
      responses:
        '200':
          description: Item updated. Returns the stored collection item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeResponse'
        '400':
          description: Invalid external identity source, or request body is missing required item fields or contains invalid values.
        '403':
          description: Not allowed to update in the target library or to update a shared internal collection item.
        '404':
          description: Item not found.
        '409':
          description: Hash mismatch or external identity conflict.

  /items/{externalIdentitySource}/{externalIdentityId}:
    delete:
      operationId: deleteItemByExternalId
      summary: Delete a collection item by external identity
      description: Deletes an item from the requested list using an external identity source and ID when the supplied hash matches.
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          schema:
            type: string
            enum: [omdb, imdb]
        - name: externalIdentityId
          in: path
          required: true
          schema:
            type: string
        - name: hash
          in: query
          required: true
          description: Current SHA-512 hash of the item. Must match the stored hash.
          schema:
            type: string
        - name: ownerShareCode
          in: query
          required: false
          schema:
            type: string
        - name: listType
          in: query
          required: false
          schema:
            type: string
            enum: [library, watch-later, wishlist, series-tracker, movie-tracker]
            default: library
      responses:
        '204':
          description: Item deleted.
        '400':
          description: Missing or invalid hash query parameter.
        '403':
          description: Not allowed to delete in the target library or to delete a shared internal collection item.
        '404':
          description: Item not found.
        '409':
          description: Hash mismatch.

  /movie-tracker/{externalIdentitySource}/{externalIdentityId}:
    post:
      operationId: addMovieTrackerItemByExternalId
      summary: Add a movie to movie tracker by external identity
      description: Copies an accessible library movie into the authenticated user's movie tracker using canonical provider identity.
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          schema:
            type: string
            enum: [omdb, imdb]
        - name: externalIdentityId
          in: path
          required: true
          schema:
            type: string
        - name: ownerShareCode
          in: query
          required: false
          schema:
            type: string
        - name: sourceListType
          in: query
          required: false
          schema:
            type: string
            enum: [library, watch-later]
            default: library
      responses:
        '200':
          description: Movie tracker item created or already present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
        '400':
          description: Invalid external metadata provider or source list type.
        '403':
          description: The authenticated user cannot read the source library.
        '404':
          description: Source item was not found or is not a movie.
    delete:
      operationId: deleteMovieTrackerItemByExternalId
      summary: Delete a movie tracker item by external identity
      description: Removes the authenticated user's movie tracker row using canonical provider identity.
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          schema:
            type: string
            enum: [omdb, imdb]
        - name: externalIdentityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Movie tracker item deleted.
        '400':
          description: Invalid external metadata provider.
        '404':
          description: Movie tracker item was not found.

  /series-tracker/{externalIdentitySource}/{externalIdentityId}:
    post:
      operationId: addSeriesTrackerItemByExternalId
      summary: Add a series to series tracker by external identity
      description: Copies a series into the authenticated user's series tracker using canonical provider identity.
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          schema:
            type: string
            enum: [omdb, imdb]
        - name: externalIdentityId
          in: path
          required: true
          schema:
            type: string
        - name: sourceListType
          in: query
          required: false
          schema:
            type: string
            enum: [library, watch-later]
            default: library
        - name: ownerShareCode
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Series tracker item created or already present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
        '400':
          description: Invalid external metadata provider or unsupported source list type.
        '403':
          description: The authenticated user cannot read the requested shared library.
        '404':
          description: Source item or shared library owner was not found, or the source item is not a series.

  /series-tracker/{externalIdentitySource}/{externalIdentityId}/seasons:
    get:
      operationId: getSeriesTrackerSeasonsByExternalId
      summary: Get series tracker season metadata by external identity
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          schema:
            type: string
            enum: [omdb, imdb]
        - name: externalIdentityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stored season metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesTrackerSeasonsResponse'
        '400':
          description: Invalid external metadata provider.
        '404':
          description: Series tracker item not found.
    put:
      operationId: updateSeriesTrackerSeasonsByExternalId
      summary: Replace series tracker season metadata by external identity
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          schema:
            type: string
            enum: [omdb, imdb]
        - name: externalIdentityId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesTrackerSeasonsRequest'
      responses:
        '200':
          description: Stored season metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesTrackerSeasonsResponse'
        '400':
          description: Invalid external metadata provider or season metadata.
        '404':
          description: Series tracker item not found.
    delete:
      operationId: deleteSeriesTrackerSeasonsByExternalId
      summary: Delete series tracker season metadata by external identity
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          schema:
            type: string
            enum: [omdb, imdb]
        - name: externalIdentityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Empty season metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesTrackerSeasonsResponse'
        '400':
          description: Invalid external metadata provider.
        '404':
          description: Series tracker item not found.

  /series-tracker/{externalIdentitySource}/{externalIdentityId}/seasons/refresh:
    post:
      operationId: refreshSeriesTrackerSeasonsByExternalId
      summary: Refresh series tracker season metadata by external identity
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          schema:
            type: string
            enum: [omdb, imdb]
        - name: externalIdentityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stored season metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesTrackerSeasonsResponse'
        '400':
          description: Invalid external metadata provider.
        '404':
          description: Series tracker item not found.

  /series-tracker/{externalIdentitySource}/{externalIdentityId}/mark-all-watched:
    put:
      operationId: markAllSeriesTrackerWatchedByExternalId
      summary: Mark all episodes as watched by external identity
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          schema:
            type: string
            enum: [omdb, imdb]
        - name: externalIdentityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated watched episodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesTrackerWatchedEpisodesResponse'
        '400':
          description: Invalid external metadata provider or no season metadata exists for the item.
        '404':
          description: Series tracker item not found.

  /series-tracker/{externalIdentitySource}/{externalIdentityId}/watched-episodes:
    get:
      operationId: getSeriesTrackerWatchedEpisodesByExternalId
      summary: Get watched episodes by external identity
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          schema:
            type: string
            enum: [omdb, imdb]
        - name: externalIdentityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Watched episodes and last watched episode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesTrackerWatchedEpisodesResponse'
        '400':
          description: Invalid external metadata provider.
        '404':
          description: Series tracker item not found.
    put:
      operationId: updateSeriesTrackerWatchedEpisodesByExternalId
      summary: Replace watched episodes by external identity
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          schema:
            type: string
            enum: [omdb, imdb]
        - name: externalIdentityId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesTrackerWatchedEpisodesRequest'
      responses:
        '200':
          description: Updated watched episodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesTrackerWatchedEpisodesResponse'
        '400':
          description: Invalid external metadata provider or watched episode data.
        '404':
          description: Series tracker item not found.

  /proxy/external-metadata/providers:
    get:
      operationId: proxyExternalMetadataProviders
      summary: List configured external metadata providers
      description: Returns provider identifiers available on the server without exposing provider credentials.
      tags: [External Metadata Proxy]
      responses:
        '200':
          description: Configured external metadata providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMetadataProvidersResponse'

  /proxy/external-metadata/search:
    get:
      operationId: proxyExternalMetadataSearch
      summary: Search external metadata by title
      description: Searches the requested external metadata provider, or all configured providers when provider is omitted. Provider credentials are never exposed to the client.
      tags: [External Metadata Proxy]
      parameters:
        - name: s
          in: query
          required: true
          description: Title search string.
          schema:
            type: string
        - name: provider
          in: query
          required: false
          description: Known external metadata provider name to search. When omitted, the server aggregates all configured providers. Unknown names return 400; known but unconfigured providers return 503.
          schema:
            type: string
            enum: [omdb]
      responses:
        '200':
          description: External metadata search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMetadataSearchResponse'
        '400':
          description: Missing or invalid search text, or unsupported external metadata provider.
        '502':
          description: External metadata provider request failed. For aggregate searches, all configured provider requests failed.
        '503':
          description: No external metadata provider is configured on the server.

  /proxy/external-metadata/item:
    get:
      operationId: proxyExternalMetadataItem
      summary: Get an external metadata item by external identity
      description: Proxies to the configured external metadata provider for `externalIdentitySource=omdb`; `externalIdentitySource=imdb` resolves the IMDb identity through a configured metadata provider that supports direct IMDb lookup. Provider credentials are never exposed to the client.
      tags: [External Metadata Proxy]
      parameters:
        - name: externalIdentitySource
          in: query
          required: true
          description: External identity source returned by search results, or `imdb` for direct IMDb ID lookup.
          schema:
            type: string
            enum: [omdb, imdb]
        - name: externalIdentityId
          in: query
          required: true
          description: External identity ID. For `omdb` and `imdb` this is the IMDb ID.
          schema:
            type: string
      responses:
        '200':
          description: External metadata item detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMetadataItem'
        '400':
          description: Missing or invalid external identity source or external identity ID.
        '404':
          description: External metadata item not found.
        '502':
          description: External metadata provider request failed.
        '503':
          description: No configured external metadata provider can resolve the requested external identity.

  /proxy/image:
    get:
      operationId: proxyImage
      summary: Proxy and cache an external image
      description: Fetches a public HTTP or HTTPS image URL, caches the bytes on the server, and returns the image with long-lived cache headers. Localhost, private-network targets, redirects, and oversized responses are rejected.
      tags: [Image Proxy]
      parameters:
        - name: url
          in: query
          required: true
          description: Source image URL to proxy. Must use the http or https protocol.
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: Proxied image bytes.
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=31536000, immutable
          content:
            image/avif:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          description: URL is missing, invalid, uses an unsupported protocol, points at a private/local target, or redirects.
        '413':
          description: The upstream image is too large to proxy.
        '415':
          description: The upstream response is not an image content type.

  /proxy/ai/query:
    post:
      operationId: proxyAiQuery
      summary: Natural-language collection search via local AI
      description: |
        Proxies a prompt to the Ollama API using `ollama.config.json` in the server data folder.
        The server reads the caller's collection metadata from the database, embeds collection items, retrieves semantic candidates, and builds the final filtering prompt internally.
        Only the natural-language question is supplied by the client.
        The default config uses host `http://127.0.0.1:11434`, model `qwen2.5:14b`, embedding model `mxbai-embed-large`, and merges configured generate options over `DEFAULT_OLLAMA_OPTIONS` of `{ "temperature": 0, "top_k": 10, "num_thread": 10, "num_ctx": 8192 }`.
        Ollama availability and model presence for both the language and embedding models are checked by this endpoint before querying.
      tags: [AI Proxy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiQueryRequest'
      responses:
        '200':
          description: IMDb IDs matched by AI search from the caller's collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiQueryResponse'
        '400':
          description: Missing or empty `prompt`.
        '502':
          description: Ollama is unavailable, a configured model is missing, or Ollama returned an unparseable, truncated, or invalid embedding response.

  /proxy/ai/available:
    get:
      operationId: proxyAiAvailable
      summary: Check whether local AI search is available
      description: Checks Ollama host reachability and configured language and embedding model availability.
      tags: [AI Proxy]
      responses:
        '200':
          description: AI availability status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAvailableResponse'

  /export:
    get:
      operationId: getUserExport
      summary: Export all user-owned data
      description: Returns a JSON export of all user-owned data including settings, collection items (library, watch-later, wishlist, series-tracker, and movie-tracker), tag management, and series tracker metadata.
      tags: [User]
      responses:
        '200':
          description: Complete user data export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'

  /import:
    post:
      operationId: importUserExport
      summary: Import all user-owned data
      description: Replaces the authenticated user's exported application data with a collection tracker export. Login credentials, access tokens, and shares are preserved.
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: Import summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400':
          description: The request is not a valid collection tracker export.

  /import/collection-items:
    post:
      operationId: importCollectionItemsByImdbId
      summary: Import collection library items by IMDb ID
      description: Extracts IMDb IDs from JSON, Markdown, or plain text content, fetches metadata through the OMDb provider when configured, imports new items into the collection library, and skips IDs that already exist in any of the caller's lists.
      tags: [Collection]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionItemsImportRequest'
      responses:
        '200':
          description: Import summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemsImportResponse'
        '400':
          description: The request body does not include valid source text, the source text is too large, or it contains too many IMDb IDs.

  /tag-management:
    get:
      operationId: getTagManagement
      summary: Get tag management
      tags: [Tag]
      responses:
        '200':
          description: Current tag management array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagManagementResponse'
    post:
      operationId: updateTagManagement
      summary: Replace tag management
      description: Replaces the full tag management array and returns the stored result. Reserved system, virtual, and generated episode-progress tags are rejected.
      tags: [Tag]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagManagementResponse'
      responses:
        '200':
          description: Stored tag management.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagManagementResponse'
        '400':
          description: The request body is not a valid tag management array or contains reserved tags.

  /tag-management/rename:
    post:
      operationId: renameTag
      summary: Rename a tag
      description: Renames the caller's own collection-item tag usage. If the target tag already exists on an item, the tags are merged. If both tag-management configs exist, the target tag config is kept.
      tags: [Tag]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameTagRequest'
      responses:
        '200':
          description: Updated tag management.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenameTagResponse'
        '400':
          description: The request body is not a valid tag rename request.
