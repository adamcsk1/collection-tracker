  /collection-items/{externalIdentitySource}/{externalIdentityId}:
    put:
      operationId: changeItemByExternalId
      summary: Update a collection item by external identity
      description: Updates an item using an external identity source and ID. Shared updates require update permission for the item's exact list/content scope and cannot change its content type.
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          description: External identity source identifier.
          schema:
            type: string
            enum: [omdb, openlibrary, imdb, isbn]
        - name: externalIdentityId
          in: path
          required: true
          description: External identity ID.
          schema:
            type: string
        - name: ownerShareCode
          in: query
          required: false
          description: Owner share code of the list containing the item. Defaults to the authenticated user.
          schema:
            type: string
        - name: listType
          in: query
          required: false
          description: List containing the item. Defaults to `library`.
          schema:
            type: string
            enum: [library, up-next, wishlist, tracking, books]
            default: library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
      responses:
        '200':
          description: Item updated. Returns the stored collection item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      operationId: deleteItemByExternalId
      summary: Delete a collection item by external identity
      description: Deletes an item from the requested list using an external identity source and ID when the supplied hash matches. Shared deletes require delete permission for the item's exact list/content scope.
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          schema:
            type: string
            enum: [omdb, openlibrary, imdb, isbn]
        - name: externalIdentityId
          in: path
          required: true
          schema:
            type: string
        - name: hash
          in: query
          required: true
          description: Current SHA-512 hash of the item. Must match the stored hash.
          schema:
            type: string
        - name: ownerShareCode
          in: query
          required: false
          schema:
            type: string
        - name: listType
          in: query
          required: false
          schema:
            type: string
            enum: [library, up-next, wishlist, tracking, books]
            default: library
      responses:
        '204':
          description: Item deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /collection-items/{externalIdentitySource}/{externalIdentityId}/shares:
    get:
      operationId: getCollectionItemShares
      summary: Get outgoing share state for one physical collection item
      description: Returns every existing outgoing recipient relationship and its access state for caller-owned item. Received items cannot be reshared.
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          schema:
            type: string
            enum: [omdb, openlibrary, imdb, isbn]
        - name: externalIdentityId
          in: path
          required: true
          schema:
            type: string
        - name: listType
          in: query
          schema:
            type: string
            enum: [library, up-next, wishlist, tracking, books]
            default: library
      responses:
        '200':
          description: Outgoing recipients and item share states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemSharesEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      operationId: replaceCollectionItemShares
      summary: Replace selected recipients for one physical collection item
      description: >-
        Atomically replaces selected recipients for caller-owned physical item. Omitted selected recipients lose this
        item; their exact-scope grant is removed when no selected rows remain. New exact-scope recipients require all
        four permission booleans with read enabled. Existing selected grants reuse stored create/update/delete
        permissions. Recipients with broad `all` access must not be included because selection would be redundant.
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          schema:
            type: string
            enum: [omdb, openlibrary, imdb, isbn]
        - name: externalIdentityId
          in: path
          required: true
          schema:
            type: string
        - name: listType
          in: query
          schema:
            type: string
            enum: [library, up-next, wishlist, tracking, books]
            default: library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [selections]
              properties:
                selections:
                  type: array
                  items:
                    $ref: '#/components/schemas/CollectionItemShareSelection'
      responses:
        '204':
          description: Item selections replaced.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /collection-items/{externalIdentitySource}/{externalIdentityId}/tracking:
    post:
      operationId: addTrackingItemByExternalId
      summary: Add an item to tracking by external identity
      description: >-
        Copies a movie, series, or book into the authenticated user's tracking list using canonical provider identity.
        Movies are always completed. Series are added in progress (season metadata fetched when available).
        Books are in progress unless `markCompleted=true`. When `ownerShareCode` is supplied, the source can be a
        shared `library`, `up-next`, or `books` list and requires read permission for the source item's exact
        list/content scope. The source owner's item is not modified, except an authenticated user's own `up-next`
        source is moved to tracking.
      tags: [Collection]
      parameters:
        - name: externalIdentitySource
          in: path
          required: true
          schema:
            type: string
            enum: [omdb, openlibrary, imdb, isbn]
        - name: externalIdentityId
          in: path
          required: true
          schema:
            type: string
        - name: sourceListType
          in: query
          required: false
          schema:
            type: string
            enum: [library, up-next, books]
            default: library
        - name: markCompleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, mark the tracking item completed (required for completed books; movies always complete).
        - name: ownerShareCode
          in: query
          required: false
          description: Optional owner share code for the source list.
          schema:
            type: string
      responses:
        '200':
          description: Tracking item created or already present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

