      description: Checks collection item images through the image proxy, caches available images, and fetches updated poster URLs from the configured external metadata provider for broken images. For the authenticated user's own data this covers all list types and content types. When `ownerShareCode` identifies another owner, the refresh targets that owner's `library` list and processes only movie and series content scopes for which the caller has update permission. The request succeeds when at least one target content scope is writable.
