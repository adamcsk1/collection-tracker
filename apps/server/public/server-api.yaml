openapi: 3.1.0
info:
  title: Collection Tracker API
  version: 1.0.0
  description: REST API for the Collection Tracker server.

servers:
  - url: '{scheme}://{host}{basePath}/api/v1'
    description: API base path. When the app is deployed under a subpath (BASE_PATH env var), prepend that path before /api/v1.
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:4200
        description: Host and port of the server.
      basePath:
        default: ''
        description: Optional deployment subpath, such as /collection-tracker.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: CT.Token
      description: Signed HTTP-only access-token cookie set by POST /auth/sign-in. Valid for 15 minutes. Automatically refreshed via POST /auth/session/refresh when expired.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtained via POST /users/me/access-tokens for header-based clients.

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Access token is missing or expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Credentials are invalid or permission is denied.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds until the client may retry.
          schema:
            type: integer
            minimum: 0
        RateLimit-Limit:
          description: Request limit for the current window.
          schema:
            type: integer
        RateLimit-Remaining:
          description: Requests remaining in the current window.
          schema:
            type: integer
        RateLimit-Reset:
          description: Seconds until the current rate-limit window resets.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PayloadTooLarge:
      description: Request or upstream payload is too large.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: Media type is not supported.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadGateway:
      description: Upstream service failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: Required upstream service is unavailable or unconfigured.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details generated for every JSON error response.
      required: [type, title, status, code, instance]
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type URI. Runtime currently uses `about:blank`.
        title:
          type: string
          description: Standard HTTP status title.
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Stable status code in `HTTP_<status>` form.
          pattern: '^HTTP_[45][0-9]{2}$'
        detail:
          type: string
          description: Optional safe detail copied from a handler error payload. Never included for status 500.
        instance:
          type: string
          description: Request path without its query string.

    HealthResponse:
      type: object
      required: [status, memory, cpu, disk, load, frontend, ai]
      properties:
        status:
          type: string
          enum: [ok, warn, error]
        memory:
          type: object
          required: [usedPercent]
          properties:
            usedPercent:
              type: number
        cpu:
          type: object
          required: [usagePercent]
          properties:
            usagePercent:
              type: number
        disk:
          oneOf:
            - type: object
              required: [usedPercent]
              properties:
                usedPercent:
                  type: number
            - type: 'null'
        load:
          type: object
          required: [avg1m, avg5m, avg15m]
          properties:
            avg1m:
              type: number
            avg5m:
              type: number
            avg15m:
              type: number
        frontend:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [up, down]
        ai:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [up, down]

    SignUpRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string

    SignUpResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Long-lived user token for this account.

    SignInRequest:
      type: object
      required: [username, token]
      properties:
        username:
          type: string
        token:
          type: string

    ChangeTokenResponse:
      type: object
      required: [newToken]
      properties:
        newToken:
          type: string

    AccessToken:
      type: object
      required: [tokenHash, createdAt, userAgent, expiresAt]
      properties:
        tokenHash:
          type: string
        createdAt:
          type: string
          format: date-time
        userAgent:
          type: string
        expiresAt:
          type: ['string', 'null']
          format: date-time
          description: Null for tokens created via POST /users/me/access-tokens (intended for header-based usage).

    RefreshToken:
      type: object
      required: [tokenHash, createdAt, userAgent, expiresAt]
      properties:
        tokenHash:
          type: string
        createdAt:
          type: string
          format: date-time
        userAgent:
          type: string
        expiresAt:
          type: ['string', 'null']
          format: date-time

    AccessTokensResponse:
      type: array
      items:
        $ref: '#/components/schemas/AccessToken'

    CreateAccessTokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string

    UserSettingsResponse:
      type: object
      properties:
        theme:
          type: string
          enum: [system, dark, light]
        animatedBackground:
          type: boolean
        language:
          type: string
          enum: [en]
        defaultCollectionOwners:
          type: array
          description: Incoming collection owners selected by default for exact list and content scopes. Omitted scopes use the caller's own collection.
          items:
            $ref: '#/components/schemas/CollectionOwnerDefault'
        collectionListDisplayPreferences:
          $ref: '#/components/schemas/CollectionListDisplayPreferences'
        collectionFeaturePreferences:
          $ref: '#/components/schemas/CollectionFeaturePreferences'

    CollectionFeaturePreferences:
      type: object
      description: Collection features shown in navigation and connected actions. All features are enabled when omitted.
      required: [books, wishlist, upNext, tracking]
      additionalProperties: false
      properties:
        books:
          type: boolean
        wishlist:
          type: boolean
        upNext:
          type: boolean
        tracking:
          type: boolean

    CollectionListDisplayPreferences:
      type: object
      required: [showYear, showSharedIcon, preferredRating, imdbRatingFallback]
      properties:
        showYear:
          type: boolean
        showSharedIcon:
          type: boolean
        preferredRating:
          type: string
          enum: [imdb, rottenTomatoes, metacritic, user]
        imdbRatingFallback:
          type: boolean

    CollectionOwnerDefault:
      type: object
      additionalProperties: false
      required: [listType, contentType, ownerUserShareCode]
      oneOf:
        - properties:
            listType:
              const: library
            contentType:
              enum: [movie, series]
        - properties:
            listType:
              const: books
            contentType:
              const: book
        - properties:
            listType:
              enum: [wishlist, up-next, tracking]
            contentType:
              enum: [movie, series, book]
      properties:
        listType:
          type: string
          enum: [library, books, wishlist, up-next, tracking]
        contentType:
          type: string
          enum: [movie, series, book]
        ownerUserShareCode:
          type: string
          minLength: 1

    AiAvailableResponse:
      type: object
      required: [aiAvailable]
      properties:
        aiAvailable:
          type: boolean
          description: Indicates whether the configured Ollama host is reachable and the configured language and embedding models are available.

    UserSettingsRequest:
      type: object
      properties:
        theme:
          type: string
          enum: [system, dark, light]
        animatedBackground:
          type: boolean
        language:
          type: string
          enum: [en]
        defaultCollectionOwners:
          type: array
          description: Complete replacement set of incoming collection owners selected by default for exact list and content scopes. Each scope requires current Add permission.
          items:
            $ref: '#/components/schemas/CollectionOwnerDefault'
        collectionListDisplayPreferences:
          $ref: '#/components/schemas/CollectionListDisplayPreferences'
        collectionFeaturePreferences:
          $ref: '#/components/schemas/CollectionFeaturePreferences'
        fromLogin:
          type: boolean
          description: When true, language and theme are only initialized if the user has not already stored those settings.

    UserShareGrant:
      type: object
      unevaluatedProperties: false
      description: >-
        Permissions for one list/content scope. Valid combinations follow collection rules: `library` supports movie
        and series, `books` supports book, and `wishlist`, `up-next`, and `tracking` support all content types.
        Create, update, or delete permission also implies read permission when stored.
      required: [listType, contentType, canRead, canCreate, canUpdate, canDelete, readMode]
      oneOf:
        - properties:
            listType:
              const: library
            contentType:
              type: string
              enum: [movie, series]
        - properties:
            listType:
              const: books
            contentType:
              const: book
        - properties:
            listType:
              type: string
              enum: [wishlist, up-next, tracking]
            contentType:
              type: string
              enum: [movie, series, book]
      properties:
        canRead:
          type: boolean
        canCreate:
          type: boolean
        canUpdate:
          type: boolean
        canDelete:
          type: boolean
        readMode:
          type: string
          enum: [selected, all]
          description: >-
            Access mode for this scope. `all` grants full physical scope and `selected` grants explicit item rows.
            Omit the scope from the grants array to remove its grant and selections. Settings can change `all` to
            `selected` only when explicit selections already exist for exact scope; otherwise the scope is omitted.

    CollectionItemSharePermissions:
      type: object
      additionalProperties: false
      required: [canRead, canCreate, canUpdate, canDelete]
      properties:
        canRead:
          type: boolean
        canCreate:
          type: boolean
        canUpdate:
          type: boolean
        canDelete:
          type: boolean

    CollectionItemShareSelectionPermissions:
      type: object
      additionalProperties: false
      required: [canRead, canCreate, canUpdate, canDelete]
      properties:
        canRead:
          type: boolean
          const: true
        canCreate:
          type: boolean
        canUpdate:
          type: boolean
        canDelete:
          type: boolean

    CollectionItemShare:
      type: object
      required: [sharedWithUserShareCode, sharedWithUsername, readMode, permissions]
      properties:
        sharedWithUserShareCode:
          type: string
        sharedWithUsername:
          type: ['string', 'null']
        readMode:
          type: string
          enum: [none, selected, all]
          description: Access state for this physical item. `none` can still have permissions for other selected items in the same scope.
        permissions:
          oneOf:
            - $ref: '#/components/schemas/CollectionItemSharePermissions'
            - type: 'null'

    CollectionItemShareSelection:
      type: object
      additionalProperties: false
      required: [sharedWithUserShareCode]
      properties:
        sharedWithUserShareCode:
          type: string
        permissions:
          $ref: '#/components/schemas/CollectionItemShareSelectionPermissions'
          description: Required only when recipient has no existing grant for item's exact physical list/content scope. Read must be true.

    CollectionItemSharesEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CollectionItemShare'

    UserShareOutgoing:
      type: object
      required: [sharedWithUserShareCode, sharedWithUsername, grants]
      properties:
        sharedWithUserShareCode:
          type: string
        sharedWithUsername:
          type: ['string', 'null']
        grants:
          type: array
          items:
            $ref: '#/components/schemas/UserShareGrant'

    UserShareIncoming:
      type: object
      required: [ownerUserShareCode, ownerUsername, grants]
      properties:
        ownerUserShareCode:
          type: string
        ownerUsername:
          type: ['string', 'null']
        grants:
          type: array
          items:
            $ref: '#/components/schemas/UserShareGrant'

    UserSharesResponse:
      type: object
      required: [userShareCode, outgoing, incoming]
      properties:
        userShareCode:
          type: string
        outgoing:
          type: array
          items:
            $ref: '#/components/schemas/UserShareOutgoing'
        incoming:
          type: array
          items:
            $ref: '#/components/schemas/UserShareIncoming'

    CollectionItem:
      type: object
      required:
        [
          image,
          title,
          titleLower,
          genre,
          externalProvider,
          externalItemId,
          tags,
          year,
          rate,
          rottenTomatoesRate,
          metacriticRate,
          userRate,
          hash,
          actors,
          plot,
          listType,
          contentType,
          favorite,
          watched,
          watchedAt,
          ownerShareCode,
        ]
      properties:
        image:
          type: string
        title:
          type: string
        titleLower:
          type: string
          description: Lowercase cached title for faster searching.
        genre:
          type: array
          items:
            type: string
        IMDbId:
          type: string
          description: Legacy IMDb-compatible identifier.
        externalProvider:
          type: string
          enum: [omdb, openlibrary]
          description: External metadata provider that owns `externalItemId`, such as `omdb`.
        externalItemId:
          type: string
          description: Provider-native item identifier used for metadata refreshes and duplicate checks.
        externalIds:
          type: array
          description: Optional cross-provider identifiers known for this item. Used as duplicate-check evidence.
          items:
            $ref: '#/components/schemas/ExternalItemIdentity'
        canonicalItemId:
          type: string
          description: Local canonical identity used for cross-provider duplicate checks when known.
        tags:
          type: array
          items:
            type: string
        year:
          type: ['string', 'null']
          description: Release year or year interval such as `2026-2028` or `2027-`.
        rate:
          type: string
        rottenTomatoesRate:
          type: string
        metacriticRate:
          type: string
        userRate:
          type: ['number', 'null']
          minimum: 0
          maximum: 10
          multipleOf: 0.1
        hash:
          type: string
          description: SHA-512 hash of the structured item content.
        actors:
          type: string
        plot:
          type: string
        listType:
          type: string
          enum: [library, up-next, wishlist, tracking, books]
          description: >-
            Logical list containing the item. Owned books use `books`. Books are also allowed on
            `wishlist`, `up-next`, and `tracking`. `library` is movie/series only.
        contentType:
          type: string
          enum: [movie, series, book]
          description: >-
            Item media type. `library` is movie/series only. `tracking` accepts movie, series, and book.
            `books` is book only. Wishlist/up-next accept all three.
        favorite:
          type: boolean
          description: Whether the item is marked as a favorite. Allowed on ownership lists (`library`, `books`) only.
        watched:
          type: boolean
          description: >-
            Whether the authenticated viewer has a completed tracking twin for this ownership item
            (movies and books).
        watchedAt:
          type: ['string', 'null']
          description: Timestamp when a tracker item was completed. For series this is set only while completed.
        progressCurrent:
          type: ['integer', 'null']
          minimum: 0
          description: Optional book reading progress (pages read) on tracking items.
        progressTotal:
          type: ['integer', 'null']
          minimum: 1
          description: Optional book total pages on tracking items.
        ownerShareCode:
          type: string
          description: Share code of the item owner, including items owned by the authenticated user.

    CollectionItemChange:
      type: object
      required:
        [
          image,
          title,
          genre,
          externalProvider,
          externalItemId,
          tags,
          year,
          rate,
          rottenTomatoesRate,
          metacriticRate,
          userRate,
          actors,
          plot,
          contentType,
          favorite,
        ]
      properties:
        image:
          type: string
        title:
          type: string
        genre:
          type: array
          items:
            type: string
        IMDbId:
          type: string
          description: Legacy IMDb-compatible identifier. For OMDb-backed items this matches `externalItemId`.
        externalProvider:
          type: string
          enum: [omdb, openlibrary]
        externalItemId:
          type: string
        externalIds:
          type: array
          description: Optional cross-provider identifiers known for this item. Used as duplicate-check evidence.
          items:
            $ref: '#/components/schemas/ExternalItemIdentity'
        tags:
          type: array
          items:
            type: string
        year:
          type: ['string', 'null']
          description: Release year or year interval such as `2026-2028` or `2027-`.
        rate:
          type: string
        rottenTomatoesRate:
          type: string
        metacriticRate:
          type: string
        userRate:
          type: ['number', 'null']
          minimum: 0
          maximum: 10
          multipleOf: 0.1
        actors:
          type: string
        plot:
          type: string
        contentType:
          type: string
          enum: [movie, series, book]
          description: >-
            `library` accepts movie and series, `books` accepts book, and `wishlist`, `up-next`, and `tracking`
            accept all content types.
        favorite:
          type: boolean
        progressCurrent:
          type: ['integer', 'null']
          minimum: 0
          description: Optional book reading progress (pages read) on tracking items.
        progressTotal:
          type: ['integer', 'null']
          minimum: 1
          description: Optional book total pages on tracking items.

    CollectionItemsResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CollectionItem'
        page:
          $ref: '#/components/schemas/CursorPage'

    CursorPage:
      oneOf:
        - type: object
          required: [limit, hasMore, nextCursor]
          additionalProperties: false
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 100
            hasMore:
              const: true
            nextCursor:
              type: string
              minLength: 1
        - type: object
          required: [limit, hasMore, nextCursor]
          additionalProperties: false
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 100
            hasMore:
              const: false
            nextCursor:
              type: 'null'

    CollectionMatchedItemsRequest:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          description: External identities to match, in result ranking order.
          maxItems: 6000
          items:
            $ref: '#/components/schemas/ExternalItemIdentity'
        cursor:
          type: string
          minLength: 1
          maxLength: 4096
          description: Opaque signed cursor returned in the preceding response.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        filters:
          type: object
          additionalProperties: false
          properties:
            search:
              type: string
            tags:
              type: array
              maxItems: 100
              items:
                type: string
            genres:
              type: array
              maxItems: 100
              items:
                type: string
            tagMode:
              type: string
              enum: [any, all]
            type:
              type: string
              enum: [movie, series, book]
            watched:
              type: boolean
            completed:
              type: boolean
            favorite:
              type: boolean
            shared:
              type: string
              enum: [mine, shared]
              description: Filter to own items only, shared items only, or omit for both.
            listType:
              type: string
              enum: [library, up-next, wishlist, tracking, books]
          description: >-
            Filters applied before matching. Results always preserve the first rank of each matched identity;
            general collection order controls are not supported by this operation.

    CollectionItemSuggestionsResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            type: object
            required: [label, value, kind]
            properties:
              label:
                type: string
              value:
                type: string
              kind:
                type: string
                enum: [title, tag, genre, actor, imdbId]

    TagSuggestionsResponse:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            type: string

    GenreSuggestionsResponse:
      type: object
      required: [genres]
      properties:
        genres:
          type: array
          items:
            type: string

    CollectionItemExistsResponse:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
        hash:
          type: string
          description: Content hash of the existing item, when it exists.

    RandomImagesResponse:
      type: object
      required: [images]
      properties:
        images:
          type: array
          items:
            type: string

    CollectionStatisticsResponse:
      oneOf:
        - $ref: '#/components/schemas/AllCollectionStatisticsResponse'
        - $ref: '#/components/schemas/MovieCollectionStatisticsResponse'
        - $ref: '#/components/schemas/SeriesCollectionStatisticsResponse'
        - $ref: '#/components/schemas/BookCollectionStatisticsResponse'

    CommonCollectionStatisticsCharts:
      type: object
      required: [tagCounts, genreCounts, releaseYearCounts, userRatingCounts]
      properties:
        tagCounts:
          type: array
          items:
            type: object
            required: [tag, count]
            properties:
              tag: { type: string }
              count: { type: integer }
        genreCounts:
          type: array
          items:
            type: object
            required: [genre, count]
            properties:
              genre: { type: string }
              count: { type: integer }
        releaseYearCounts:
          type: array
          description: Counts for exact four-digit release years, ordered by year.
          items:
            type: object
            required: [year, count]
            properties:
              year: { type: string, pattern: '^\d{4}$' }
              count: { type: integer }
        userRatingCounts:
          type: array
          description: Rated-item counts grouped by the integer floor of the 0-10 user rating.
          items:
            type: object
            required: [rating, count]
            properties:
              rating: { type: integer }
              count: { type: integer }

    AllCollectionStatisticsCharts:
      allOf:
        - $ref: '#/components/schemas/CommonCollectionStatisticsCharts'
        - type: object
          required: [mediaTypeCounts, statusCounts]
          properties:
            mediaTypeCounts:
              type: array
              items:
                type: object
                required: [type, count]
                properties:
                  type: { type: string, enum: [movie, series, book] }
                  count: { type: integer }
            statusCounts:
              type: array
              maxItems: 0

    MovieCollectionStatisticsCharts:
      allOf:
        - $ref: '#/components/schemas/CommonCollectionStatisticsCharts'
        - $ref: '#/components/schemas/SpecificCollectionStatisticsCharts'
        - type: object
          properties:
            statusCounts:
              type: array
              items:
                $ref: '#/components/schemas/MovieCollectionStatisticsStatusCount'

    SeriesCollectionStatisticsCharts:
      allOf:
        - $ref: '#/components/schemas/CommonCollectionStatisticsCharts'
        - $ref: '#/components/schemas/SpecificCollectionStatisticsCharts'
        - type: object
          properties:
            statusCounts:
              type: array
              items:
                $ref: '#/components/schemas/SeriesCollectionStatisticsStatusCount'

    BookCollectionStatisticsCharts:
      allOf:
        - $ref: '#/components/schemas/CommonCollectionStatisticsCharts'
        - $ref: '#/components/schemas/SpecificCollectionStatisticsCharts'
        - type: object
          properties:
            statusCounts:
              type: array
              items:
                $ref: '#/components/schemas/BookCollectionStatisticsStatusCount'

    SpecificCollectionStatisticsCharts:
      type: object
      required: [mediaTypeCounts, statusCounts]
      properties:
        mediaTypeCounts:
          type: array
          maxItems: 0
        statusCounts:
          type: array

    MovieCollectionStatisticsStatusCount:
      type: object
      required: [status, count]
      properties:
        status: { type: string, enum: [watched, unwatched] }
        count: { type: integer }

    SeriesCollectionStatisticsStatusCount:
      type: object
      required: [status, count]
      properties:
        status: { type: string, enum: [untracked, completed, inProgress] }
        count: { type: integer }

    BookCollectionStatisticsStatusCount:
      type: object
      required: [status, count]
      properties:
        status: { type: string, enum: [read, unread, inProgress] }
        count: { type: integer }

    AllCollectionStatisticsResponse:
      type: object
      required: [scope, summary, charts]
      properties:
        scope: { type: string, const: all }
        summary:
          type: object
          required: [total, movies, series, books, favorites]
          properties:
            total: { type: integer }
            movies: { type: integer }
            series: { type: integer }
            books: { type: integer }
            favorites: { type: integer }
        charts: { $ref: '#/components/schemas/AllCollectionStatisticsCharts' }

    MovieCollectionStatisticsResponse:
      type: object
      required: [scope, summary, charts]
      properties:
        scope: { type: string, const: movie }
        summary:
          type: object
          required: [total, favorites, watched, unwatched]
          properties:
            total: { type: integer }
            favorites: { type: integer }
            watched: { type: integer }
            unwatched: { type: integer }
        charts: { $ref: '#/components/schemas/MovieCollectionStatisticsCharts' }

    SeriesCollectionStatisticsResponse:
      type: object
      required: [scope, summary, charts]
      properties:
        scope: { type: string, const: series }
        summary:
          type: object
          required: [total, favorites, tracked, untracked, completed, inProgress]
          properties:
            total: { type: integer }
            favorites: { type: integer }
            tracked: { type: integer }
            untracked: { type: integer }
            completed: { type: integer }
            inProgress: { type: integer }
        charts: { $ref: '#/components/schemas/SeriesCollectionStatisticsCharts' }

    BookCollectionStatisticsResponse:
      type: object
      required: [scope, summary, charts]
      properties:
        scope: { type: string, const: book }
        summary:
          type: object
          required: [total, favorites, read, unread, inProgress]
          properties:
            total: { type: integer }
            favorites: { type: integer }
            read: { type: integer }
            unread: { type: integer }
            inProgress: { type: integer }
        charts: { $ref: '#/components/schemas/BookCollectionStatisticsCharts' }

    CreateRequest:
      allOf:
        - $ref: '#/components/schemas/CollectionItemChange'
        - type: object
          properties:
            targetOwnerShareCode:
              type: string
              description: >-
                Optional owner share code to create the item in that owner's target list/content scope. The caller must
                have create permission for the exact `listType` and `contentType`. Defaults to the authenticated user.
            listType:
              type: string
              enum: [library, up-next, wishlist, tracking, books]
              default: library
              description: >-
                Target list. Defaults to `library`. `library` accepts movies and series, `books` accepts books only,
                and `wishlist`, `up-next`, and `tracking` accept movies, series, and books.

    CreateResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: '#/components/schemas/CollectionItem'

    ChangeRequest:
      allOf:
        - $ref: '#/components/schemas/CollectionItemChange'
        - type: object
          required: [hash]
          properties:
            hash:
              type: string
              description: Current SHA-512 hash of the item. Must match the stored hash.

    ChangeResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: '#/components/schemas/CollectionItem'

    MarkAllCompletedResponse:
      type: object
      required: [changedCount]
      properties:
        changedCount:
          type: integer

    MarkAllSeriesCompletedResponse:
      type: object
      required: [trackedCount, progressChangedCount]
      properties:
        trackedCount:
          type: integer
          description: Number of library series newly copied into the authenticated user's tracking.
        progressChangedCount:
          type: integer
          description: Number of tracking items whose completed episode progress or completed status changed.

    MarkAllUncompletedResponse:
      type: object
      required: [changedCount]
      properties:
        changedCount:
          type: integer

    RefreshImagesResponse:
      type: object
      required: [count, checked, fixed, errors]
      properties:
        count:
          type: integer
          description: Total number of collection items processed.
        checked:
          type: integer
          description: Number of images checked.
        fixed:
          type: integer
          description: Number of images updated from external metadata.
        errors:
          type: integer
          description: Number of images that could not be fixed.

    RefreshExternalRatingsResponse:
      type: object
      required: [count, checked, fixed, errors]
      properties:
        count:
          type: integer
          description: Total number of collection items processed.
        checked:
          type: integer
          description: Number of items checked.
        fixed:
          type: integer
          description: Number of items with updated IMDb, Rotten Tomatoes, or Metacritic ratings.
        errors:
          type: integer
          description: Number of items whose external ratings could not be refreshed.

    TrackingSeason:
      type: object
      required: [season, episodes]
      properties:
        season:
          type: integer
          minimum: 1
          maximum: 50
        episodes:
          type: integer
          minimum: 1
          maximum: 100
        titles:
          type: array
          items:
            type: string
          description: Optional per-episode titles.

    TrackingSeasonsRequest:
      type: object
      required: [seasons]
      properties:
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/TrackingSeason'

    TrackingSeasonsResponse:
      type: object
      required: [seasons]
      properties:
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/TrackingSeason'
        item:
          $ref: '#/components/schemas/CollectionItem'
          description: Updated collection item when this response is returned from a mutating endpoint.

    TrackingCompletedEpisode:
      type: object
      required: [season, episode]
      properties:
        season:
          type: integer
          minimum: 1
          maximum: 50
        episode:
          type: integer
          minimum: 1
          maximum: 100

    TrackingCompletedEpisodesRequest:
      type: object
      required: [completedEpisodes]
      properties:
        completedEpisodes:
          type: array
          items:
            $ref: '#/components/schemas/TrackingCompletedEpisode'

    TrackingCompletedEpisodesResponse:
      type: object
      required: [completedEpisodes, lastCompletedEpisode]
      properties:
        completedEpisodes:
          type: array
          items:
            $ref: '#/components/schemas/TrackingCompletedEpisode'
        lastCompletedEpisode:
          type: [object, 'null']
          required: [season, episode]
          properties:
            season:
              type: integer
            episode:
              type: integer
        item:
          $ref: '#/components/schemas/CollectionItem'
          description: Updated collection item when this response is returned from a mutating endpoint.

    ExternalMetadataItem:
      type: object
      required: [provider, providerItemId, title, year, contentType, poster, plot, actors, genres, ratings]
      properties:
        provider:
          type: string
          enum: [omdb, openlibrary]
        providerItemId:
          type: string
        externalIds:
          type: array
          description: Cross-provider identifiers known for this metadata item.
          items:
            $ref: '#/components/schemas/ExternalItemIdentity'
        title:
          type: string
        year:
          type: string
        contentType:
          type: string
          enum: [movie, series, book]
        poster:
          type: string
        plot:
          type: string
        actors:
          type: string
        genres:
          type: array
          items:
            type: string
        ratings:
          type: array
          items:
            type: object
            required: [source, value]
            properties:
              source:
                type: string
              value:
                type: string

    ExternalItemIdentity:
      type: object
      required: [source, id]
      properties:
        source:
          type: string
          enum: [omdb, openlibrary, imdb, isbn]
        id:
          type: string

    ExternalMetadataSearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExternalMetadataItem'

    ExternalMetadataProvider:
      type: object
      required: [name, supportsSeasonMetadata, supportsDirectImdbId]
      properties:
        name:
          type: string
          enum: [omdb, openlibrary]
          description: Configured external metadata provider identifier.
        supportsSeasonMetadata:
          type: boolean
          description: Whether the provider can fetch series season metadata.
        supportsDirectImdbId:
          type: boolean
          description: Whether the provider can resolve a pasted IMDb ID directly.

    ExternalMetadataProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ExternalMetadataProvider'

    AiQueryRequest:
      type: object
      required: [prompt, listType]
      properties:
        prompt:
          type: string
          description: Natural-language question about the caller's collection list.
          examples:
            - Which are sci-fi movies?
        listType:
          type: string
          enum: [library, up-next, wishlist, tracking, books]
          description: Collection list to search within.

    AiQueryResponse:
      type: object
      required: [matchedIds]
      properties:
        matchedIds:
          type: array
          items:
            type: string
          description: >-
            Candidate identities matched by AI search from the caller's selected collection list. IMDb-backed items
            use their raw IMDb ID; provider-native items use `source:id`, for example
            `openlibrary:9780140328721`.
          examples:
            - - tt0133093
              - openlibrary:9780140328721

    TagManagement:
      type: object
      required: [tag, color, useForImageBorder, useForTextColor, useForImageBadge, weight]
      properties:
        tag:
          type: string
          examples:
            - '#example'
        color:
          type: ['string', 'null']
          examples:
            - '#112233'
        useForImageBorder:
          type: boolean
        useForTextColor:
          type: boolean
        useForImageBadge:
          type: boolean
        weight:
          type: integer

    TagManagementResponse:
      type: array
      items:
        $ref: '#/components/schemas/TagManagement'

    RenameTagRequest:
      type: object
      required: [oldTag, newTag]
      properties:
        oldTag:
          type: string
          examples:
            - '#old'
        newTag:
          type: string
          examples:
            - '#new'

    RenameTagResponse:
      type: object
      required: [renamedItemCount, tagManagement]
      properties:
        renamedItemCount:
          type: integer
          description: Number of the caller's own collection items that had the old tag.
        tagManagement:
          $ref: '#/components/schemas/TagManagementResponse'

    ExportResponse:
      type: object
      required: [type, version, userSettings, collectionItems, tagManagement, trackingData]
      properties:
        type:
          type: string
          enum: [collection-tracker-export]
          description: Export document type. Required for import round-trips.
        version:
          type: integer
          enum: [11]
          description: Export schema version. Import also accepts versions 9 and 10.
        userSettings:
          $ref: '#/components/schemas/UserSettingsResponse'
        collectionItems:
          type: array
          items:
            $ref: '#/components/schemas/CollectionItem'
        tagManagement:
          $ref: '#/components/schemas/TagManagementResponse'
        trackingData:
          type: object
          additionalProperties:
            type: object
            required: [seasons, completedEpisodes]
            properties:
              seasons:
                type: array
                items:
                  $ref: '#/components/schemas/TrackingSeason'
              completedEpisodes:
                type: array
                items:
                  $ref: '#/components/schemas/TrackingCompletedEpisode'

    ImportCollectionItemBase:
      type: object
      required:
        [
          image,
          title,
          genre,
          tags,
          year,
          rate,
          rottenTomatoesRate,
          metacriticRate,
          userRate,
          actors,
          plot,
          externalProvider,
          externalItemId,
          listType,
          watchedAt,
        ]
      properties:
        image:
          type: string
        title:
          type: string
        genre:
          type: array
          items:
            type: string
        IMDbId:
          type: string
        tags:
          type: array
          items:
            type: string
        year:
          type: ['string', 'null']
        rate:
          type: string
        rottenTomatoesRate:
          type: string
        metacriticRate:
          type: string
        userRate:
          type: ['number', 'null']
          minimum: 0
          maximum: 10
          multipleOf: 0.1
        actors:
          type: string
        plot:
          type: string
        externalProvider:
          type: string
          enum: [omdb, openlibrary]
          description: External metadata provider that owns the canonical item identity.
        externalItemId:
          type: string
          description: Provider-specific canonical item ID.
        externalIds:
          type: array
          description: Optional cross-provider identifiers known for this item.
          items:
            $ref: '#/components/schemas/ExternalItemIdentity'
        canonicalItemId:
          type: string
          description: Optional local canonical identity preserved from exports.
        listType:
          type: string
          description: >-
            Logical list containing the item. Owned books use `books`. Books are also allowed on
            `wishlist`, `up-next`, and `tracking`. `library` is movie/series only.
        watchedAt:
          type: ['string', 'null']
        progressCurrent:
          type: ['integer', 'null']
          minimum: 0
          description: Optional in-progress value for tracking items (for example book pages read).
        progressTotal:
          type: ['integer', 'null']
          minimum: 1
          description: Optional total progress units for tracking items (for example book page count).

    ImportCollectionItemV9:
      allOf:
        - $ref: '#/components/schemas/ImportCollectionItemBase'
        - type: object
          required: [contentType, favorite]
          properties:
            listType:
              type: string
              enum: [library, watchlist, up-next, wishlist, tracking, books]
            contentType:
              type: string
              enum: [movie, series, book]
              description: >-
                Item media type. `library` is movie/series only. `tracking` accepts movie, series, and book.
                `books` is book only. Wishlist/up-next accept all three.
            favorite:
              type: boolean

    ImportCollectionItemV10:
      allOf:
        - $ref: '#/components/schemas/ImportCollectionItemV9'
        - type: object
          properties:
            listType:
              type: string
              enum: [library, up-next, wishlist, tracking, books]

    ImportUserSettingsV9:
      type: object
      additionalProperties: false
      properties:
        theme:
          type: string
          enum: [system, dark, light]
        animatedBackground:
          type: boolean
        language:
          type: string
          enum: [en]
        defaultLibraryOwnerShareCode:
          type: ['string', 'null']
          minLength: 1
          description: Legacy Library owner default converted into exact Movie and Series defaults when access remains valid.
        collectionListDisplayPreferences:
          $ref: '#/components/schemas/CollectionListDisplayPreferences'
        collectionFeaturePreferences:
          type: object
          additionalProperties: false
          required: [books, wishlist, watchlist, tracking]
          properties:
            books:
              type: boolean
            wishlist:
              type: boolean
            watchlist:
              type: boolean
            tracking:
              type: boolean

    ImportUserSettingsV10:
      type: object
      additionalProperties: false
      properties:
        theme:
          type: string
          enum: [system, dark, light]
        animatedBackground:
          type: boolean
        language:
          type: string
          enum: [en]
        defaultLibraryOwnerShareCode:
          type: ['string', 'null']
          minLength: 1
          description: Legacy Library owner default converted into exact Movie and Series defaults when access remains valid.
        collectionListDisplayPreferences:
          $ref: '#/components/schemas/CollectionListDisplayPreferences'
        collectionFeaturePreferences:
          $ref: '#/components/schemas/CollectionFeaturePreferences'

    ImportDataV9:
      type: object
      required: [userSettings, collectionItems, tagManagement, trackingData]
      properties:
        userSettings:
          $ref: '#/components/schemas/ImportUserSettingsV9'
        collectionItems:
          type: array
          items:
            $ref: '#/components/schemas/ImportCollectionItemV9'
        tagManagement:
          $ref: '#/components/schemas/TagManagementResponse'
        trackingData:
          type: object
          description: Tracking list data keyed by encoded provider identity, formatted as provider/externalItemId.
          additionalProperties:
            type: object
            required: [seasons, completedEpisodes]
            properties:
              seasons:
                type: array
                items:
                  $ref: '#/components/schemas/TrackingSeason'
              completedEpisodes:
                type: array
                items:
                  $ref: '#/components/schemas/TrackingCompletedEpisode'

    ImportDataV10:
      type: object
      required: [userSettings, collectionItems, tagManagement, trackingData]
      properties:
        userSettings:
          $ref: '#/components/schemas/ImportUserSettingsV10'
        collectionItems:
          type: array
          items:
            $ref: '#/components/schemas/ImportCollectionItemV10'
        tagManagement:
          $ref: '#/components/schemas/TagManagementResponse'
        trackingData:
          type: object
          description: Tracking list data keyed by encoded provider identity, formatted as provider/externalItemId.
          additionalProperties:
            type: object
            required: [seasons, completedEpisodes]
            properties:
              seasons:
                type: array
                items:
                  $ref: '#/components/schemas/TrackingSeason'
              completedEpisodes:
                type: array
                items:
                  $ref: '#/components/schemas/TrackingCompletedEpisode'

    ImportDataV11:
      type: object
      required: [userSettings, collectionItems, tagManagement, trackingData]
      properties:
        userSettings:
          $ref: '#/components/schemas/UserSettingsResponse'
        collectionItems:
          type: array
          items:
            $ref: '#/components/schemas/ImportCollectionItemV10'
        tagManagement:
          $ref: '#/components/schemas/TagManagementResponse'
        trackingData:
          type: object
          description: Tracking list data keyed by encoded provider identity, formatted as provider/externalItemId.
          additionalProperties:
            type: object
            required: [seasons, completedEpisodes]
            properties:
              seasons:
                type: array
                items:
                  $ref: '#/components/schemas/TrackingSeason'
              completedEpisodes:
                type: array
                items:
                  $ref: '#/components/schemas/TrackingCompletedEpisode'

    ImportRequest:
      oneOf:
        - allOf:
            - type: object
              required: [type, version]
              properties:
                type:
                  type: string
                  const: collection-tracker-export
                version:
                  type: integer
                  const: 9
            - $ref: '#/components/schemas/ImportDataV9'
        - allOf:
            - type: object
              required: [type, version]
              properties:
                type:
                  type: string
                  const: collection-tracker-export
                version:
                  type: integer
                  const: 10
            - $ref: '#/components/schemas/ImportDataV10'
        - allOf:
            - type: object
              required: [type, version]
              properties:
                type:
                  type: string
                  const: collection-tracker-export
                version:
                  type: integer
                  const: 11
            - $ref: '#/components/schemas/ImportDataV11'

    ImportResponse:
      type: object
      required:
        [importedCollectionItems, importedTagManagement, importedTrackingSeasons, importedTrackingCompletedEpisodes]
      properties:
        importedCollectionItems:
          type: integer
        importedTagManagement:
          type: integer
        importedTrackingSeasons:
          type: integer
        importedTrackingCompletedEpisodes:
          type: integer

    CollectionItemsImportRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
          maxLength: 1000000
          description: JSON, Markdown, or plain text content containing up to 100 unique IMDb IDs.

    CollectionItemsImportResponse:
      type: object
      required: [totalCount, importedCount, skippedCount, errorCount]
      properties:
        totalCount:
          type: integer
          description: Number of unique IMDb IDs extracted from the source.
        importedCount:
          type: integer
          description: Number of new collection library items imported.
        skippedCount:
          type: integer
          description: Number of IMDb IDs skipped because they already exist in one of the caller's lists.
        errorCount:
          type: integer
          description: Number of IMDb IDs that could not be imported from external metadata.

    HealthEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/HealthResponse'
    SignUpEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SignUpResponse'
    ChangeTokenEnvelope:
      type: object
      required: [data]
