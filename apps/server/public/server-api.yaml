security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: Public
    description: Endpoints that do not require authentication.
  - name: Session
    description: Access token and session management.
  - name: User
    description: User account and settings.
  - name: Collection
    description: CRUD operations for structured collection items.
  - name: External Metadata Proxy
    description: Proxy endpoints for external metadata providers. OMDb is used when `OMDB_API_KEY` is configured; Open Library is always available for book metadata.
  - name: Image Proxy
    description: Cached proxy endpoint for external collection item images.
  - name: AI Proxy
    description: Proxy endpoint for local Ollama AI search.
  - name: Tag
    description: Tag management.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Server health check
      security: []
      tags: [Public]
      responses:
        '200':
          description: Health status of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/sign-up:
    post:
      operationId: signUp
      summary: Create a new account
      security: []
      tags: [Public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '200':
          description: Account created. Returns the long-lived user token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in and obtain an access token
      security: []
      tags: [Public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '204':
          description: Authenticated. Sets signed HTTP-only `CT.Token` (15 minutes) and `CT.RefreshToken` (7 days) cookies.
          headers:
            Set-Cookie:
              schema:
                type: string
              examples:
                access:
                  value: CT.Token=<jwt>; HttpOnly; Secure; SameSite=Strict; Max-Age=900
                refresh:
                  value: CT.RefreshToken=<jwt>; HttpOnly; Secure; SameSite=Strict; Max-Age=604800
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/session:
    delete:
      operationId: logout
      summary: Revoke the current access token and clear both auth cookies
      tags: [Session]
      responses:
        '204':
          description: Logged out successfully. Both CT.Token and CT.RefreshToken cookies are cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me/token:
    put:
      operationId: changeUserToken
      summary: Rotate the long-lived user token
      description: Rotates the user's long-lived token and replaces both the active access and refresh token sets.
      tags: [Session]
      responses:
        '200':
          description: Token rotated. Returns the new long-lived token. Both CT.Token and CT.RefreshToken cookies are updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeTokenEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me/access-tokens:
    post:
      operationId: createAccessToken
      summary: Create an additional access token for header-based clients
      description: Created tokens are stored with `expiresAt` set to null.
      tags: [Session]
      responses:
        '200':
          description: New access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccessTokenEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      operationId: listAccessTokens
      summary: List all stored access tokens
      description: Returns token hashes, creation dates, user agents, and expiresAt values.
      tags: [Session]
      responses:
        '200':
          description: Array of stored access token metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokensEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me/access-tokens/{tokenHash}:
    delete:
      operationId: deleteAccessToken
      summary: Delete one access token by hash
      tags: [Session]
      parameters:
        - name: tokenHash
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Token deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/session/refresh:
    post:
      operationId: refreshAccessToken
      summary: Refresh the access token using the refresh token
      description: Validates the CT.RefreshToken cookie (or Authorization header) and issues a new CT.Token access-token cookie.
      security: []
      tags: [Session]
      responses:
        '204':
          description: Access token refreshed. New CT.Token cookie is set.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me:
    delete:
      operationId: deleteUser
      summary: Delete the current user account
      description: Deletes the user, all stored collection items, and related configuration.
      tags: [User]
      responses:
        '204':
          description: User deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me/settings:
    get:
      operationId: getUserSettings
      summary: Get user settings
      tags: [User]
      responses:
        '200':
          description: Current user settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: updateUserSettings
      summary: Update user settings
      description: Accepts any subset of user settings and returns the merged settings object.
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsRequest'
      responses:
        '200':
          description: Merged settings after update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me/shares:
    get:
      operationId: getUserShares
      summary: Get user shares
      tags: [User]
      responses:
        '200':
          description: Current user hash and share lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSharesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: saveUserShare
      summary: Create or update a share
      description: Replaces grants for invited user while preserving outgoing relationship. Each grant applies to one valid list/content scope; mutation permissions imply read permission, duplicate scopes are rejected, and omitting a previously granted scope removes that scope and its selections.
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sharedWithUserShareCode, grants]
              properties:
                sharedWithUserShareCode:
                  type: string
                  description: Short share code shown by the invited user.
                grants:
                  type: array
                  items:
                    $ref: '#/components/schemas/UserShareGrant'
      responses:
        '204':
          description: Share saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me/shares/incoming/{ownerUserShareCode}:
    delete:
      operationId: revokeIncomingUserShare
      summary: Revoke an incoming share as the invited user
      tags: [User]
      parameters:
        - name: ownerUserShareCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Incoming share revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me/shares/{sharedWithUserShareCode}:
    delete:
      operationId: deleteUserShare
      summary: Remove a share
      tags: [User]
      parameters:
        - name: sharedWithUserShareCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Share removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /collection-items:
    get:
      operationId: searchItems
      summary: Search collection items
      description: >-
        Returns caller-owned and exactly readable shared items. `listType` defaults to `library`; that view folds the
        `books` list into library results, while `type=book` selects folded books and movie/series filters select the
        physical `library` list. Explicit `listType=books` addresses only the books list.
      tags: [Collection]
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque signed cursor returned in the preceding response.
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: search
          in: query
          schema:
            type: string
        - name: tags
          in: query
          description: Comma-separated or repeated custom tags. Repeated values are combined. Maximum 100 values.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
        - name: genres
          in: query
          description: Comma-separated or repeated genres. Repeated values are combined. Maximum 100 values.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
        - name: tagMode
          in: query
          schema:
            type: string
            enum: [any, all]
            default: any
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, series, book]
        - name: favorite
          in: query
          schema:
            type: boolean
        - name: watched
          in: query
          schema:
            type: boolean
        - name: completed
          in: query
          schema:
            type: boolean
        - name: shared
          in: query
          schema:
            type: string
            enum: [mine, shared]
          description: Own items only, shared items only, or omit for both.
        - name: listType
          in: query
          schema:
            type: string
            enum: [library, up-next, wishlist, tracking, books]
            default: library
        - name: orderBy
          in: query
          schema:
            type: string
            enum: [createdAt, alphabet]
            default: createdAt
        - name: orderDirection
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Filtered collection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createItem
      summary: Create a collection item
      description: >-
        Creates a structured item in the requested `listType`. External provider identity and locally resolved
        canonical identity must be unique within the target list. Custom tags must not use reserved system or virtual
        tags. Optionally pass `targetOwnerShareCode` to create in another owner's list when exact create permission
        exists. `library` stores movies and series; `books` stores owned books; `wishlist`, `up-next`, and `tracking`
        accept movies, series, and books. Favorites are allowed only on `library` and `books`.
      tags: [Collection]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        '200':
          description: Item created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /collection-items/matches:
    post:
      operationId: getMatchedItems
      summary: Get collection items from matched external identities
      description: >-
        Returns caller-owned and readable shared items ordered by each item's first rank in `identities`. Pagination
        preserves that rank order. General collection `orderBy` and `orderDirection` controls are not supported here.
      tags: [Collection]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionMatchedItemsRequest'
      responses:
        '200':
          description: Filtered matched collection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /collection-items/suggestions:
    get:
      operationId: getItemSearchSuggestions
      summary: Get item search suggestions
      description: Returns suggestions from caller-owned items and exact readable shared scopes in the selected list.
      tags: [Collection]
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: listType
          in: query
          required: false
          description: List to search suggestions within. Defaults to `library`.
          schema:
            type: string
            enum: [library, up-next, wishlist, tracking, books]
      responses:
        '200':
          description: Search suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemSuggestionsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /collection-items/exists:
    get:
      operationId: itemExists
      summary: Check whether an external metadata item already exists
      tags: [Collection]
      parameters:
        - name: imdbId
          in: query
          required: false
          deprecated: true
          description: Legacy IMDb ID fallback. Prefer `externalIdentitySource` plus `externalIdentityId`.
          schema:
            type: string
        - name: externalIdentitySource
          in: query
          required: false
          description: External identity source name. Required with `externalIdentityId` unless `imdbId` is used.
          schema:
            type: string
            enum: [omdb, openlibrary, imdb, isbn]
        - name: externalIdentityId
          in: query
          required: false
          description: External identity ID. Required with `externalIdentitySource` unless `imdbId` is used.
          schema:
            type: string
        - name: externalIds
          in: query
          required: false
          description: 'JSON array of `{ "source": string, "id": string }` identities used to resolve cross-provider duplicates locally.'
          schema:
            type: string
        - name: ownerShareCode
          in: query
          required: false
          description: Owner share code whose selected list should be checked. The caller needs read permission for the matching content scope. Defaults to the authenticated user.
          schema:
            type: string
        - name: listType
          in: query
          required: false
          description: List to check. Defaults to `library`.
          schema:
            type: string
            enum: [library, up-next, wishlist, tracking, books]
            default: library
      responses:
        '200':
          description: Existing item status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemExistsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /collection-items/random:
    get:
      operationId: getRandomItem
      summary: Get a random collection item
      description: Returns one random library item from caller-owned items and exact readable shared library/content scopes.
      tags: [Collection]
      responses:
        '200':
          description: Random collection item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /collection-items/random-images:
    get:
      operationId: getRandomImages
      summary: Get random collection image URLs
      description: Returns random library image URLs from caller-owned items and exact readable shared library/content scopes.
      tags: [Collection]
      parameters:
        - name: count
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Random image URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RandomImagesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /collection-items/actions/mark-movies-completed:
    post:
      operationId: markAllMoviesAsCompleted
      summary: Mark all movies as completed
      description: Copies every uncompleted movie in the selected library into the authenticated user's tracking. When `ownerShareCode` is provided, the selected shared library requires read permission and the shared owner's items are not modified.
      tags: [Collection]
      parameters:
        - name: ownerShareCode
          in: query
          schema:
            type: string
          description: Optional owner share code for using an incoming shared library as the source.
      responses:
        '200':
          description: Number of items that were updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /collection-items/actions/mark-movies-uncompleted:
    post:
      operationId: markAllMoviesAsUncompleted
      summary: Mark all movies as uncompleted
      description: Removes authenticated-user tracking copies that correspond to movies in the selected library. When `ownerShareCode` is provided, the selected shared library requires read permission and the shared owner's items are not modified.
      tags: [Collection]
      parameters:
        - name: ownerShareCode
          in: query
          schema:
            type: string
          description: Optional owner share code for using an incoming shared library as the source.
      responses:
        '200':
          description: Number of items that were updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /collection-items/actions/mark-series-completed:
    post:
      operationId: markAllSeriesAsCompleted
      summary: Mark all series as completed
      description: Copies every untracked series in the selected library into the authenticated user's tracking, fetches season metadata from the configured external metadata provider only for newly added series, and marks all available episodes completed for matching tracker items. When `ownerShareCode` is provided, the selected shared library requires read permission and the shared owner's items are not modified.
      tags: [Collection]
      parameters:
        - name: ownerShareCode
          in: query
          schema:
            type: string
          description: Optional owner share code for using an incoming shared library as the source.
      responses:
        '200':
          description: Number of tracking items newly tracked and number with changed progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllSeriesCompletedEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /collection-items/actions/mark-series-uncompleted:
    post:
      operationId: markAllSeriesAsUncompleted
      summary: Mark all series as uncompleted
      description: Clears completed episode progress for authenticated-user tracking items that correspond to series in the selected library. Tracking items and season metadata are kept. When `ownerShareCode` is provided, the selected shared library requires read permission and the shared owner's items are not modified.
      tags: [Collection]
      parameters:
        - name: ownerShareCode
          in: query
          schema:
            type: string
          description: Optional owner share code for using an incoming shared library as the source.
      responses:
        '200':
          description: Number of items that were updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
