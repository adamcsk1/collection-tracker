<div class="header" role="banner">
  <img [src]="'icons/' + themeLogo()" [alt]="translations.title()" />
  <div>
    <h1 class="app-title-style">{{ translations.title() }}</h1>
  </div>
</div>

<nav class="menu-nav" role="navigation" [attr.aria-label]="translations.menu()">
  <a
    data-test-id="nav-collection"
    [routerLink]="['/', 'collection']"
    [class.active]="isCollectionActive()"
    class="highlight"
    (click)="onClose()"
  >
    <i class="material-icons">movie</i>
    {{ translations.collection() }}
  </a>
  <a
    data-test-id="nav-favorites"
    [routerLink]="['/', 'collection']"
    [queryParams]="{ search: FAVORITE_TAG }"
    routerLinkActive="active"
    class="highlight"
    (click)="onClose()"
  >
    <i class="material-icons">star</i>
    {{ translations.favorites() }}
  </a>
  <a
    data-test-id="nav-settings"
    [routerLink]="['/', 'settings']"
    routerLinkActive="active"
    class="highlight"
    (click)="onClose()"
  >
    <i class="material-icons">settings</i>
    {{ translations.settings() }}
  </a>
  <a [routerLink]="['/', 'statistics']" routerLinkActive="active" class="highlight space" (click)="onClose()">
    <i class="material-icons">bar_chart</i>
    {{ translations.statistics() }}
  </a>
  <a data-test-id="nav-sync" href="#" (click)="onSync()">
    <i class="material-icons">sync</i>
    {{ translations.sync() }}
  </a>
  <a data-test-id="nav-about" [routerLink]="['/', 'about']" routerLinkActive="active" (click)="onClose()">
    <i class="material-icons">info</i>
    {{ translations.about() }}
  </a>
  <a data-test-id="nav-logout" href="#" (click)="onLogout()">
    <i class="material-icons">logout</i>
    {{ translations.logout() }}
  </a>
</nav>
