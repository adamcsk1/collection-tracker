<div class="skip-links" data-dialog-background>
  @if (searchAvailable()) {
    <button type="button" data-test-id="skip-to-search" (click)="onSkipToSearch()">
      {{ translations.skipToSearch() }}
    </button>
  }
  <button type="button" data-test-id="skip-to-content" (click)="onSkipToContent()">
    {{ translations.skipToContent() }}
  </button>
</div>
<ct-header class="main-header" data-dialog-background />
<ct-float-actions data-dialog-background />
<div class="layout-body" data-dialog-background>
  <ct-menu-nav class="sidebar" />
  <div #mainContent class="main-body" role="main" tabindex="-1" data-test-id="main-content">
    <h1 class="page-heading" data-test-id="page-heading">{{ translations.pageTitle() }}</h1>
    <router-outlet />
  </div>
</div>
@if (useAnimatedBackground()) {
  @defer (on idle) {
    <libc-poster-background [refreshTrigger]="backgroundImagesRefreshTrigger()" />
  }
}
<libc-spinner-loading />
<libc-toast />
<libc-blocker-loading />
<ng-container #portal />
