<section
  class="float-search-bar"
  data-test-id="float-search-bar"
  [class.float-search-bar-no-search]="!searchAvailable()"
  [class.float-search-bar-menu-only]="showMenuOnlyBar()"
  [class.float-search-bar-search-expanded]="searchAvailable() && searchExpanded()"
>
  <button
    data-test-id="nav-menu-button"
    class="menu-button button-icon material-icons"
    [attr.aria-label]="translations.menu()"
    [title]="translations.menu()"
    (click)="onOpenMenu()"
  >
    menu
  </button>
  @if (searchAvailable()) {
    @let template = searchTemplate();
    @if (searchExpanded()) {
      <div
        #searchContent
        class="float-search-content"
        animate.enter="float-search-content-enter"
        animate.leave="float-search-content-leave"
      >
        @if (template) {
          <ng-container [ngTemplateOutlet]="template" />
        }
      </div>
    } @else {
      <button
        data-test-id="float-search-toggle"
        class="search-toggle-button button-icon material-icons"
        [attr.aria-label]="translations.search()"
        [title]="translations.search()"
        (click)="onShowSearch()"
      >
        search
      </button>
    }
  }

  @if (aiSearchAvailable()) {
    <button
      data-test-id="float-ai-search-button"
      class="ai-search-button button-icon material-icons"
      [class.ai-search-button-active]="aiSearchActive()"
      [attr.aria-label]="translations.aiSearch()"
      [attr.aria-pressed]="aiSearchActive() ? 'true' : 'false'"
      [title]="translations.aiSearch()"
      (click)="onOpenAiSearch()"
    >
      hub
    </button>
  }

  @if (showFloatActions() && actionsComponent(); as component) {
    <div class="float-actions-slot">
      <ng-container [ngComponentOutlet]="component" />
    </div>
  }
</section>

@if (config().scrollToTopAvailable && !actionButtonsVisible()) {
  <div
    class="float-button float-button-scroll-to-top"
    [class.float-button-scroll-to-top-no-search-bar]="!searchAvailable() && !showFloatActions()"
    animate.enter="animation-fade-in"
    animate.leave="animation-fade-out"
  >
    <button
      data-test-id="scroll-to-top"
      class="scroll-to-top-button"
      [attr.aria-label]="translations.scrollToTop()"
      [title]="translations.scrollToTop()"
      (click)="onScrollToTop()"
    >
      <span class="material-icons" aria-hidden="true">arrow_upward</span>
      <span>{{ translations.scrollToTop() }}</span>
    </button>
  </div>
}
