<div class="header" role="banner">
  <a [routerLink]="['/']" class="logo-link">
    <img [src]="'icons/' + themeLogo()" [alt]="('Title' | signalTranslate)()" />
    <div>
      <h1 class="app-title-style">{{ ('Title' | signalTranslate)() }}</h1>
    </div>
  </a>
</div>
<button
  data-test-id="nav-menu-button"
  class="menu-button button-icon material-icons"
  [attr.aria-label]="('Menu' | signalTranslate)()"
  [title]="('Menu' | signalTranslate)()"
  (click)="onOpenMenu()"
>
  menu
</button>
