<div data-test-id="statistics-content" class="statistics-content">
  <div class="statistics-header" data-test-id="statistics-header">
    <h2 data-test-id="statistics-view-title">
      {{ store.state.view() === 'year' ? translations.year() : translations.collection() }}
    </h2>
    <ct-collection-media-chips
      data-test-id="statistics-media-chips"
      [active]="store.state.selectedScope()"
      [booksEnabled]="featurePreferences().books"
      [musicEnabled]="featurePreferences().music"
      [navigate]="false"
      (selectionChange)="store.setState('selectedScope', $event)"
    />
  </div>
  <div
    data-test-id="statistics-scroll"
    class="statistics-scroll"
    role="region"
    tabindex="0"
    [attr.aria-label]="translations.statistics()"
  >
    <libc-tabs
      data-test-id="statistics-views"
      idPrefix="statistics-view"
      [ariaLabel]="translations.statistics()"
      [options]="viewTabs()"
      [selected]="store.state.view()"
      (selectedChange)="store.setState('view', $event)"
    >
      <ng-container tabs-first-content>
        @if (store.state.view() === 'year') {
          @defer (on immediate) {
            <ct-statistics-activity />
          }
        }
      </ng-container>
      <ng-container tabs-second-content>
        @if (store.state.view() === 'collection') {
          @defer (on immediate) {
            <ct-statistics-collection />
          }
        }
      </ng-container>
    </libc-tabs>
  </div>
</div>
