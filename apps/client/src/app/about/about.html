<div class="about">
  <img [src]="'icons/' + themeLogo()" [title]="('Title' | signalTranslate)()" [alt]="('Title' | signalTranslate)()" />
  <h2 class="app-title-style">{{ ('Title' | signalTranslate)() }}</h2>
  <h3>{{ ('Build' | signalTranslate)() }}</h3>
  <div>
    <div>{{ build }}</div>
  </div>
  <h3>{{ ('BuildDate' | signalTranslate)() }}</h3>
  <div>
    <div>{{ buildDate }}</div>
  </div>
  <h3>{{ ('AppVersion' | signalTranslate)() }}</h3>
  <div
    tabindex="0"
    role="button"
    [attr.aria-label]="('AppVersion' | signalTranslate)()"
    (click)="onClickAppVersion()"
    (keydown)="onClickAppVersion()"
  >
    <div>{{ appVersion }}</div>
  </div>
  <h3>{{ ('Links' | signalTranslate)() }}</h3>
  <div class="about-links">
    <a
      href="https://github.com/adamcsk1/collection-tracker"
      target="_blank"
      role="link"
      [attr.aria-label]="('ViewOnGitHub' | signalTranslate)()"
    >
      <img src="images/view-on-github.svg" [alt]="('ViewOnGitHub' | signalTranslate)()" />
    </a>
    <a
      href="https://github.com/adamcsk1/collection-tracker/releases/latest/download/collection-tracker-release.apk"
      target="_blank"
      role="link"
      [attr.aria-label]="('DownloadApk' | signalTranslate)()"
    >
      <img src="images/download-apk.svg" [alt]="('DownloadApk' | signalTranslate)()" />
    </a>
  </div>
</div>
