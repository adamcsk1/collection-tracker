<div class="about">
  <img src="icons/logo.png" [title]="('Title' | signalTranslate)()" [alt]="('Title' | signalTranslate)()" />
  <h2>{{ ('Title' | signalTranslate)() }}</h2>
  <h3>{{ ('Build' | signalTranslate)() }}</h3>
  <div>
    <div>{{ build }}</div>
  </div>
  <h3>{{ ('BuildDate' | signalTranslate)() }}</h3>
  <div>
    <div>{{ buildDate }}</div>
  </div>
  <h3>{{ ('AppVersion' | signalTranslate)() }}</h3>
  <div (click)="onClickAppVersion()" (keydown)="onClickAppVersion()" tabindex="0" role="button">
    <div>{{ appVersion }}</div>
  </div>
  <h3>{{ ('Repository' | signalTranslate)() }}</h3>
  <div>
    <div>
      <a href="https://github.com/adamcsk1/collection-tracker" target="_blank">{{ ('GitHub' | signalTranslate)() }}</a>
    </div>
  </div>
</div>
