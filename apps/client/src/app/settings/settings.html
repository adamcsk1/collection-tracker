<div class="settings-layout">
  <nav class="settings-nav" role="navigation" [attr.aria-label]="translations.settings()">
    <a data-test-id="settings-nav-basics" [routerLink]="['/', 'settings', 'basics']" routerLinkActive="active">
      {{ translations.basics() }}
    </a>
    @if (!settingLockEnabled()) {
      <a data-test-id="settings-nav-account" [routerLink]="['/', 'settings', 'account']" routerLinkActive="active">
        {{ translations.user() }}
      </a>
      <a
        data-test-id="settings-nav-access-tokens"
        [routerLink]="['/', 'settings', 'access-tokens']"
        routerLinkActive="active"
      >
        {{ translations.accessTokens() }}
      </a>
      <a
        data-test-id="settings-nav-tag-configs"
        [routerLink]="['/', 'settings', 'tag-configs']"
        routerLinkActive="active"
      >
        {{ translations.tagConfig() }}
      </a>
    }
    <a data-test-id="settings-nav-images" [routerLink]="['/', 'settings', 'images']" routerLinkActive="active">
      {{ translations.images() }}
    </a>
    <a
      data-test-id="settings-nav-global-watch-status"
      [routerLink]="['/', 'settings', 'global-watch-status']"
      routerLinkActive="active"
    >
      {{ translations.globalWatchStatus() }}
    </a>
  </nav>
  <hr />
  <div class="settings-content">
    <router-outlet />
  </div>
</div>
