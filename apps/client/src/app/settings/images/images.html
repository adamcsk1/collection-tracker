<p>{{ translations.messageMissingImages() }}</p>

<div class="actions">
  @if (showLibrarySelect()) {
    <libc-select
      data-test-id="settings-images-refresh-library"
      [label]="translations.library()"
      [value]="selectedOwnerShareCode()"
      [options]="libraryOptions()"
      [disabled]="apiLoadNetworkStatus() === 'pending'"
      (valueChange)="onLibraryChange($event)"
    />
  }
  <button
    data-test-id="settings-images-refresh-start"
    type="button"
    [disabled]="apiLoadNetworkStatus() === 'pending'"
    (click)="onStartImagesRefresh()"
  >
    <i class="material-icons" [title]="translations.start()"> start </i>
    {{ translations.start() }}
  </button>
</div>
