<div data-test-id="settings-account-actions">
  <libc-callout data-test-id="account-actions-info" icon="article">
    {{ translations.messageUserSettings() }}
  </libc-callout>

  <div class="actions">
    <button data-test-id="settings-create-user-token" (click)="onCreateNewUserToken()">
      <i class="material-icons" [title]="translations.createNewUserToken()"> add </i>
      {{ translations.createNewUserToken() }}
    </button>
    <button data-test-id="settings-delete-user" class="button-danger" (click)="onDeleteUser()">
      <i class="material-icons" [title]="translations.deleteUser()"> delete </i>
      {{ translations.deleteUser() }}
    </button>
  </div>
</div>
