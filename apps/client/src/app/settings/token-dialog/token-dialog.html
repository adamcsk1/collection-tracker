<libc-dialog-shell>
  <ng-container dialog-shell-top-content>
    <h3 class="dialog-title">
      <i class="material-icons" [title]="title()"> key </i>
      {{ title() }}
    </h3>
  </ng-container>
  <ng-container dialog-shell-content>
    <code data-test-id="token-dialog-value" id="secret">{{ token() }}</code>
    <a
      data-test-id="token-dialog-copy"
      class="text-button"
      tabindex="0"
      [attr.aria-label]="translations.copyToClipboard()"
      (click)="onCopyToClipboard()"
      (keyup.enter)="onCopyToClipboard()"
    >
      {{ translations.copyToClipboard() }}
    </a>
    <small> {{ message() }} </small>
  </ng-container>
</libc-dialog-shell>
