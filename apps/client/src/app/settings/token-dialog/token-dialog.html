<libc-dialog-shell>
  <ng-container dialog-shell-top-content>
    <h3>{{ title() }}</h3>
  </ng-container>
  <ng-container dialog-shell-content>
    <code id="secret">{{ token() }}</code>
    <a class="small-text-button" tabindex="0" (click)="onCopyToClipboard()" (keyup.enter)="onCopyToClipboard()">
      {{ ('CopyToClipboard' | signalTranslate)() }}
    </a>
    <small>
      {{ message() }}
    </small>
  </ng-container>
</libc-dialog-shell>
