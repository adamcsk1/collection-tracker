<p>{{ ('Message.GlobalWatchStatus' | signalTranslate)() }}</p>
<div class="actions">
  <button data-test-id="settings-mark-all-watched" type="button" (click)="onMarkAllAsWatched()">
    <i class="material-icons" [title]="('MarkAllAsWatched' | signalTranslate)()"> visibility </i>
    {{ ('MarkAllAsWatched' | signalTranslate)() }}
  </button>
  <button
    data-test-id="settings-mark-all-unwatched"
    type="button"
    class="button-danger"
    (click)="onMarkAllAsUnwatched()"
  >
    <i class="material-icons" [title]="('MarkAllAsUnwatched' | signalTranslate)()"> visibility_off </i>
    {{ ('MarkAllAsUnwatched' | signalTranslate)() }}
  </button>
</div>
