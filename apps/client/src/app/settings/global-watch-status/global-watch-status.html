<p>{{ translations.messageGlobalWatchStatus() }}</p>
<div class="actions">
  <button data-test-id="settings-mark-all-watched" type="button" (click)="onMarkAllAsWatched()">
    <i class="material-icons" [title]="translations.markAllAsWatched()"> visibility </i>
    {{ translations.markAllAsWatched() }}
  </button>
  <button
    data-test-id="settings-mark-all-unwatched"
    type="button"
    class="button-danger"
    (click)="onMarkAllAsUnwatched()"
  >
    <i class="material-icons" [title]="translations.markAllAsUnwatched()"> visibility_off </i>
    {{ translations.markAllAsUnwatched() }}
  </button>
</div>
