<libc-callout data-test-id="access-tokens-info" icon="article">
  {{ translations.messageAccessTokenSettings() }}
</libc-callout>
<div class="access-tokens-toolbar">
  <button data-test-id="settings-create-access-token" (click)="onCreateAccessToken()">
    <i class="material-icons" [title]="translations.createNewAccessToken()">add</i>
    {{ translations.createNewAccessToken() }}
  </button>
</div>
<div data-test-id="settings-access-tokens" class="access-tokens" role="list">
  @for (accessToken of accessTokens(); track accessToken.tokenHash) {
    <ct-token-item role="listitem" [accessToken]="accessToken" (revokeAccessToken)="onRevokeAccessToken($event)" />
  }
</div>
