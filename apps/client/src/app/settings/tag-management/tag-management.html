<libc-callout data-test-id="tag-management-info" icon="article">
  {{ translations.messageTagManagement() }}
</libc-callout>
<div class="tag-management-toolbar">
  <libc-input
    data-test-id="tag-management-filter"
    [icon]="'search'"
    [showReset]="true"
    [placeholder]="translations.placeholderFilterTags()"
    type="text"
    (valueChange)="onFilterChange($event)"
  />
  <button data-test-id="tag-management-reset" (click)="onResetTagManagement()">
    <i class="material-icons" [title]="translations.resetToDefault()">close</i>
    {{ translations.resetToDefault() }}
  </button>
</div>
<div data-test-id="tag-management-list" class="tag-management" role="list">
  @for (tagManagement of tagManagement(); track tagManagement.tag) {
    <ct-tag-management-card
      role="listitem"
      [tagManagement]="tagManagement"
      (colorChange)="onTagColorChange(tagManagement.tag, $event)"
      (weightChange)="onWeightChange(tagManagement.tag, $event)"
      (imageBorderChange)="onUseForImageBorderChange(tagManagement.tag, $event)"
      (textColorChange)="onUseForTextColorChange(tagManagement.tag, $event)"
      (imageBadgeChange)="onUseForImageBadgeChange(tagManagement.tag, $event)"
      (rename)="onRenameTag(tagManagement.tag, $event)"
    />
  }
</div>
