<p>{{ translations.messageTagConfig() }}</p>
<div class="tag-configs-toolbar">
  <libc-input
    data-test-id="tag-configs-filter"
    [icon]="'search'"
    [showReset]="true"
    [placeholder]="translations.placeholderFilterTags()"
    type="text"
    (valueChange)="onFilterChange($event)"
  />
  <button data-test-id="tag-configs-reset" (click)="onResetTagConfigs()">
    <i class="material-icons" [title]="translations.resetToDefault()">close</i>
    {{ translations.resetToDefault() }}
  </button>
  <button data-test-id="tag-configs-export" (click)="onExportTagConfigs()">
    <i class="material-icons" [title]="translations.exportLabel()">download</i>
    {{ translations.exportLabel() }}
  </button>
  <button data-test-id="tag-configs-import" (click)="onImportTagConfigsClick(tagConfigsImportFile)">
    <i class="material-icons" [title]="translations.importLabel()">upload</i>
    {{ translations.importLabel() }}
  </button>
  <input
    #tagConfigsImportFile
    data-test-id="tag-configs-import-file"
    class="tag-configs-import-file"
    type="file"
    accept="application/json,.json"
    (change)="onImportTagConfigs($event)"
  />
</div>
<div data-test-id="tag-configs-list" class="tag-configs" role="list">
  @for (tagConfig of tagConfigs(); track tagConfig.tag) {
    <ct-tag-config-card
      role="listitem"
      [tagConfig]="tagConfig"
      (colorChange)="onTagColorChange(tagConfig.tag, $event)"
      (weightChange)="onWeightChange(tagConfig.tag, $event)"
      (imageBorderChange)="onUseForImageBorderChange(tagConfig.tag, $event)"
      (textColorChange)="onUseForTextColorChange(tagConfig.tag, $event)"
      (imageBadgeChange)="onUseForImageBadgeChange(tagConfig.tag, $event)"
    />
  }
</div>
