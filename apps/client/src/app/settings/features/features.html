<form role="form" data-test-id="settings-features-form" [formRoot]="form">
  <p>{{ translations.message() }}</p>
  <libc-checkbox
    data-test-id="settings-feature-wishlist"
    [formField]="form.wishlist"
    [label]="translations.wishlist()"
    (valueChange)="onChange('wishlist', $event)"
  />
  <libc-checkbox
    data-test-id="settings-feature-watchlist"
    [formField]="form.watchlist"
    [label]="translations.watchlist()"
    (valueChange)="onChange('watchlist', $event)"
  />
  <libc-checkbox
    data-test-id="settings-feature-watching"
    [formField]="form.watching"
    [label]="translations.watching()"
    (valueChange)="onChange('watching', $event)"
  />
  <libc-checkbox
    data-test-id="settings-feature-watched"
    [formField]="form.watched"
    [label]="translations.watched()"
    (valueChange)="onChange('watched', $event)"
  />
  <libc-checkbox
    data-test-id="settings-feature-books"
    [formField]="form.books"
    [label]="translations.books()"
    (valueChange)="onChange('books', $event)"
  />
</form>
