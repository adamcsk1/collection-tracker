<form role="form" data-test-id="settings-features-form" [formRoot]="form">
  <p>{{ translations.message() }}</p>
  <libc-checkbox
    data-test-id="settings-feature-wishlist"
    [formField]="form.wishlist"
    [label]="translations.wishlist()"
    (valueChange)="onChange('wishlist', $event)"
  />
  <libc-checkbox
    data-test-id="settings-feature-up-next"
    [formField]="form.upNext"
    [label]="translations.upNext()"
    (valueChange)="onChange('upNext', $event)"
  />
  <libc-checkbox
    data-test-id="settings-feature-tracking"
    [formField]="form.tracking"
    [label]="translations.tracking()"
    (valueChange)="onChange('tracking', $event)"
  />
  <libc-checkbox
    data-test-id="settings-feature-books"
    [formField]="form.books"
    [label]="translations.books()"
    (valueChange)="onChange('books', $event)"
  />
</form>
