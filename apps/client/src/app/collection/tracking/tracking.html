<div class="collection-container collection-container--with-chips">
  <ng-template #floatSearch>
    <libc-autocomplete
      data-test-id="tracking-search"
      [placeholder]="translations.placeholderSearchInTracking()"
      [formField]="searchTextField"
      [showReset]="true"
      [suggestionListPlacement]="'top'"
      (userEvent)="onSearchFromUser()"
    />
  </ng-template>
  <ct-collection-media-chips
    [active]="activeMediaChip()"
    [listRoute]="'tracking'"
    [allowedChips]="mediaChips"
    [booksEnabled]="booksEnabled()"
    [musicEnabled]="musicEnabled()"
  />
  <ct-list
    [listType]="'tracking'"
    [dataSource]="trackingDataSource"
    [routeSearchText]="querySearch()"
    [routeFilterKey]="queryFilterKey()"
    [emptyIcon]="emptyIcon()"
  >
    <span list-empty>
      {{ translations.messageEmptyTracking() }}<br />
      <a data-test-id="add-first-tracking-item" href="#" role="button" (click)="onAddTracking($event)">{{
        translations.messageAddFirstTracking()
      }}</a>
    </span>
  </ct-list>
</div>
