@if (collectionItem(); as collectionItem) {
  <div
    class="image"
    [style.backgroundImage]="'url(' + collectionItem.image + ')'"
    (click)="onOpenDetail()"
    (keyup)="onOpenDetail()"
    tabindex="0"
    role="button"
  ></div>
  <div class="content">
    <h3>
      <a href="#" (click)="onOpenDetail()" (keyup)="onOpenDetail()">
        {{ collectionItem.title }}
      </a>
    </h3>
    <span>
      @for (genre of collectionItem.genre; track $index) {
        <small>
          <a href="#" (click)="onSetSearchText(genre)">{{ genre }}</a> &nbsp;
        </small>
      }
    </span>
    <span>
      @for (tag of collectionItem.tags; track $index) {
        <small>
          <a href="#" (click)="onSetSearchText(tag)">{{ tag }}</a> &nbsp;
        </small>
      }
    </span>
  </div>
}
