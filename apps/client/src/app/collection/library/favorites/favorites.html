<div class="collection-container">
  <ct-list
    [showAddButton]="false"
    [showAiSearchButton]="false"
    [showRandomPickButton]="false"
    [orderStorageKey]="'favorites'"
    [routeSearchText]="favoriteTag"
    [dataSource]="favoritesDataSource"
  >
    <span list-empty>
      {{ translations.messageEmptyFavorites() }}<br />
      {{ translations.messageAddFirstFavorite() }}
    </span>
  </ct-list>
</div>
