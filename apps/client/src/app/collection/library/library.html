<div class="collection-container">
  <ng-template #floatSearch>
    <libc-autocomplete
      data-test-id="collection-search"
      [placeholder]="translations.placeholderSearchInCollection()"
      [formField]="searchTextField"
      [showReset]="true"
      [suggestionListPlacement]="'top'"
      (userEvent)="onSearchFromUser()"
      (userAcceptSuggestionEvent)="onSearchAccepted()"
    />
  </ng-template>
  <ct-list
    [routeSearchText]="querySearch()"
    [routeFilterKey]="queryFilterKey()"
    [dataSource]="collectionDataSource"
    (randomPick)="onRandomPick()"
    (showFunctions)="onShowFunctions()"
  />
</div>
