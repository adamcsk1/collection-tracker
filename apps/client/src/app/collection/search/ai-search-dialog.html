<libc-dialog-shell [ariaLabel]="translations.aiSearch()" [contentSized]="true">
  <ng-container dialog-shell-content>
    <libc-textarea
      data-test-id="ai-search-textarea"
      [label]="translations.aiSearch()"
      [formField]="formField()"
      [placeholder]="placeholder()"
      [rows]="5"
    />
  </ng-container>
  <ng-container dialog-shell-bottom-content>
    <div class="dialog-action-group">
      <button
        type="button"
        data-test-id="ai-search-info"
        class="dialog-action"
        [attr.aria-label]="translations.aiSearchInfo()"
        [title]="translations.messageAiSearch()"
        [attr.aria-description]="translations.messageAiSearch()"
        (click)="onShowMessage()"
      >
        <i class="material-icons" aria-hidden="true">help_outline</i>
        <span>{{ translations.aiSearchInfo() }}</span>
      </button>
      <button
        type="button"
        data-test-id="ai-search-send"
        class="dialog-action dialog-action-primary"
        (click)="onSend()"
      >
        <i class="material-icons" aria-hidden="true">search</i>
        <span>{{ translations.search() }}</span>
      </button>
    </div>
  </ng-container>
</libc-dialog-shell>
