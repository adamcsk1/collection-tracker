<div class="collection-container">
  <ng-template #floatSearch>
    <libc-autocomplete
      data-test-id="watch-later-search"
      [placeholder]="translations.placeholderSearchInWatchLater()"
      [formField]="searchTextField"
      [showReset]="true"
      [suggestionListPlacement]="'top'"
    />
  </ng-template>
  <ct-list [listType]="'watch-later'" [dataSource]="watchLaterDataSource" [routeFilterKey]="queryFilterKey()">
    <span list-empty>
      {{ translations.messageEmptyWatchLater() }}<br />
      <a data-test-id="add-first-watch-later-item" href="#" role="button" (click)="onAddWatchLater($event)">{{
        translations.messageAddFirstWatchLater()
      }}</a>
    </span>
  </ct-list>
</div>
