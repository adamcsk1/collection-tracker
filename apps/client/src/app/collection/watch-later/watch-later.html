<div class="collection-container collection-container--with-chips">
  <ng-template #floatSearch>
    <libc-autocomplete
      data-test-id="watchlist-search"
      [placeholder]="translations.placeholderSearchInWatchlist()"
      [formField]="searchTextField"
      [showReset]="true"
      [suggestionListPlacement]="'top'"
      (userEvent)="onSearchFromUser()"
    />
  </ng-template>
  <ct-collection-media-chips
    [active]="activeMediaChip()"
    [listRoute]="'watchlist'"
    [allowedChips]="mediaChips"
    [booksEnabled]="booksEnabled()"
  />
  <ct-list
    [listType]="'watchlist'"
    [dataSource]="watchlistDataSource"
    [routeFilterKey]="queryFilterKey()"
    [emptyIcon]="emptyIcon()"
  >
    <span list-empty>
      {{ translations.messageEmptyWatchlist() }}<br />
      <a data-test-id="add-first-watchlist-item" href="#" role="button" (click)="onAddWatchlist($event)">{{
        translations.messageAddFirstWatchlist()
      }}</a>
    </span>
  </ct-list>
</div>
