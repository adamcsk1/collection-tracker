<div class="collection-container collection-container--with-chips">
  <ng-template #floatSearch>
    <libc-autocomplete
      data-test-id="wishlist-search"
      [placeholder]="translations.placeholderSearchInWishlist()"
      [formField]="searchTextField"
      [showReset]="true"
      [suggestionListPlacement]="'top'"
      (userEvent)="onSearchFromUser()"
    />
  </ng-template>
  <ct-collection-media-chips
    [active]="activeMediaChip()"
    [listRoute]="'wishlist'"
    [allowedChips]="mediaChips"
    [booksEnabled]="booksEnabled()"
  />
  <ct-list
    [listType]="'wishlist'"
    [dataSource]="wishlistDataSource"
    [routeFilterKey]="queryFilterKey()"
    [emptyIcon]="emptyIcon()"
  >
    <span list-empty>
      {{ translations.messageEmptyWishlist() }}<br />
      <a data-test-id="add-first-wishlist-item" href="#" role="button" (click)="onAddWishlist($event)">{{
        translations.messageAddFirstWishlist()
      }}</a>
    </span>
  </ct-list>
</div>
