<div class="collection-container">
  <ng-template #floatSearch>
    <libc-autocomplete
      data-test-id="wishlist-search"
      [placeholder]="translations.placeholderSearchInWishlist()"
      [formField]="searchTextField"
      [showReset]="true"
      [suggestionListPlacement]="'top'"
    />
  </ng-template>
  <ct-list [listType]="'wishlist'" [dataSource]="wishlistDataSource">
    <span list-empty>
      {{ translations.messageEmptyWishlist() }}<br />
      <a data-test-id="add-first-wishlist-item" href="#" role="button" (click)="onAddWishlist($event)">{{
        translations.messageAddFirstWishlist()
      }}</a>
    </span>
  </ct-list>
</div>
