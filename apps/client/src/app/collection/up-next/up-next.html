<div class="collection-container collection-container--with-chips">
  <ng-template #floatSearch>
    <libc-autocomplete
      data-test-id="up-next-search"
      [placeholder]="translations.placeholderSearchInUpNext()"
      [formField]="searchTextField"
      [showReset]="true"
      [suggestionListPlacement]="'top'"
      (userEvent)="onSearchFromUser()"
    />
  </ng-template>
  <ct-collection-media-chips
    [active]="activeMediaChip()"
    [listRoute]="'up-next'"
    [allowedChips]="mediaChips"
    [booksEnabled]="booksEnabled()"
    [musicEnabled]="musicEnabled()"
  />
  <ct-list
    [listType]="'up-next'"
    [dataSource]="upNextDataSource"
    [routeFilterKey]="queryFilterKey()"
    [emptyIcon]="emptyIcon()"
  >
    <span list-empty>
      {{ translations.messageEmptyUpNext() }}<br />
      <a data-test-id="add-first-up-next-item" href="#" role="button" (click)="onAddUpNext($event)">{{
        translations.messageAddFirstUpNext()
      }}</a>
    </span>
  </ct-list>
</div>
