@if (collectionItem(); as collectionItem) {
  <ct-list-item-card
    [imageUrl]="imageUrl()"
    [title]="collectionItem.title"
    [meta]="itemMeta()"
    metaTestId="list-item-year"
    [completed]="watchedStyle()"
    [completedImage]="watchedStyle()"
    [completedLabel]="watchedStyleLabel()"
    [completedTestId]="watchedStyleTestId()"
    [imageBadgeText]="imageBadgeTag()"
    [imageBadgeBackgroundColor]="badgeBackgroundColor()"
    [imageBadgeTextColor]="badgeTextColor()"
    [imageBadgeDisabled]="imageBadgeDisabled()"
    [rating]="selectedRating()"
    [favorite]="favorite()"
    [favoriteLabel]="translations.favorite()"
    [shared]="listDisplayPreferences().showSharedIcon && shared()"
    [sharedLabel]="translations.shared()"
    (open)="onOpenDetail()"
    (imageBadgeClick)="onSetSearchText(imageBadgeTag())"
  />
}
