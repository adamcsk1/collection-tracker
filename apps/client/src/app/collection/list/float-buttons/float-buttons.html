@if (scrollToTopAvailable()) {
  <div
    class="float-button float-button-scroll-to-top"
    [class.float-button-scroll-to-top-offset]="showFloatButtons()"
    animate.enter="animation-fade-in"
    animate.leave="animation-fade-out"
  >
    <button
      data-test-id="scroll-to-top"
      class="button-icon material-icons"
      [attr.aria-label]="('ScrollToTop' | signalTranslate)()"
      [title]="('ScrollToTop' | signalTranslate)()"
      (click)="onScrollToTop()"
    >
      arrow_upward
    </button>
  </div>
}
@if (showFloatButtons()) {
  <div class="float-buttons-container" animate.enter="animation-scale-in" animate.leave="animation-scale-out">
    @if (permissionAdd()) {
      <div class="float-button">
        <button
          data-test-id="add-new"
          class="button-icon material-icons"
          [attr.aria-label]="('AddNew' | signalTranslate)()"
          [title]="('AddNew' | signalTranslate)()"
          [disabled]="apiLoadNetworkStatus() === 'pending'"
          (click)="onAddNew()"
        >
          add
        </button>
      </div>
    }
    @if (aiAvailable()) {
      <div class="float-button">
        <button
          data-test-id="ai-search-toggle"
          class="button-icon"
          [attr.aria-label]="
            useAiSearch() ? ('SwitchToStandardSearch' | signalTranslate)() : ('SwitchToAiSearch' | signalTranslate)()
          "
          [title]="
            useAiSearch() ? ('SwitchToStandardSearch' | signalTranslate)() : ('SwitchToAiSearch' | signalTranslate)()
          "
          [disabled]="apiLoadNetworkStatus() === 'pending'"
          [class.material-icons]="!useAiSearch()"
          (click)="onToggleAiSearch()"
        >
          @if (useAiSearch()) {
            <libc-image-icon [ariaLabel]="('AiSearch' | signalTranslate)()" imageUrl="/client/images/ollama-icon.png" />
          } @else {
            search
          }
        </button>
      </div>
    }
    <div class="float-button">
      <button
        data-test-id="random-pick"
        class="button-icon material-icons"
        [attr.aria-label]="('RandomPick' | signalTranslate)()"
        [title]="('RandomPick' | signalTranslate)()"
        [disabled]="apiLoadNetworkStatus() === 'pending' || collectionLength() === 0"
        (click)="onRandomPick()"
      >
        casino
      </button>
    </div>
  </div>
} @else {
  <div class="float-button float-show-button" animate.enter="animation-scale-in" animate.leave="animation-scale-out">
    <button
      data-test-id="show-functions"
      class="button-icon material-icons"
      [attr.aria-label]="('ShowFunctions' | signalTranslate)()"
      [title]="('ShowFunctions' | signalTranslate)()"
      (click)="showFloatButtons.set(true)"
    >
      apps
    </button>
  </div>
}
