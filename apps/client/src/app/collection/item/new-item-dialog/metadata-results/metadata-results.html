<section class="content-selector" [attr.aria-label]="label()" [attr.data-test-id]="testIdPrefix() + '-select'">
  <span class="content-selector-label">
    {{ label() }}
    @if (mandatory()) {
      <span aria-hidden="true">*</span>
    }
  </span>
  <div class="content-options" [attr.data-test-id]="testIdPrefix() + '-options'">
    @for (option of options(); track option.value) {
      <button
        type="button"
        class="content-option card card-interactive"
        [attr.data-test-id]="testIdPrefix() + '-option'"
        [class.selected]="'' + option.value === selectedValue()"
        [attr.aria-pressed]="'' + option.value === selectedValue()"
        [disabled]="disabled() || option.disabled"
        (click)="onSelect(option)"
      >
        <ct-list-item-card
          [imageUrl]="imageUrl(option)"
          [title]="option.text"
          [meta]="meta(option)"
          [interactive]="false"
          [imageTestId]="testIdPrefix() + '-option-image'"
          [titleTestId]="testIdPrefix() + '-option-title'"
          [metaTestId]="testIdPrefix() + '-option-meta'"
        />
        @if (option.hint) {
          <small class="option-hint">{{ option.hint }}</small>
        }
      </button>
    }
  </div>
</section>
