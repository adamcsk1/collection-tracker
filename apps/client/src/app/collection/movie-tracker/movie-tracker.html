<div class="collection-container collection-container--with-chips">
  <ng-template #floatSearch>
    <libc-autocomplete
      data-test-id="finished-search"
      [placeholder]="translations.placeholderSearchInWatched()"
      [formField]="searchTextField"
      [showReset]="true"
      [suggestionListPlacement]="'top'"
      (userEvent)="onSearchFromUser()"
    />
  </ng-template>
  <ct-collection-media-chips
    [active]="activeMediaChip()"
    [listRoute]="'finished'"
    [allowedChips]="mediaChips"
    [booksEnabled]="booksEnabled()"
  />
  <ct-list
    [listType]="'finished'"
    [dataSource]="watchedDataSource"
    [routeSearchText]="querySearch()"
    [routeFilterKey]="queryFilterKey()"
    [emptyIcon]="emptyIcon()"
  >
    <span list-empty>
      {{ translations.messageEmptyWatched() }}<br />
      <a data-test-id="add-first-finished-item" href="#" role="button" (click)="onAddWatched($event)">{{
        translations.messageAddFirstWatched()
      }}</a>
    </span>
  </ct-list>
</div>
