<div class="collection-container">
  <ng-template #floatSearch>
    <libc-autocomplete
      data-test-id="watched-search"
      [placeholder]="translations.placeholderSearchInWatched()"
      [formField]="searchTextField"
      [showReset]="true"
      [suggestionListPlacement]="'top'"
      (userEvent)="onSearchFromUser()"
    />
  </ng-template>
  <ct-list
    [listType]="'watched'"
    [dataSource]="watchedDataSource"
    [routeSearchText]="querySearch()"
    [routeFilterKey]="queryFilterKey()"
  >
    <span list-empty>
      {{ translations.messageEmptyWatched() }}<br />
      <a data-test-id="add-first-watched-item" href="#" role="button" (click)="onAddWatched($event)">{{
        translations.messageAddFirstWatched()
      }}</a>
    </span>
  </ct-list>
</div>
