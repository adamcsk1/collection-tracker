<libc-dialog-shell>
  <ng-container dialog-shell-top-content>
    <h3>{{ ('Title.CollectionItem' | signalTranslate)() }}</h3>
  </ng-container>
  <ng-container dialog-shell-content>
    <div class="editor-pane">
      <libc-markdown-editor
        [formField]="rawContentField"
        [autoHeight]="true"
        [editMode]="editMode()"
      ></libc-markdown-editor>
    </div>
  </ng-container>
  <ng-container dialog-shell-bottom-content>
    @if (editMode()) {
      <button [title]="('ReadOnly' | signalTranslate)()" (click)="onReadOnly()">
        {{ ('ReadOnly' | signalTranslate)() }}
      </button>
      <button [title]="('Save' | signalTranslate)()" (click)="onSaveChanges()">
        {{ ('Save' | signalTranslate)() }}
      </button>
    } @else {
      @if (permissionUpdate()) {
        @if (watched()) {
          <button [title]="('MarkAsUnwatched' | signalTranslate)()" (click)="onMarkAsUnwatched()">
            {{ ('MarkAsUnwatched' | signalTranslate)() }}
          </button>
        } @else {
          <button [title]="('MarkAsWatched' | signalTranslate)()" (click)="onMarkAsWatched()">
            {{ ('MarkAsWatched' | signalTranslate)() }}
          </button>
        }
        <button [title]="('Edit' | signalTranslate)()" (click)="onEdit()">
          {{ ('Edit' | signalTranslate)() }}
        </button>
      }
      @if (permissionDelete()) {
        <button class="button-danger" [title]="('Delete' | signalTranslate)()" (click)="onDelete()">
          {{ ('Delete' | signalTranslate)() }}
        </button>
      }
    }
  </ng-container>
</libc-dialog-shell>
