<div class="collection-container">
  <ng-template #floatSearch>
    <libc-autocomplete
      data-test-id="watching-search"
      [placeholder]="translations.placeholderSearchInWatching()"
      [formField]="searchTextField"
      [showReset]="true"
      [suggestionListPlacement]="'top'"
      (userEvent)="onSearchFromUser()"
    />
  </ng-template>
  <ct-list
    [listType]="'watching'"
    [dataSource]="watchingDataSource"
    [routeSearchText]="querySearch()"
    [routeFilterKey]="queryFilterKey()"
  >
    <span list-empty>
      {{ translations.messageEmptyWatching() }}<br />
      <a data-test-id="add-first-watching-item" href="#" role="button" (click)="onAddWatching($event)">{{
        translations.messageAddFirstWatching()
      }}</a>
    </span>
  </ct-list>
</div>
