<div class="collection-container">
  <ng-template #floatSearch>
    <libc-autocomplete
      data-test-id="series-tracker-search"
      [placeholder]="translations.placeholderSearchInSeriesTracker()"
      [formField]="searchTextField"
      [showReset]="true"
      [suggestionListPlacement]="'top'"
    />
  </ng-template>
  <ct-list [listType]="'series-tracker'" [dataSource]="seriesTrackerDataSource" [routeSearchText]="querySearch()">
    <span list-empty>
      {{ translations.messageEmptySeriesTracker() }}<br />
      <a data-test-id="add-first-series-tracker-item" href="#" role="button" (click)="onAddSeriesTracker($event)">{{
        translations.messageAddFirstSeriesTracker()
      }}</a>
    </span>
  </ct-list>
</div>
