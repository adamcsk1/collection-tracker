<div class="collection-container">
  <ng-template #floatSearch>
    <libc-autocomplete
      data-test-id="books-search"
      [placeholder]="translations.placeholderSearchInBooks()"
      [formField]="searchTextField"
      [showReset]="true"
      [suggestionListPlacement]="'top'"
      (userEvent)="onSearchFromUser()"
    />
  </ng-template>
  <ct-list
    [listType]="'books'"
    [emptyIcon]="'menu_book'"
    [dataSource]="booksDataSource"
    [routeSearchText]="querySearch()"
    [routeFilterKey]="queryFilterKey()"
  >
    <span list-empty>
      {{ translations.messageEmptyBooks() }}<br />
      <a data-test-id="add-first-books-item" href="#" role="button" (click)="onAddBooks($event)">{{
        translations.messageAddFirstBooks()
      }}</a>
    </span>
  </ct-list>
</div>
