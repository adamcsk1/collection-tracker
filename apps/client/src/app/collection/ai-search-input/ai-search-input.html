<button
  data-test-id="ai-search-trigger"
  type="button"
  class="compact-trigger"
  [class.is-expanded]="isExpanded()"
  [attr.aria-label]="placeholder()"
  (click)="onExpand()"
>
  <span class="compact-text" [class.has-value]="currentValue()">{{ currentValue() || placeholder() }}</span>
  <i class="material-icons" aria-hidden="true">send</i>
</button>

@if (isExpanded()) {
  <button
    type="button"
    class="backdrop"
    animate.enter="animation-fade-in"
    animate.leave="animation-fade-out"
    aria-label="Close search panel"
    (click)="onCollapse()"
    (keydown.enter)="onCollapse()"
    (keydown.space)="onCollapse()"
  ></button>
  <div
    #expandedPanel
    class="expanded-panel"
    animate.enter="animation-ai-search-expand"
    animate.leave="animation-ai-search-collapse"
    tabindex="0"
    (keydown.escape)="onCollapse()"
  >
    <libc-textarea
      data-test-id="ai-search-textarea"
      [formField]="formField()"
      [placeholder]="placeholder()"
      [rows]="5"
    />
    <div class="panel-actions">
      <button
        data-test-id="ai-search-send"
        class="button-icon"
        [attr.aria-label]="('SendPrompt' | signalTranslate)()"
        [title]="('SendPrompt' | signalTranslate)()"
        (click)="onSend()"
        (keydown.enter)="onSend()"
      >
        <i class="material-icons">send</i>
      </button>
      <a
        class="text-button"
        href="#"
        role="button"
        [title]="('Message.AiSearch' | signalTranslate)()"
        [attr.aria-description]="('Message.AiSearch' | signalTranslate)()"
        (click)="onShowMessage()"
      >
        <libc-image-icon [ariaLabel]="('AiSearch' | signalTranslate)()" [imageUrl]="ollamaIcon" />
        <span>{{ ('AiSearchInfo' | signalTranslate)() }}</span>
      </a>
    </div>
  </div>
}
