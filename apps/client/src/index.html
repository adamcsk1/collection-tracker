<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <title>Collection tracker</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eee8d5" />
    <link rel="preload" href="fonts/material-icons-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Material Icons';
        font-style: normal;
        font-display: block;
        font-weight: 400;
        src: url('fonts/material-icons-latin-400-normal.woff2') format('woff2');
      }
    </style>
    <link rel="preload" href="icons/logo.png" as="image" fetchpriority="high" />
    <link rel="preload" href="icons/logo-light.png" as="image" media="(prefers-color-scheme: light)" />
    <link rel="preload" href="icons/logo-dark.png" as="image" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body data-collection-tracker>
    <ct-root></ct-root>
  </body>
</html>
