@defer (on idle) {
  <libc-poster-background />
}
<div
  class="card content"
  role="main"
  data-test-id="login-main"
  data-dialog-background
  [attr.aria-label]="translations.title()"
>
  <div class="header">
    <img [src]="'icons/' + themeLogo()" [alt]="translations.title()" />
    <div>
      <h1 class="app-title-style">{{ translations.title() }}</h1>
    </div>
  </div>
  <router-outlet></router-outlet>
</div>

<libc-toast />
<libc-blocker-loading />
<ng-container #portalHost />
