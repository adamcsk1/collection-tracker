name: Release

on:
  workflow_run:
    workflows:
      - Docker GHCR
    types:
      - completed
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-publisher
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  release:
    name: Package and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        channel: [snapshot, stable]
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)

    steps:
      - name: Check release gate
        id: gate
        uses: actions/github-script@v8
        with:
          script: |
            const requiredWorkflows = [
              'Android',
              'Cypress',
              'Format',
              'i18n',
              'Lint',
              'Test',
              'Typecheck',
            ];
            const { owner, repo } = context.repo;
            const snapshot = '${{ matrix.channel }}' === 'snapshot';
            // Nested workflow_run head_sha describes the workflow revision, not necessarily its checkout.
            const headSha = context.eventName === 'workflow_run'
              ? /^Docker GHCR ([a-f0-9]{40})$/.exec(context.payload.workflow_run.display_title)?.[1]
              : context.sha;
            const failWhenNotReady = context.eventName === 'push' || context.eventName === 'workflow_dispatch';

            core.setOutput('ready', 'false');
            core.setOutput('tag', '');
            if (!headSha) {
              core.notice('Docker run has no explicit build SHA; a new Docker run with the updated workflow is required.');
              return;
            }
            core.setOutput('sha', headSha);

            const notReady = (message) => {
              if (failWhenNotReady) {
                core.setFailed(message);
                return;
              }
              core.notice(`Skipping release; ${message}`);
            };

            const versionTagPattern = /^v\d+\.\d+\.\d+$/;
            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner,
              repo,
              ref: 'tags/v',
            });
            const tags = [];
            for (const ref of refs) {
              const tagName = ref.ref.replace(/^refs\/tags\//, '');
              if (!versionTagPattern.test(tagName)) continue;

              let commitSha = ref.object.sha;
              if (ref.object.type === 'tag') {
                const { data: tagObject } = await github.rest.git.getTag({
                  owner,
                  repo,
                  tag_sha: ref.object.sha,
                });
                commitSha = tagObject.object.sha;
              }

              if (commitSha === headSha) tags.push(tagName);
            }

            if (!snapshot && tags.length === 0) {
              if (context.eventName === 'workflow_dispatch' && context.ref.startsWith('refs/heads/')) {
                core.notice('No stable tag; snapshot only.');
                return;
              }
              notReady(`no vX.Y.Z tag on ${headSha}`);
              return;
            }
            if (!snapshot && tags.length > 1) {
              core.setFailed(`Multiple vX.Y.Z tags on ${headSha}: ${tags.join(', ')}`);
              return;
            }

            const tag = snapshot ? 'snapshot' : tags[0];
            const { data: packageFile } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'package.json',
              ref: headSha,
            });
            const packageVersion = JSON.parse(
              Buffer.from(packageFile.content, packageFile.encoding).toString('utf8')
            ).version;
            if (!snapshot && tag !== `v${packageVersion}`) {
              core.setFailed(`Tag ${tag} does not match package.json version ${packageVersion}`);
              return;
            }

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const { data: defaultBranch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: repository.default_branch,
            });
            if (defaultBranch.commit.sha !== headSha) {
              notReady(`${headSha} is not the ${repository.default_branch} tip`);
              return;
            }

            const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              branch: repository.default_branch,
              event: 'push',
              head_sha: headSha,
              per_page: 100,
            });

            const missingOrFailed = [];
            for (const workflowName of requiredWorkflows) {
              const workflowRun = workflowRuns.find(
                (run) => run.name === workflowName && run.head_sha === headSha
              );
              if (!workflowRun || workflowRun.status !== 'completed' || workflowRun.conclusion !== 'success') {
                const result = workflowRun?.conclusion ?? workflowRun?.status ?? 'missing';
                missingOrFailed.push(`${workflowName}: ${result}`);
              }
            }
            if (missingOrFailed.length) {
              notReady(`required workflows are not all green for ${headSha}: ${missingOrFailed.join(', ')}`);
              return;
            }

            const dockerPublishSucceeded = async (runId) => {
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: runId,
                per_page: 100,
              });
              const steps = jobs.jobs.flatMap((job) => job.steps || []);
              return ['Build and push Docker image', 'Build and push metadata-provider Docker image']
                .every((name) => steps.some((step) => step.name === name && step.conclusion === 'success'));
            };

            let dockerPublished = false;
            if (context.eventName === 'workflow_run') {
              dockerPublished = await dockerPublishSucceeded(context.payload.workflow_run.id);
            } else {
              const dockerRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: 'docker-ghcr.yml',
              });
              for (const run of dockerRuns) {
                if (run.display_title !== `Docker GHCR ${headSha}`) continue;
                if (run.status !== 'completed' || run.conclusion !== 'success') continue;
                if (await dockerPublishSucceeded(run.id)) {
                  dockerPublished = true;
                  break;
                }
              }
            }

            if (!dockerPublished) {
              notReady(`Docker GHCR did not publish an image for ${headSha}`);
              return;
            }

            core.setOutput('ready', 'true');
            core.setOutput('tag', tag);

      - name: Log in to GHCR
        if: steps.gate.outputs.ready == 'true' && matrix.channel == 'stable'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag GHCR image with version
        if: steps.gate.outputs.ready == 'true' && matrix.channel == 'stable'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SHA: ${{ steps.gate.outputs.sha }}
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:sha-$SHA"
          docker buildx imagetools create -t "$IMAGE-metadata-provider:$TAG" "$IMAGE-metadata-provider:sha-$SHA"

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.sha }}

      - name: Set up Node
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Set up Java
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.gate.outputs.ready == 'true'
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 14742923
          packages: platform-tools

      - name: Install Android platform
        if: steps.gate.outputs.ready == 'true'
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        if: steps.gate.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        if: steps.gate.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release signing secrets are required" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$HOME/release.jks" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Create release artifacts
        if: steps.gate.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_CHANNEL: ${{ matrix.channel }}
        run: |
          chmod +x android/gradlew
          if [ "$RELEASE_CHANNEL" = snapshot ]; then
            npm run release -- --snapshot
          else
            npm run release
          fi

      - name: Publish GitHub Release
        if: steps.gate.outputs.ready == 'true'
        uses: actions/github-script@v8
        env:
          TAG: ${{ steps.gate.outputs.tag }}
          RELEASE_SHA: ${{ steps.gate.outputs.sha }}
        with:
          script: |
            const { publish } = require('./scripts/publish-release.js');
            await publish({ github, context, core, artifactDir: 'release',
              tag: process.env.TAG, sha: process.env.RELEASE_SHA,
              branch: context.payload.repository.default_branch });
