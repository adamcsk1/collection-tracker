name: Docker GHCR

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Android
      - Cypress
      - Format
      - i18n
      - Lint
      - Test
      - Typecheck
    types:
      - completed

concurrency:
  group: docker-ghcr-${{ github.event.workflow_run.event || github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check required workflow results
        id: gate
        uses: actions/github-script@v8
        with:
          script: |
            const requiredWorkflows = [
              'Android',
              'Cypress',
              'Format',
              'i18n',
              'Lint',
              'Test',
              'Typecheck',
            ];
            const { owner, repo } = context.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const missingOrFailed = [];

            const { data: defaultBranch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: context.payload.repository.default_branch,
            });

            if (defaultBranch.commit.sha !== headSha) {
              core.notice(
                `Skipping publish; ${headSha} is no longer the ${context.payload.repository.default_branch} tip`
              );
              core.setOutput('ready', 'false');
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              branch: context.payload.workflow_run.head_branch,
              event: 'push',
              per_page: 100,
            });

            for (const workflowName of requiredWorkflows) {
              const workflowRun = data.workflow_runs.find(
                (run) => run.name === workflowName && run.head_sha === headSha
              );

              if (!workflowRun || workflowRun.status !== 'completed' || workflowRun.conclusion !== 'success') {
                const result = workflowRun?.conclusion ?? workflowRun?.status ?? 'missing';
                missingOrFailed.push(`${workflowName}: ${result}`);
              }
            }

            if (missingOrFailed.length) {
              core.notice(
                `Skipping publish; required workflows are not all green for ${headSha}: ${missingOrFailed.join(', ')}`
              );
              core.setOutput('ready', 'false');
              return;
            }

            core.setOutput('ready', 'true');

      - name: Log in to GHCR
        if: steps.gate.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '26.0.0'
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Build app artifacts
        if: steps.gate.outputs.ready == 'true'
        run: npm run build

      - name: Set up Docker Buildx
        if: steps.gate.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for smoke test
        if: steps.gate.outputs.ready == 'true'
        env:
          SMOKE_TAG: collection-tracker:smoke-${{ github.event.workflow_run.head_sha }}
        run: docker buildx build --load -t "$SMOKE_TAG" .

      - name: Smoke test Docker image
        if: steps.gate.outputs.ready == 'true'
        env:
          SMOKE_TAG: collection-tracker:smoke-${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p smoke-data
          printf '%s\n' \
            'HOST=0.0.0.0' \
            'PORT=3000' \
            'CORS_ORIGIN=*' \
            'OMDB_API_KEY=smoke-test' \
            'COOKIE_SECRET=smoke-test-cookie-secret' \
            'JWT_SECRET=smoke-test-jwt-secret' \
            'SALT=smoke-test-salt' \
            > smoke-data/.env

          docker run \
            --detach \
            --name collection-tracker-smoke \
            --publish 3001:3001 \
            --add-host=host.docker.internal:host-gateway \
            --env APP_UID=$(id -u) \
            --env APP_GID=$(id -g) \
            --volume "$PWD/smoke-data:/data" \
            "$SMOKE_TAG"

          trap 'docker logs collection-tracker-smoke; docker rm --force collection-tracker-smoke' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/ > /dev/null && \
              curl --fail --silent --show-error http://127.0.0.1:3001/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          exit 1

      - name: Recheck default branch tip
        if: steps.gate.outputs.ready == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const { data: defaultBranch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: context.payload.repository.default_branch,
            });

            if (defaultBranch.commit.sha !== headSha) {
              core.setFailed(
                `Skipping push; ${headSha} is no longer the ${context.payload.repository.default_branch} tip`
              );
            }

      - name: Extract Docker metadata
        if: steps.gate.outputs.ready == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}

      - name: Build and push Docker image
        if: steps.gate.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
