name: Docker GHCR

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Android
      - Cypress
      - Format
      - i18n
      - Lint
      - Test
      - Typecheck
    types:
      - completed

concurrency:
  group: docker-ghcr-${{ github.event.workflow_run.event || github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check required workflow results
        id: gate
        uses: actions/github-script@v8
        with:
          script: |
            const requiredWorkflows = [
              'Android',
              'Cypress',
              'Format',
              'i18n',
              'Lint',
              'Test',
              'Typecheck',
            ];
            const { owner, repo } = context.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const missingOrFailed = [];

            const { data: defaultBranch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: context.payload.repository.default_branch,
            });

            if (defaultBranch.commit.sha !== headSha) {
              core.notice(
                `Skipping publish; ${headSha} is no longer the ${context.payload.repository.default_branch} tip`
              );
              core.setOutput('ready', 'false');
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              branch: context.payload.workflow_run.head_branch,
              event: 'push',
              per_page: 100,
            });

            for (const workflowName of requiredWorkflows) {
              const workflowRun = data.workflow_runs.find(
                (run) => run.name === workflowName && run.head_sha === headSha
              );

              if (!workflowRun || workflowRun.status !== 'completed' || workflowRun.conclusion !== 'success') {
                const result = workflowRun?.conclusion ?? workflowRun?.status ?? 'missing';
                missingOrFailed.push(`${workflowName}: ${result}`);
              }
            }

            if (missingOrFailed.length) {
              core.notice(
                `Skipping publish; required workflows are not all green for ${headSha}: ${missingOrFailed.join(', ')}`
              );
              core.setOutput('ready', 'false');
              return;
            }

            core.setOutput('ready', 'true');

      - name: Log in to GHCR
        if: steps.gate.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '26.0.0'
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Build app artifacts
        if: steps.gate.outputs.ready == 'true'
        run: npm run build

      - name: Set up Docker Buildx
        if: steps.gate.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for smoke test
        if: steps.gate.outputs.ready == 'true'
        env:
          SMOKE_TAG: collection-tracker:smoke-${{ github.event.workflow_run.head_sha }}
        run: docker buildx build --load -t "$SMOKE_TAG" .

      - name: Test Docker lifecycle
        if: steps.gate.outputs.ready == 'true'
        env:
          DOCKER_LIFECYCLE_IMAGE: collection-tracker:smoke-${{ github.event.workflow_run.head_sha }}
        run: bash scripts/docker-lifecycle-test.sh

      - name: Smoke test trusted proxy handling
        if: steps.gate.outputs.ready == 'true'
        env:
          SMOKE_TAG: collection-tracker:smoke-${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p smoke-data
          docker network create collection-tracker-trusted-proxy-smoke > /dev/null
          trap 'docker logs collection-tracker-untrusted-proxy-smoke 2>/dev/null || true; docker logs collection-tracker-trusted-proxy-smoke 2>/dev/null || true; docker rm --force collection-tracker-untrusted-proxy-smoke collection-tracker-trusted-proxy-smoke 2>/dev/null || true; docker network rm collection-tracker-trusted-proxy-smoke 2>/dev/null || true; rm -rf smoke-data' EXIT
          trusted_proxy_cidr=$(docker network inspect collection-tracker-trusted-proxy-smoke --format '{{(index .IPAM.Config 0).Subnet}}')

          docker run \
            --detach \
            --name collection-tracker-untrusted-proxy-smoke \
            --network collection-tracker-trusted-proxy-smoke \
            --publish 3001:3001 \
            --add-host=host.docker.internal:host-gateway \
            --env APP_UID=$(id -u) \
            --env APP_GID=$(id -g) \
            --volume "$PWD/smoke-data:/data" \
            "$SMOKE_TAG"

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/api/v1/health > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true

          for attempt in {1..10}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "X-Forwarded-For: 203.0.113.$attempt" \
              --header 'Content-Type: application/json' \
              --data '{}' \
              http://127.0.0.1:3001/api/v1/auth/sign-in)
            test "$status" = 400
          done
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'X-Forwarded-For: 198.51.100.1' \
            --header 'Content-Type: application/json' \
            --data '{}' \
            http://127.0.0.1:3001/api/v1/auth/sign-in)
          test "$status" = 429
          docker rm --force collection-tracker-untrusted-proxy-smoke

          docker run \
            --detach \
            --name collection-tracker-trusted-proxy-smoke \
            --network collection-tracker-trusted-proxy-smoke \
            --publish 3001:3001 \
            --add-host=host.docker.internal:host-gateway \
            --env APP_UID=$(id -u) \
            --env APP_GID=$(id -g) \
            --env TRUSTED_PROXY_CIDRS="$trusted_proxy_cidr" \
            --volume "$PWD/smoke-data:/data" \
            "$SMOKE_TAG"

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/api/v1/health > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true

          for attempt in {1..11}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "X-Forwarded-For: 203.0.113.$attempt" \
              --header 'Content-Type: application/json' \
              --data '{}' \
              http://127.0.0.1:3001/api/v1/auth/sign-in)
            test "$status" = 400
          done

      - name: Recheck default branch tip
        if: steps.gate.outputs.ready == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const { data: defaultBranch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: context.payload.repository.default_branch,
            });

            if (defaultBranch.commit.sha !== headSha) {
              core.setFailed(
                `Skipping push; ${headSha} is no longer the ${context.payload.repository.default_branch} tip`
              );
            }

      - name: Resolve version tag
        if: steps.gate.outputs.ready == 'true'
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const versionTagPattern = /^v\d+\.\d+\.\d+$/;
            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner,
              repo,
              ref: 'tags/v',
            });
            const tags = [];
            for (const ref of refs) {
              const tagName = ref.ref.replace(/^refs\/tags\//, '');
              if (!versionTagPattern.test(tagName)) continue;

              let commitSha = ref.object.sha;
              if (ref.object.type === 'tag') {
                const { data: tagObject } = await github.rest.git.getTag({
                  owner,
                  repo,
                  tag_sha: ref.object.sha,
                });
                commitSha = tagObject.object.sha;
              }

              if (commitSha === headSha) tags.push(tagName);
            }

            if (tags.length > 1) {
              core.setFailed(`Multiple vX.Y.Z tags on ${headSha}: ${tags.join(', ')}`);
              return;
            }

            core.setOutput('tag', tags[0] || '');

      - name: Extract Docker metadata
        if: steps.gate.outputs.ready == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}

      - name: Build and push Docker image
        if: steps.gate.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
