name: i18n

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n:
    name: i18n keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.0.0'
          cache: npm
      - run: npm ci
      - run: npm run check-i18n
