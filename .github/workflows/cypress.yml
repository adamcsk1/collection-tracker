name: Cypress

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cypress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    name: Cypress (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.0.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress (${{ matrix.browser }})
        run: npm run cypress:${{ matrix.browser }}

      - name: Stop Cypress container
        if: always()
        run: bash apps/collection-e2e/scripts/stop.sh collection-tracker-cypress

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.browser }}
          path: apps/collection-e2e/cypress/screenshots
          if-no-files-found: ignore
