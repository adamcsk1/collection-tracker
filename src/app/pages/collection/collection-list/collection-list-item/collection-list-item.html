@if (collectionItem(); as collectionItem) {
  <div
    class="image"
    [ngStyle]="{ backgroundImage: 'url(' + collectionItem.image + ')' }"
    (click)="onOpenDetail()"
  ></div>
  <div class="content">
    <h3>
      <a (click)="onOpenDetail()">{{ collectionItem.title }}</a>
    </h3>
    <span>
      @for (genre of collectionItem.genre; track $index) {
        <small>
          <a (click)="onSetSearchText(genre)">{{ genre }}</a> &nbsp;
        </small>
      }
    </span>
    <span>
      @for (tag of collectionItem.tags; track $index) {
        <small>
          <a (click)="onSetSearchText(tag)">{{ tag }}</a> &nbsp;
        </small>
      }
    </span>
  </div>
}
