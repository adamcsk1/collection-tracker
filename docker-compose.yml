services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: collection-tracker:latest
    container_name: collection-tracker
    environment:
      BASE_PATH: ${BASE_PATH:-}
      HEALTH_CHECK_URL: ${HEALTH_CHECK_URL:-}
    ports:
      - "${APP_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.data:/data
    restart: unless-stopped
